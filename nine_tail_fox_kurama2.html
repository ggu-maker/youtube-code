<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>High-Fidelity Chibi Kurama</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      /* Cinematic dark background to make the glowing orange pop */
      background: radial-gradient(ellipse at center, #2a0800 0%, #0d0200 60%, #000000 100%);
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H, cx, cy;

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let mouseX = targetX;
    let mouseY = targetY;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2;
      cy = H / 2;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });
    resize();

    const TAIL_COUNT = 9;
    let t = 0;

    // ---------- High-Fidelity Embers ----------
    const embers = [];
    for (let i = 0; i < 80; i++) {
      embers.push({
        x: Math.random() * 2000 - 1000,
        y: Math.random() * 2000 - 1000,
        r: Math.random() * 3 + 1,
        speed: Math.random() * 1.5 + 0.5,
        drift: Math.random() * 1 - 0.5,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.5 ? '255,100,20' : '255,60,0'
      });
    }

    function drawBackground(dx, dy) {
      // Deep glowing aura behind Kurama
      const g = ctx.createRadialGradient(cx + dx * 10, cy + dy * 10, 50, cx, cy, Math.max(W, H) * 0.5);
      g.addColorStop(0, 'rgba(255, 60, 0, 0.25)');
      g.addColorStop(0.5, 'rgba(150, 20, 0, 0.1)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Floating cinematic embers
      for (const e of embers) {
        e.y -= e.speed;
        e.x += Math.sin(t * 0.02 + e.phase) * e.drift;
        if (e.y < -1000) e.y = 1000;
        
        // Parallax effect on embers
        const sx = cx + e.x - dx * (e.r * 5);
        const sy = cy + e.y - dy * (e.r * 5);
        
        const flicker = 0.5 + 0.5 * Math.sin(t * 0.1 + e.phase);
        ctx.beginPath();
        ctx.fillStyle = `rgba(${e.hue},${0.3 + flicker * 0.7})`;
        
        ctx.shadowBlur = 10 + flicker * 10;
        ctx.shadowColor = `rgb(${e.hue})`;
        ctx.arc(sx, sy, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
      }
    }

    function drawTail(index, total, dx, dy) {
      // Much wider, majestic fan spread
      const angleSpread = Math.PI * 1.6;
      const baseAngle = -Math.PI / 2 - angleSpread / 2 + (index / (total - 1)) * angleSpread;

      // Tails react to mouse direction
      const mouseSway = dx * 0.2; 
      const sway = Math.sin(t * 0.035 + index * 0.5) * 0.15 + mouseSway;
      
      // Significantly longer tails
      const length = 350 + Math.sin(t * 0.025 + index) * 30;
      const segments = 35;

      const points = [];
      for (let i = 0; i <= segments; i++) {
        const f = i / segments;
        const dist = f * length;
        const wave = Math.sin(t * 0.045 + f * 2.5 + index) * (40 * f);
        const angle = baseAngle + sway * f + wave * 0.01;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist * 0.85;
        points.push({ x, y, f });
      }

      const leftEdge = [];
      const rightEdge = [];
      for (let i = 0; i <= segments; i++) {
        const p = points[i];
        const f = i / segments;
        // Thicker, fluffier tails
        const w = Math.sin(Math.pow(f, 0.6) * Math.PI) * 60 + (1 - f) * 12;

        let nx = 0, ny = 0;
        if (i === 0) {
          const dlx = points[1].x - p.x; const dly = points[1].y - p.y;
          const l = Math.hypot(dlx, dly); nx = -dly / l; ny = dlx / l;
        } else if (i === segments) {
          const dlx = p.x - points[i - 1].x; const dly = p.y - points[i - 1].y;
          const l = Math.hypot(dlx, dly); nx = -dly / l; ny = dlx / l;
        } else {
          const dlx = points[i + 1].x - points[i - 1].x;
          const dly = points[i + 1].y - points[i - 1].y;
          const l = Math.hypot(dlx, dly); nx = -dly / l; ny = dlx / l;
        }

        leftEdge.push({ x: p.x + nx * w, y: p.y + ny * w });
        rightEdge.push({ x: p.x - nx * w, y: p.y - ny * w });
      }

      ctx.save();
      ctx.translate(cx + dx * 10, cy + 40 + dy * 10);

      // Deep glowing aura behind tail
      ctx.save();
      ctx.shadowColor = 'rgba(255,50,0,0.8)';
      ctx.shadowBlur = 35;

      ctx.beginPath();
      ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
      for (let i = 1; i <= segments; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
      for (let i = segments - 1; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
      ctx.closePath();

      // Striking gradient body: bright core fading to deep crimson tip
      const tailGrad = ctx.createLinearGradient(points[0].x, points[0].y, points[segments].x, points[segments].y);
      tailGrad.addColorStop(0, '#ffcc66');
      tailGrad.addColorStop(0.3, '#ff6600');
      tailGrad.addColorStop(1, '#880000');
      ctx.fillStyle = tailGrad;
      ctx.fill();
      ctx.restore();

      // Sharp cel-shading on the underside for a 3D anime look
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i <= segments; i++) ctx.lineTo(points[i].x, points[i].y);
      for (let i = segments - 1; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
      ctx.fillStyle = 'rgba(80,0,0,0.6)';
      ctx.fill();

      // Vivid rim highlight along the top edge
      ctx.beginPath();
      ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
      for (let i = 1; i <= segments; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
      ctx.strokeStyle = 'rgba(255,240,200,0.8)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Bold, fierce outline
      ctx.beginPath();
      ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
      for (let i = 1; i <= segments; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
      for (let i = segments - 1; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
      ctx.closePath();
      ctx.strokeStyle = '#110500';
      ctx.lineWidth = 4.5;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // Burning tail tip flame
      const tip = points[segments];
      const flicker = 4 + Math.sin(t * 0.2 + index) * 3;
      ctx.beginPath();
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff3300';
      ctx.fillStyle = 'rgba(255,200,100,0.9)';
      ctx.arc(tip.x, tip.y, flicker, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function bodyGradient(x0, y0, x1, y1, light, mid, dark) {
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, light);
      g.addColorStop(0.5, mid);
      g.addColorStop(1, dark);
      return g;
    }

    function drawKurama(dx, dy) {
      ctx.save();
      // Body follows cursor slightly
      ctx.translate(cx + dx * 25, cy + dy * 25);

      const bob = Math.sin(t * 0.05) * 3;
      ctx.translate(0, bob);

      ctx.strokeStyle = '#110500';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Darker, more intense orange body gradient
      const furGrad = bodyGradient(-40, -60, 40, 80, '#ffb84d', '#ff5500', '#991100');
      const shadowFill = 'rgba(80,10,0,0.4)';

      // ----- Back haunches -----
      ctx.fillStyle = furGrad;
      ctx.beginPath(); ctx.ellipse(-38, 60, 12, 16, -Math.PI / 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-36, 56, 7, 9, -Math.PI / 8, 0, Math.PI * 2); ctx.fillStyle = shadowFill; ctx.fill();

      ctx.fillStyle = furGrad;
      ctx.beginPath(); ctx.ellipse(38, 60, 12, 16, Math.PI / 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(36, 56, 7, 9, Math.PI / 8, 0, Math.PI * 2); ctx.fillStyle = shadowFill; ctx.fill();

      // ----- Main torso -----
      ctx.beginPath();
      ctx.moveTo(-22, 8);
      ctx.bezierCurveTo(-48, 24, -48, 56, -24, 73);
      ctx.bezierCurveTo(-10, 82, 10, 82, 24, 73);
      ctx.bezierCurveTo(46, 58, 44, 24, 20, 8);
      ctx.bezierCurveTo(8, 16, -8, 16, -22, 8);
      ctx.closePath();
      ctx.fillStyle = furGrad;
      ctx.fill(); ctx.stroke();

      // Torso shadow
      ctx.save();
      ctx.clip();
      ctx.beginPath();
      ctx.moveTo(-24, 50);
      ctx.bezierCurveTo(-30, 65, -10, 80, 14, 76);
      ctx.bezierCurveTo(30, 72, 40, 55, 36, 45);
      ctx.bezierCurveTo(20, 70, -8, 72, -24, 50);
      ctx.closePath();
      ctx.fillStyle = shadowFill;
      ctx.fill();
      ctx.restore();

      // Belly highlight patch
      ctx.beginPath();
      ctx.ellipse(-2, 48, 15, 21, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,200,100,0.5)';
      ctx.fill();

      // ----- Front legs -----
      ctx.fillStyle = furGrad;
      // Left
      ctx.beginPath(); ctx.moveTo(-16, 30); ctx.lineTo(-19, 64); ctx.quadraticCurveTo(-20, 76, -7, 76);
      ctx.quadraticCurveTo(2, 76, 0, 64); ctx.lineTo(-3, 30); ctx.quadraticCurveTo(-9, 26, -16, 30);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-13, 76); ctx.lineTo(-13, 70); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5, 76); ctx.lineTo(-5, 70); ctx.stroke();
      ctx.lineWidth = 4;

      // Right
      ctx.beginPath(); ctx.moveTo(16, 30); ctx.lineTo(20, 64); ctx.quadraticCurveTo(21, 76, 8, 76);
      ctx.quadraticCurveTo(-1, 76, 1, 64); ctx.lineTo(4, 30); ctx.quadraticCurveTo(10, 26, 16, 30);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(14, 76); ctx.lineTo(14, 70); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6, 76); ctx.lineTo(6, 70); ctx.stroke();
      ctx.lineWidth = 4;

      // Soft shadow where paws meet chest
      ctx.beginPath(); ctx.ellipse(0, 32, 14, 6, 0, 0, Math.PI * 2); ctx.fillStyle = shadowFill; ctx.fill();

      // Chest fur tuft
      ctx.beginPath();
      ctx.moveTo(-12, 26); ctx.bezierCurveTo(-6, 20, -4, 18, 0, 20); ctx.bezierCurveTo(4, 18, 6, 20, 12, 26);
      ctx.strokeStyle = 'rgba(80,10,0,0.5)'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.strokeStyle = '#110500'; ctx.lineWidth = 4;

      // -- Head --
      // Head follows cursor more dramatically
      ctx.translate(dx * 18, dy * 18 - 10);

      // Pitch up/down slightly based on cursor
      const headPitch = dy * 5;
      ctx.translate(0, headPitch);

      function drawEar(side) {
        ctx.save();
        ctx.scale(side, 1);
        // Ears turn slightly with cursor
        ctx.rotate(dx * side * 0.1); 

        // Taller, sharper ears
        ctx.fillStyle = bodyGradient(10, -115, 55, -10, '#ffc266', '#ff5500', '#991100');
        ctx.beginPath();
        ctx.moveTo(8, -20);
        ctx.bezierCurveTo(8, -60, 20, -100, 36, -130);
        ctx.bezierCurveTo(48, -100, 60, -50, 52, -12);
        ctx.bezierCurveTo(38, -22, 20, -22, 8, -20);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(36, -130);
        ctx.bezierCurveTo(48, -100, 60, -50, 52, -12);
        ctx.strokeStyle = 'rgba(255,220,150,0.8)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.strokeStyle = '#110500';
        ctx.lineWidth = 4;

        // Darker inner ear depth
        ctx.fillStyle = '#0a0300';
        ctx.beginPath();
        ctx.moveTo(16, -22);
        ctx.bezierCurveTo(18, -60, 28, -95, 35, -118);
        ctx.bezierCurveTo(42, -90, 47, -48, 43, -18);
        ctx.bezierCurveTo(32, -25, 23, -25, 16, -22);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
      drawEar(-1);
      drawEar(1);

      // Fluffier, wider base cheeks
      ctx.fillStyle = bodyGradient(-30, -95, 30, -45, '#ffc266', '#ff5500', '#991100');
      ctx.beginPath();
      ctx.moveTo(-15, -45); ctx.quadraticCurveTo(-20, -70, -35, -90);
      ctx.quadraticCurveTo(-10, -60, -5, -45); ctx.quadraticCurveTo(0, -80, 5, -95);
      ctx.quadraticCurveTo(10, -60, 15, -45); ctx.quadraticCurveTo(20, -70, 35, -90);
      ctx.quadraticCurveTo(15, -55, 15, -45);
      ctx.fill(); ctx.stroke();

      // Face base
      ctx.fillStyle = bodyGradient(-75, -50, 75, 30, '#ffc266', '#ff5500', '#991100');
      ctx.beginPath();
      ctx.moveTo(0, 32);
      ctx.quadraticCurveTo(25, 25, 50, 10);
      ctx.lineTo(70, 5); ctx.lineTo(55, -5);
      ctx.lineTo(80, -15); ctx.lineTo(55, -25);
      ctx.lineTo(70, -35); ctx.lineTo(40, -35);
      ctx.quadraticCurveTo(15, -50, 0, -50);
      ctx.quadraticCurveTo(-15, -50, -40, -35);
      ctx.lineTo(-70, -35); ctx.lineTo(-55, -25);
      ctx.lineTo(-80, -15); ctx.lineTo(-55, -5);
      ctx.lineTo(-70, 5); ctx.lineTo(-50, 10);
      ctx.quadraticCurveTo(-25, 25, 0, 32);
      ctx.fill(); ctx.stroke();

      // Deeper cheek shadow instead of blush
      ctx.fillStyle = 'rgba(100, 10, 0, 0.4)';
      ctx.beginPath(); ctx.ellipse(-46, 0, 12, 8, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(46, 0, 12, 8, 0.3, 0, Math.PI * 2); ctx.fill();

      // Fiercer Whiskers
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-40, -2); ctx.lineTo(-65, -8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-38, 8); ctx.lineTo(-60, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(40, -2); ctx.lineTo(65, -8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(38, 8); ctx.lineTo(60, 10); ctx.stroke();
      ctx.lineWidth = 4;

      // Badass Eyes
      function drawEye(side) {
        ctx.save();
        ctx.scale(side, 1);

        // Angry black mask
        ctx.fillStyle = '#0a0300';
        ctx.beginPath();
        ctx.moveTo(8, 2);
        ctx.bezierCurveTo(16, -26, 34, -32, 54, -22); 
        ctx.bezierCurveTo(62, -16, 60, -2, 50, 6);
        ctx.bezierCurveTo(36, 12, 20, 12, 8, 2);
        ctx.closePath();
        ctx.fill();

        // White Sclera
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.bezierCurveTo(22, -18, 36, -20, 46, -10);
        ctx.bezierCurveTo(40, 2, 30, 6, 20, 4);
        ctx.closePath();
        ctx.fill();

        // Pupils look towards cursor
        const localDx = side * dx; 
        const px = 28 + localDx * 4;
        const py = -5 + dy * 4;

        // Glowing red iris
        const irisGrad = ctx.createRadialGradient(px, py, 0.5, px, py, 9);
        irisGrad.addColorStop(0, '#ff3300');
        irisGrad.addColorStop(0.5, '#cc0000');
        irisGrad.addColorStop(1, '#550000');
        
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff1100';
        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.ellipse(px, py, 7, 8, -Math.PI / 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Thin demonic slit pupil
        ctx.fillStyle = '#0a0300';
        ctx.beginPath();
        ctx.ellipse(px, py, 1.5, 6, -Math.PI / 8, 0, Math.PI * 2);
        ctx.fill();

        // Sharp highlight
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(px - 3, py - 3, 1.5, 0, Math.PI * 2); ctx.fill();

        // Thick inner eyebrow
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(6, -14);
        ctx.bezierCurveTo(22, -34, 44, -34, 58, -22);
        ctx.stroke();

        ctx.restore();
      }
      drawEye(-1);
      drawEye(1);

      // Nose
      ctx.fillStyle = '#0a0300';
      ctx.beginPath();
      ctx.ellipse(0, 10, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Scowling mouth
      ctx.beginPath();
      ctx.moveTo(-10, 20);
      ctx.quadraticCurveTo(0, 16, 10, 20);
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      t += 1;
      
      // Easing the mouse tracking
      mouseX += (targetX - mouseX) * 0.08;
      mouseY += (targetY - mouseY) * 0.08;
      
      let dx = (mouseX - cx) / cx; // -1 to 1
      let dy = (mouseY - cy) / cy; // -1 to 1

      // Clamp so it doesn't break limits
      dx = Math.max(-1, Math.min(1, dx));
      dy = Math.max(-1, Math.min(1, dy));

      ctx.clearRect(0, 0, W, H);

      drawBackground(dx, dy);

      const tailOrder = [0, 8, 1, 7, 2, 6, 3, 5, 4];
      for (let i of tailOrder) {
        drawTail(i, TAIL_COUNT, dx, dy);
      }

      drawKurama(dx, dy);

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
