<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Singularity</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .title {
    position: fixed; top: 18px; left: 22px; pointer-events: none;
    color: rgba(255,255,255,0.85); font: 13px monospace; letter-spacing: 5px;
    text-transform: uppercase; text-shadow: 0 0 14px #ff9040;
  }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; pointer-events: none;
    color: rgba(255,255,255,0.55); font: 12px/1.6 monospace; letter-spacing: 3px;
    text-transform: uppercase; text-shadow: 0 0 10px #000;
  }
  #err {
    position: fixed; inset: 0; display: none; padding: 24px; z-index: 10;
    background: #1a0000; color: #ffb4b4; font: 13px/1.5 monospace; white-space: pre-wrap; overflow: auto;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title" id="title">Singularity</div>
<div class="hud">Drag: orbit · Scroll / pinch: zoom · Click: energy pulse · M: mic · Space: pause rotation · F: fullscreen</div>
<div id="err"></div>

<script>
(function () {
'use strict';

const canvas  = document.getElementById('c');
const titleEl = document.getElementById('title');
const errEl   = document.getElementById('err');

// Any problem is shown on screen so it can be reported, not silently ignored.
function fail(msg) { errEl.style.display = 'block'; errEl.textContent = msg; console.error(msg); }
window.addEventListener('error', e => fail('Runtime error: ' + e.message));

const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' })
        || canvas.getContext('experimental-webgl');
if (!gl) { fail('WebGL is not available in this browser.\nTry the latest Chrome, Edge or Firefox, and make sure hardware acceleration is on.'); return; }
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('The graphics context was lost. Please reload the page.'); });

// ---------------------------------------------------------------- shaders
const VS = `
attribute vec2 a;
varying vec2 vUv;
void main(){ vUv = a * 0.5 + 0.5; gl_Position = vec4(a, 0.0, 1.0); }
`;

const PRECISION = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
`;

// Pass 1: ray-marched black hole. Light is bent by integrating photon paths
// around a Schwarzschild black hole (horizon radius = 1, photon sphere = 1.5).
const SCENE_FS = PRECISION + `
uniform vec2  uRes;
uniform vec3  uCam, uRight, uUp, uFwd;
uniform float uFov, uTime, uBass, uClickT;

#define MAXSTEPS 130

float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p3){
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
float noise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash13(i), hash13(i + vec3(1.0,0.0,0.0)), f.x),
        mix(hash13(i + vec3(0.0,1.0,0.0)), hash13(i + vec3(1.0,1.0,0.0)), f.x), f.y),
    mix(mix(hash13(i + vec3(0.0,0.0,1.0)), hash13(i + vec3(1.0,0.0,1.0)), f.x),
        mix(hash13(i + vec3(0.0,1.0,1.0)), hash13(i + vec3(1.0,1.0,1.0)), f.x), f.y),
    f.z);
}
float fbm(vec3 p){
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++){ v += a * noise(p); p = p * 2.03 + 17.0; a *= 0.5; }
  return v;
}

vec3 starLayer(vec3 d, float scale, float density, float size){
  vec3 p  = d * scale;
  vec3 id = floor(p);
  vec3 f  = fract(p);
  float h = hash13(id);
  if (h < density) return vec3(0.0);
  vec3 o = hash33(id + 7.1) * 0.6 + 0.2;
  vec3 dv = f - o;
  float dd = dot(dv, dv);
  float tw = (h - density) / (1.0 - density);
  vec3 tint = mix(vec3(1.0, 0.72, 0.5), vec3(0.62, 0.78, 1.0), hash13(id + 3.3));
  return tint * exp(-dd * size) * (0.35 + tw * 2.4);
}

vec3 background(vec3 d){
  float n  = fbm(d * 2.2 + 3.0);
  float n2 = fbm(d * 4.6 - 9.0);
  vec3 c = vec3(0.004, 0.003, 0.012);
  c += vec3(0.50, 0.10, 0.55) * smoothstep(0.42, 0.85, n)  * 0.30;
  c += vec3(0.05, 0.30, 0.55) * smoothstep(0.48, 0.90, n2) * 0.26;
  float g = d.y * 0.9 + d.x * 0.3;
  float band = exp(-g * g * 14.0);
  c += vec3(0.85, 0.62, 0.50) * band * (0.10 + 0.55 * fbm(d * 7.0)) * 0.30;
  c += starLayer(d,  60.0, 0.80, 40.0);
  c += starLayer(d, 130.0, 0.88, 70.0) * 0.8;
  return c;
}

vec3 bb(float T){
  vec3 c = vec3(1.0, 0.26, 0.05);
  c = mix(c, vec3(1.0, 0.60, 0.22), smoothstep(0.20, 0.50, T));
  c = mix(c, vec3(1.0, 0.86, 0.68), smoothstep(0.45, 0.85, T));
  c = mix(c, vec3(0.72, 0.86, 1.00), smoothstep(0.85, 1.30, T));
  return c;
}

// Emission of the accretion disk where a ray crosses the equatorial plane.
vec4 diskSample(vec3 hit, vec3 vel){
  float r = length(hit.xz);
  float rin = 2.1;
  float rout = 11.0;
  if (r < rin || r > rout) return vec4(0.0);

  float ang   = atan(hit.z, hit.x);
  float omega = 1.5 / (r * sqrt(r));
  float a     = ang - omega * uTime;
  vec3  P     = vec3(cos(a) * 2.2, sin(a) * 2.2, r * 1.7);
  float n     = fbm(P);
  float rings = 0.5 + 0.5 * sin(r * 9.0 + n * 5.0);
  float dens  = smoothstep(0.12, 0.85, n * 1.25 + rings * 0.35);
  float edge  = smoothstep(rin, rin + 0.5, r) * (1.0 - smoothstep(rout - 4.0, rout, r));

  float T = pow(rin / r, 0.75);

  // relativistic Doppler beaming + gravitational redshift
  vec3  tang  = vec3(-hit.z, 0.0, hit.x) / r;
  float vOrb  = sqrt(0.5 / (r - 1.0));
  vec3  nPh   = -normalize(vel);
  float gam   = 1.0 / sqrt(1.0 - vOrb * vOrb);
  float D     = 1.0 / (gam * (1.0 - vOrb * dot(tang, nPh)));
  float g     = D * sqrt(max(1.0 - 1.0 / r, 0.0));
  float Tobs  = T * g;
  float I     = pow(Tobs, 3.0) * 1.9;

  vec3 em = bb(Tobs) * I * (1.0 + uBass * 0.9);

  // energy pulse travelling outward along the disk
  float front = 2.0 + uClickT * 7.0;
  float w = r - front;
  float boost = exp(-w * w * 0.8) * exp(-uClickT * 0.35);
  em += vec3(0.55, 0.80, 1.00) * boost * 1.3;

  float alpha = clamp(max(dens * edge, boost * edge * 0.4), 0.0, 1.0);
  return vec4(em, alpha);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  vec3 rd = normalize(uFwd + uRight * (uv.x * 2.0 * uFov) + uUp * (uv.y * 2.0 * uFov));

  vec3 pos = uCam;
  vec3 vel = rd;
  vec3 hv  = cross(pos, vel);
  float h2 = dot(hv, hv);

  vec3  col = vec3(0.0);
  vec3  pglow = vec3(0.0);                      // photon-sphere glow, only kept for rays that escape
  float trans = 1.0;
  float jit = hash13(vec3(gl_FragCoord.xy, 1.0));
  bool  captured = false;
  bool  escaped  = false;

  for (int i = 0; i < MAXSTEPS; i++){
    float r2 = dot(pos, pos);
    float r  = sqrt(r2);
    if (r < 1.0){ captured = true; break; }

    float dt = min(0.025 + 0.055 * (r - 1.0), 1.6);
    if (i == 0) dt *= jit;                      // per-pixel jitter hides step banding
    vec3 acc = -1.5 * h2 * pos / (r2 * r2 * r);
    vel += acc * dt;
    vec3 prev = pos;
    pos += vel * dt;

    // equatorial plane crossing = accretion disk
    if (prev.y * pos.y < 0.0){
      float t = prev.y / (prev.y - pos.y);
      vec3 hit = mix(prev, pos, t);
      vec4 s = diskSample(hit, vel);
      col += trans * s.rgb * s.a;
      trans *= 1.0 - s.a * 0.92;
    }

    if (r < 25.0){
      // soft vertical thickness of the disk
      float rho2 = dot(pos.xz, pos.xz);
      float rr = sqrt(rho2);
      float hz = exp(-pos.y * pos.y * 6.0) * smoothstep(2.0, 3.0, rr) * (1.0 - smoothstep(5.0, 11.0, rr));
      col += trans * vec3(1.0, 0.52, 0.18) * hz * dt * 0.10;

      // glow hugging the photon sphere
      float pr = r - 1.5;
      pglow += trans * vec3(1.0, 0.80, 0.55) * exp(-pr * pr * 60.0) * dt * 0.22;

      // twin plasma jets along the spin axis
      float ay  = abs(pos.y);
      float jet = exp(-rho2 * (3.0 + 0.5 * ay)) * smoothstep(1.2, 2.5, ay) * exp(-ay * 0.12);
      col += trans * vec3(0.35, 0.50, 1.40) * jet * dt * (0.55 + 0.45 * sin(ay * 2.5 - uTime * 5.0)) * 0.5 * (1.0 + uBass);
    }

    if (r > 40.0 && dot(pos, vel) > 0.0){ escaped = true; break; }
    if (trans < 0.02) break;
  }

  if (!captured){
    col += pglow;
    if (escaped || dot(pos, pos) > 9.0) col += trans * background(normalize(vel));
  }

  // tone map
  col = 1.0 - exp(-col * 1.15);
  col = pow(col, vec3(0.92));
  gl_FragColor = vec4(col, 1.0);
}
`;

// bright-pass / downsample
const PRE_FS = PRECISION + `
uniform sampler2D uTex;
uniform vec2  uTexel;
uniform float uThr;
varying vec2 vUv;
void main(){
  vec3 c = texture2D(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
  c *= 0.25;
  float l = max(c.r, max(c.g, c.b));
  float k = uThr <= 0.0 ? 1.0 : smoothstep(uThr, uThr + 0.35, l);
  gl_FragColor = vec4(c * k, 1.0);
}
`;

// separable gaussian blur
const BLUR_FS = PRECISION + `
uniform sampler2D uTex;
uniform vec2 uDir;
varying vec2 vUv;
void main(){
  vec3 c = texture2D(uTex, vUv).rgb * 0.227027;
  c += (texture2D(uTex, vUv + uDir * 1.0).rgb + texture2D(uTex, vUv - uDir * 1.0).rgb) * 0.1945946;
  c += (texture2D(uTex, vUv + uDir * 2.0).rgb + texture2D(uTex, vUv - uDir * 2.0).rgb) * 0.1216216;
  c += (texture2D(uTex, vUv + uDir * 3.0).rgb + texture2D(uTex, vUv - uDir * 3.0).rgb) * 0.0540541;
  c += (texture2D(uTex, vUv + uDir * 4.0).rgb + texture2D(uTex, vUv - uDir * 4.0).rgb) * 0.0162162;
  gl_FragColor = vec4(c, 1.0);
}
`;

// final composite: bloom, chromatic aberration, grain, vignette
const POST_FS = PRECISION + `
uniform sampler2D uScene, uB1, uB2;
uniform vec2  uRes;
uniform float uTime, uBass, uBloom;
varying vec2 vUv;
float hash12(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 cd = vUv - 0.5;
  float ab = 0.0012 + uBass * 0.004 + dot(cd, cd) * 0.006;
  vec3 col;
  col.r = texture2D(uScene, vUv + cd * ab * 2.0).r;
  col.g = texture2D(uScene, vUv).g;
  col.b = texture2D(uScene, vUv - cd * ab * 2.0).b;
  vec3 bl = texture2D(uB1, vUv).rgb * 0.60 + texture2D(uB2, vUv).rgb * 0.95;
  col += bl * uBloom;
  col += (hash12(vUv * uRes + fract(uTime) * 97.0) - 0.5) * 0.03;
  col *= 1.0 - 0.9 * dot(cd, cd);
  gl_FragColor = vec4(col, 1.0);
}
`;

// ---------------------------------------------------------------- GL helpers
function compile(type, src, name) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    fail('Shader compile error in ' + name + ':\n' + gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function program(fs, name) {
  const vs = compile(gl.VERTEX_SHADER, VS, name + ' (vertex)');
  const f  = compile(gl.FRAGMENT_SHADER, fs, name + ' (fragment)');
  if (!vs || !f) return null;
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, f);
  gl.bindAttribLocation(p, 0, 'a');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    fail('Shader link error in ' + name + ':\n' + gl.getProgramInfoLog(p));
    return null;
  }
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    p.u[info.name] = gl.getUniformLocation(p, info.name);
  }
  return p;
}

const sceneProg = program(SCENE_FS, 'scene');
const preProg   = program(PRE_FS,   'bright-pass');
const blurProg  = program(BLUR_FS,  'blur');
const postProg  = program(POST_FS,  'composite');
if (!sceneProg || !preProg || !blurProg || !postProg) return;

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function makeRT(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, w, h };
}
function freeRT(rt) { if (rt) { gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fb); } }
function bindTex(unit, rt) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, rt.tex); }
function drawTo(rt) {
  if (rt) { gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb); gl.viewport(0, 0, rt.w, rt.h); }
  else    { gl.bindFramebuffer(gl.FRAMEBUFFER, null);  gl.viewport(0, 0, canvas.width, canvas.height); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------------------------------------------------------------- render targets
const params = new URLSearchParams(location.search);
const fixedScale = params.has('scale') ? Math.min(1, Math.max(0.2, parseFloat(params.get('scale')) || 0.5)) : null;
let scale = fixedScale || 0.55;           // scene resolution relative to the canvas (adapts to your GPU)
const MIN_SCALE = 0.3, MAX_SCALE = 0.9;
let scene, b1a, b1b, b2a, b2b;

function allocTargets() {
  [scene, b1a, b1b, b2a, b2b].forEach(freeRT);
  const W = canvas.width, H = canvas.height;
  scene = makeRT(Math.max(16, Math.floor(W * scale)), Math.max(16, Math.floor(H * scale)));
  b1a = makeRT(Math.max(16, W >> 2), Math.max(16, H >> 2));
  b1b = makeRT(b1a.w, b1a.h);
  b2a = makeRT(Math.max(16, W >> 3), Math.max(16, H >> 3));
  b2b = makeRT(b2a.w, b2a.h);
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width  = Math.max(32, Math.floor(window.innerWidth  * dpr));
  canvas.height = Math.max(32, Math.floor(window.innerHeight * dpr));
  allocTargets();
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- camera + input
let yaw = 0.6, pitch = 0.13, dist = 14, targetDist = 14;
let autoRotate = true;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const pointers = new Map();
let lastPinch = 0, moved = 0;
let clickTime = -100;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0; lastPinch = 0;
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (pointers.size === 1) {
    yaw  -= dx * 0.005;
    pitch = clamp(pitch + dy * 0.005, -1.45, 1.45);
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) targetDist = clamp(targetDist * lastPinch / d, 3.5, 40);
    lastPinch = d;
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (moved < 6 && e.type === 'pointerup') clickTime = time;   // a click, not a drag
    canvas.classList.remove('drag');
  }
  lastPinch = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetDist = clamp(targetDist * Math.exp(e.deltaY * 0.001), 3.5, 40);
}, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  if (k === ' ') { autoRotate = !autoRotate; e.preventDefault(); }
  if (k === 'm') enableMic();
});

// ---------------------------------------------------------------- optional microphone
let analyser = null, freq = null;
async function enableMic() {
  if (analyser) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    titleEl.textContent = 'Singularity · MIC ON';
  } catch (err) {
    titleEl.textContent = 'Singularity · MIC DENIED';
  }
}

// ---------------------------------------------------------------- main loop
let time = 0, bass = 0, last = performance.now();
let avgMs = 16, frames = 0, cooldown = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dtMs = now - last;
  last = now;
  const dt = Math.min(dtMs / 1000, 0.05);
  time += dt;

  // beat energy: real mic when enabled, otherwise a gentle heartbeat
  let target;
  if (analyser) {
    analyser.getByteFrequencyData(freq);
    let s = 0;
    for (let i = 0; i < 6; i++) s += freq[i];
    target = Math.min(1, Math.pow(s / 6 / 255, 1.6) * 1.8);
  } else {
    target = Math.pow(Math.max(0, Math.sin(time * 1.8)), 12) * 0.3;
  }
  bass += (target - bass) * (target > bass ? 0.5 : 0.08);

  if (autoRotate && pointers.size === 0) yaw += dt * 0.07;
  dist += (targetDist - dist) * Math.min(1, dt * 6);

  // camera basis
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cam = [dist * cp * sy, dist * sp, dist * cp * cy];
  const f = [-cam[0] / dist, -cam[1] / dist, -cam[2] / dist];
  let rx = -f[2], rz = f[0];
  const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
  const right = [rx, 0, rz];
  const up = [
    right[1] * f[2] - right[2] * f[1],
    right[2] * f[0] - right[0] * f[2],
    right[0] * f[1] - right[1] * f[0]
  ];

  // ---- pass 1: the black hole
  gl.useProgram(sceneProg);
  gl.uniform2f(sceneProg.u.uRes, scene.w, scene.h);
  gl.uniform3f(sceneProg.u.uCam, cam[0], cam[1], cam[2]);
  gl.uniform3f(sceneProg.u.uRight, right[0], right[1], right[2]);
  gl.uniform3f(sceneProg.u.uUp, up[0], up[1], up[2]);
  gl.uniform3f(sceneProg.u.uFwd, f[0], f[1], f[2]);
  gl.uniform1f(sceneProg.u.uFov, 0.55 - Math.min(bass, 1) * 0.02);
  gl.uniform1f(sceneProg.u.uTime, time);
  gl.uniform1f(sceneProg.u.uBass, bass);
  gl.uniform1f(sceneProg.u.uClickT, time - clickTime);
  drawTo(scene);

  // ---- bloom: bright-pass -> blur (1/4 res) -> downsample -> blur (1/8 res)
  gl.useProgram(preProg);
  gl.uniform1i(preProg.u.uTex, 0);
  bindTex(0, scene);
  gl.uniform2f(preProg.u.uTexel, 1 / scene.w, 1 / scene.h);
  gl.uniform1f(preProg.u.uThr, 0.55);
  drawTo(b1a);

  gl.useProgram(blurProg);
  gl.uniform1i(blurProg.u.uTex, 0);
  bindTex(0, b1a); gl.uniform2f(blurProg.u.uDir, 1 / b1a.w, 0); drawTo(b1b);
  bindTex(0, b1b); gl.uniform2f(blurProg.u.uDir, 0, 1 / b1a.h); drawTo(b1a);

  gl.useProgram(preProg);
  bindTex(0, b1a);
  gl.uniform2f(preProg.u.uTexel, 1 / b1a.w, 1 / b1a.h);
  gl.uniform1f(preProg.u.uThr, 0.0);
  drawTo(b2a);

  gl.useProgram(blurProg);
  bindTex(0, b2a); gl.uniform2f(blurProg.u.uDir, 1.4 / b2a.w, 0); drawTo(b2b);
  bindTex(0, b2b); gl.uniform2f(blurProg.u.uDir, 0, 1.4 / b2a.h); drawTo(b2a);

  // ---- composite to screen
  gl.useProgram(postProg);
  gl.uniform1i(postProg.u.uScene, 0);
  gl.uniform1i(postProg.u.uB1, 1);
  gl.uniform1i(postProg.u.uB2, 2);
  bindTex(0, scene); bindTex(1, b1a); bindTex(2, b2a);
  gl.uniform2f(postProg.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(postProg.u.uTime, time);
  gl.uniform1f(postProg.u.uBass, bass);
  const pulse = Math.exp(-(time - clickTime) * 1.5);
  gl.uniform1f(postProg.u.uBloom, 0.75 + bass * 0.5 + pulse * 0.25);
  drawTo(null);

  // ---- adapt resolution to the GPU so it stays smooth
  if (!fixedScale && dtMs < 250) {
    avgMs += (dtMs - avgMs) * 0.08;
    frames++;
    if (cooldown > 0) cooldown--;
    else if (frames > 40) {
      let next = scale;
      if (avgMs > 26) next = Math.max(MIN_SCALE, scale - 0.06);
      else if (avgMs < 15.5) next = Math.min(MAX_SCALE, scale + 0.04);
      if (Math.abs(next - scale) > 1e-3) { scale = next; allocTargets(); cooldown = 45; }
    }
  }
}
requestAnimationFrame(frame);

})();
</script>
