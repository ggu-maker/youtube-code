<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Robot Beam - Enhanced</title>
    <style>
        body {
            margin: 0;
            background: #010105;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000000 100%);
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-container {
            position: absolute;
            bottom: 40px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .instructions {
            font-size: 16px;
            background: rgba(0, 20, 40, 0.6);
            padding: 12px 24px;
            border-radius: 8px;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            text-transform: uppercase;
            font-weight: 600;
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .instructions.active {
            transform: scale(1.1);
            background: rgba(0, 40, 80, 0.8);
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #00ffff;
            font-weight: bold;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 3;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 2px;
        }
        /* Custom progress bar */
        #charge-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        #charge-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffffff);
            box-shadow: 0 0 10px #00ffff;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="loading">INITIALIZING PROTOCOL...</div>
    
    <div class="ui-container">
        <div class="instructions" id="inst-text">Hold SPACE or CLICK to Charge & Release to Fire!</div>
        <div id="charge-bar-container">
            <div id="charge-bar"></div>
        </div>
    </div>

    <!-- Load Three.js and Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- Post Processing -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const instText = document.getElementById('inst-text');
        const chargeBar = document.getElementById('charge-bar');
        
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010105, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 1, 7);
        const cameraTarget = new THREE.Vector3(-0.5, 0.5, 0);
        camera.lookAt(cameraTarget);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- POST PROCESSING (BLOOM) ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2; // Balanced strength for clearer details
        bloomPass.radius = 0.8;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        const clock = new THREE.Clock();
        let mixer;
        let actions = {};
        let activeAction;

        // --- LIGHTING ---
        scene.add(new THREE.AmbientLight(0x202040, 0.5)); // Darker ambient
        
        const directionalLight = new THREE.DirectionalLight(0xaabbff, 1.5);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // Backlight for rim lighting effect
        const backLight = new THREE.DirectionalLight(0xff44ff, 1.0);
        backLight.position.set(-5, 5, -5);
        scene.add(backLight);

        const energyLight = new THREE.PointLight(0x00ffff, 0, 20);
        energyLight.position.set(-0.8, 0.8, 0);
        scene.add(energyLight);

        // --- ENVIRONMENT ---
        // Enhanced Starfield
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPos = new Float32Array(starsCount * 3);
        const starColors = new Float32Array(starsCount * 3);
        const color1 = new THREE.Color(0x00ffff);
        const color2 = new THREE.Color(0xff00ff);
        
        for(let i=0; i<starsCount*3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 150;
            starPos[i+1] = (Math.random() - 0.5) * 150;
            starPos[i+2] = -10 - Math.random() * 100;
            
            const mixedColor = color1.clone().lerp(color2, Math.random());
            starColors[i] = mixedColor.r;
            starColors[i+1] = mixedColor.g;
            starColors[i+2] = mixedColor.b;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        
        const starsMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // Ground Plane with grid
        const gridHelper = new THREE.GridHelper(40, 40, 0x00ffff, 0x001133);
        gridHelper.position.y = -1.5;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        gridHelper.material.blending = THREE.AdditiveBlending;
        scene.add(gridHelper);

        // --- LOAD MODEL ---
        const heroGroup = new THREE.Group();
        scene.add(heroGroup);

        const loader = new THREE.GLTFLoader();
        let robotModel;
        loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/RobotExpressive/RobotExpressive.glb', function (gltf) {
            robotModel = gltf.scene;
            robotModel.scale.set(0.45, 0.45, 0.45);
            robotModel.position.set(-2.0, -1.5, 0);
            robotModel.rotation.y = Math.PI / 2.5;
            
            // Enhance materials
            robotModel.traverse((child) => {
                if (child.isMesh) {
                    child.material.metalness = 0.8;
                    child.material.roughness = 0.2;
                    child.material.envMapIntensity = 1.0;
                }
            });
            
            heroGroup.add(robotModel);
            document.getElementById('loading').style.opacity = '0';

            mixer = new THREE.AnimationMixer(robotModel);
            gltf.animations.forEach((clip) => {
                actions[clip.name] = mixer.clipAction(clip);
            });

            fadeToAction('Idle', 0.5);
        });

        function fadeToAction(name, duration) {
            const previousAction = activeAction;
            activeAction = actions[name];
            if (activeAction) {
                activeAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(duration).play();
                if (previousAction && previousAction !== activeAction) {
                    previousAction.fadeOut(duration);
                }
            }
        }

        // --- ENERGY CORE, VORTEX & SHOCKWAVE ---
        const handsPos = new THREE.Vector3(-1.0, 0.6, 0);

        // The bright inner core
        const coreGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            transparent: true,
            opacity: 0.9
        });
        const coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        coreSphere.position.copy(handsPos);
        coreSphere.scale.set(0, 0, 0);
        scene.add(coreSphere);

        // Swirling vortex rings
        const vortexGroup = new THREE.Group();
        vortexGroup.position.copy(handsPos);
        
        const ringGeo1 = new THREE.TorusGeometry(1.2, 0.1, 16, 100);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        
        const ringGeo2 = new THREE.TorusGeometry(1.5, 0.05, 16, 100);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        
        const ringGeo3 = new THREE.TorusGeometry(0.8, 0.2, 16, 100);
        const ringMat3 = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const ring3 = new THREE.Mesh(ringGeo3, ringMat3);

        ring1.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 4;
        ring3.rotation.x = -Math.PI / 4;
        
        vortexGroup.add(ring1);
        vortexGroup.add(ring2);
        vortexGroup.add(ring3);
        vortexGroup.scale.set(0,0,0);
        scene.add(vortexGroup);

        // Shockwave effect on firing
        const shockwaveGeo = new THREE.TorusGeometry(1, 0.2, 16, 100);
        const shockwaveMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending });
        const shockwave = new THREE.Mesh(shockwaveGeo, shockwaveMat);
        shockwave.position.copy(handsPos);
        shockwave.rotation.y = Math.PI / 2;
        scene.add(shockwave);

        // --- PARTICLE SYSTEMS ---
        // Floating debris
        const rocks = [];
        const rockGeo = new THREE.DodecahedronGeometry(1);
        const rockMat = new THREE.MeshStandardMaterial({ 
            color: 0x111122, 
            roughness: 0.8,
            metalness: 0.5,
            emissive: 0x00ffff,
            emissiveIntensity: 0.0
        });

        for(let i=0; i<30; i++) {
            const rock = new THREE.Mesh(rockGeo, rockMat.clone());
            const scale = Math.random() * 0.2 + 0.05;
            rock.scale.set(scale, scale, scale);
            
            rock.position.set(
                (Math.random() - 0.5) * 15, 
                -1.5 - Math.random() * 2, 
                (Math.random() - 0.5) * 15
            );
            
            rock.userData = { 
                baseY: rock.position.y,
                vx: (Math.random() - 0.5) * 0.1,
                vy: Math.random() * 0.02 + 0.01, 
                vz: (Math.random() - 0.5) * 0.1,
                rx: Math.random() * 0.05,
                ry: Math.random() * 0.05,
                phase: Math.random() * Math.PI * 2
            };
            scene.add(rock);
            rocks.push(rock);
        }

        // Energy sparks
        const sparksGeo = new THREE.BufferGeometry();
        const sparksCount = 200;
        const sparkPos = new Float32Array(sparksCount * 3);
        for(let i=0; i<sparksCount; i++) {
            sparkPos[i*3] = handsPos.x;
            sparkPos[i*3+1] = handsPos.y;
            sparkPos[i*3+2] = handsPos.z;
        }
        sparksGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
        const sparksMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.1,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0
        });
        const sparks = new THREE.Points(sparksGeo, sparksMat);
        scene.add(sparks);

        // --- LIGHTNING ARCS ---
        const lightningLines = [];
        const lightningCount = 12;
        const lightningMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        
        for(let i=0; i<lightningCount; i++) {
            const points = [];
            const segments = 10;
            for(let j=0; j<=segments; j++) points.push(new THREE.Vector3());
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, lightningMat);
            line.visible = false;
            scene.add(line);
            lightningLines.push(line);
        }

        // --- THE BEAM ---
        const beamGroup = new THREE.Group();
        beamGroup.position.copy(handsPos);

        // Outer glow
        const outerBeamGeo = new THREE.CylinderGeometry(2.5, 3.5, 40, 32, 1, true);
        const outerBeamMat = new THREE.MeshBasicMaterial({ 
            color: 0x0055ff, 
            transparent: true, 
            opacity: 0.6, 
            blending: THREE.AdditiveBlending, 
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const outerBeam = new THREE.Mesh(outerBeamGeo, outerBeamMat);
        outerBeam.rotation.z = Math.PI / 2;
        outerBeam.position.x = 20;
        beamGroup.add(outerBeam);

        // Mid layer
        const midBeamGeo = new THREE.CylinderGeometry(1.2, 1.2, 40, 32, 1, true);
        const midBeamMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            transparent: true, 
            opacity: 0.9, 
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const midBeam = new THREE.Mesh(midBeamGeo, midBeamMat);
        midBeam.rotation.z = Math.PI / 2;
        midBeam.position.x = 20;
        beamGroup.add(midBeam);

        // Inner solid core
        const innerBeamGeo = new THREE.CylinderGeometry(0.4, 0.4, 40, 16);
        const innerBeamMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const innerBeam = new THREE.Mesh(innerBeamGeo, innerBeamMat);
        innerBeam.rotation.z = Math.PI / 2;
        innerBeam.position.x = 20;
        beamGroup.add(innerBeam);

        beamGroup.scale.set(0, 0, 0);
        scene.add(beamGroup);

        // --- INTERACTION & LOGIC ---
        let state = 'IDLE'; // IDLE, CHARGING, FIRING
        let chargeProgress = 0;
        let shakeIntensity = 0;
        let isInputDown = false;
        let fireTime = 0;

        function startCharging() {
            if (state === 'IDLE' || state === 'FIRING') {
                state = 'CHARGING';
                chargeProgress = 0;
                instText.classList.add('active');
                instText.innerText = "CHARGING...";
                
                fadeToAction('Jump', 0.2);
            }
            isInputDown = true;
        }

        function releaseFire() {
            isInputDown = false;
            instText.classList.remove('active');
            
            if (state === 'CHARGING') {
                if (chargeProgress > 20) {
                    // Fire!
                    state = 'FIRING';
                    fireTime = 0;
                    instText.innerText = "BEAM ACTIVATED!";
                    instText.style.color = "#fff";
                    instText.style.textShadow = "0 0 10px #fff";
                    
                    fadeToAction('Wave', 0.1);
                    
                    // Trigger Shockwave
                    shockwave.scale.set(1, 1, 1);
                    shockwave.material.opacity = 1.0;
                    
                    // Blast rocks away
                    rocks.forEach(rock => {
                        if (rock.position.y > -1) {
                            rock.userData.vx = (Math.random() - 0.5) * 1.5;
                            rock.userData.vy = Math.random() * 1.5;
                            rock.userData.vz = (Math.random() - 0.5) * 1.5;
                            rock.userData.rx = (Math.random() - 0.5) * 0.5;
                            rock.userData.ry = (Math.random() - 0.5) * 0.5;
                            rock.material.emissiveIntensity = 2.0;
                        }
                    });

                } else {
                    // Cancel
                    state = 'IDLE';
                    chargeProgress = 0;
                    resetEffects();
                    fadeToAction('Idle', 0.5);
                    instText.innerText = "Hold SPACE or CLICK to Charge!";
                    instText.style.color = "#00ffff";
                }
            }
        }

        function resetEffects() {
            coreSphere.scale.set(0, 0, 0);
            vortexGroup.scale.set(0, 0, 0);
            beamGroup.scale.set(0, 0, 0);
            energyLight.intensity = 0;
            lightningLines.forEach(l => l.visible = false);
            sparks.material.opacity = 0;
            chargeBar.style.width = "0%";
            bloomPass.strength = 1.2;
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' && !e.repeat) { 
                e.preventDefault(); 
                startCharging(); 
            } 
        });
        window.addEventListener('keyup', (e) => { 
            if (e.code === 'Space') { 
                e.preventDefault(); 
                releaseFire(); 
            } 
        });
        
        container.addEventListener('mousedown', startCharging);
        container.addEventListener('mouseup', releaseFire);
        container.addEventListener('touchstart', (e) => { if(e.target === container) { e.preventDefault(); startCharging(); } }, {passive: false});
        container.addEventListener('touchend', (e) => { if(e.target === container) { e.preventDefault(); releaseFire(); } }, {passive: false});

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();
            
            if (mixer) mixer.update(delta);

            // Subtle idle camera movement
            const targetCamX = 3 + Math.sin(time * 0.5) * 0.5;
            const targetCamY = 1 + Math.cos(time * 0.3) * 0.2;
            const targetCamZ = 7 + Math.sin(time * 0.4) * 0.5;

            // Update rocks (debris)
            rocks.forEach((rock, i) => {
                if (state === 'IDLE' || state === 'CHARGING') {
                    rock.userData.phase += delta;
                    if (state === 'CHARGING') {
                        // Anti-gravity effect during charge
                        const pullForce = chargeProgress * 0.0005;
                        rock.position.y += rock.userData.vy * (1 + chargeProgress * 0.05);
                        rock.material.emissiveIntensity = chargeProgress * 0.01;
                        
                        // Slowly swirl around core
                        const dx = handsPos.x - rock.position.x;
                        const dz = handsPos.z - rock.position.z;
                        rock.position.x += dx * pullForce;
                        rock.position.z += dz * pullForce;
                    } else {
                        // Settle down
                        if (rock.position.y > -1.5) rock.position.y -= delta * 2;
                        rock.material.emissiveIntensity *= 0.95;
                    }
                    
                    if (rock.position.y > 5) rock.position.y = -2;
                    
                    rock.rotation.x += rock.userData.rx;
                    rock.rotation.y += rock.userData.ry;
                } else if (state === 'FIRING') {
                    // Blast away physics
                    rock.position.x += rock.userData.vx;
                    rock.position.y += rock.userData.vy;
                    rock.position.z += rock.userData.vz;
                    
                    // Gravity
                    rock.userData.vy -= delta * 5; 
                    
                    rock.rotation.x += rock.userData.rx;
                    rock.rotation.y += rock.userData.ry;
                    
                    // Ground collision
                    if (rock.position.y < -1.5) {
                        rock.position.y = -1.5;
                        rock.userData.vy *= -0.5;
                        rock.userData.vx *= 0.8;
                        rock.userData.vz *= 0.8;
                    }
                    rock.material.emissiveIntensity *= 0.9;
                }
            });

            if (state === 'CHARGING') {
                chargeProgress = Math.min(100, chargeProgress + 50 * delta); // Full charge in 2 seconds
                chargeBar.style.width = `${chargeProgress}%`;
                
                // Color shift based on charge
                if (chargeProgress > 70) {
                    chargeBar.style.boxShadow = "0 0 20px #ff00ff";
                    chargeBar.style.background = "#ffffff";
                } else {
                    chargeBar.style.boxShadow = "0 0 10px #00ffff";
                    chargeBar.style.background = "linear-gradient(90deg, #00ffff, #ff00ff, #ffffff)";
                }

                const s = (chargeProgress / 100) * 1.8;
                coreSphere.scale.set(s, s, s);
                vortexGroup.scale.set(s, s, s);
                
                // Accelerate vortex rotation
                const vortexSpeed = 1 + (chargeProgress / 100) * 10;
                vortexGroup.rotation.z += delta * vortexSpeed;
                vortexGroup.rotation.y += delta * vortexSpeed * 0.7;
                vortexGroup.rotation.x -= delta * vortexSpeed * 0.5;
                
                energyLight.intensity = (chargeProgress / 100) * 8;
                bloomPass.strength = 1.2 + (chargeProgress / 100) * 0.5;

                // Update Sparks
                sparks.material.opacity = (chargeProgress / 100);
                const positions = sparks.geometry.attributes.position.array;
                for(let i=0; i<sparksCount; i++) {
                    const idx = i*3;
                    
                    // Pull sparks into core
                    const dx = handsPos.x - positions[idx];
                    const dy = handsPos.y - positions[idx+1];
                    const dz = handsPos.z - positions[idx+2];
                    
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    if (dist < 0.2 || dist > 5) {
                        // Reset spark outside
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 3 + Math.random() * 2;
                        positions[idx] = handsPos.x + Math.cos(angle) * radius;
                        positions[idx+1] = handsPos.y + (Math.random() - 0.5) * 4;
                        positions[idx+2] = handsPos.z + Math.sin(angle) * radius;
                    } else {
                        // Move towards center
                        const speed = 2 * delta * (chargeProgress/50);
                        positions[idx] += dx * speed;
                        positions[idx+1] += dy * speed;
                        positions[idx+2] += dz * speed;
                    }
                }
                sparks.geometry.attributes.position.needsUpdate = true;

                // Animate Lightning Arcs during charging
                lightningLines.forEach((line, index) => {
                    // Only show some lightning based on charge
                    if (index > lightningCount * (chargeProgress / 100)) {
                        line.visible = false;
                        return;
                    }
                    
                    line.visible = true;
                    // Flash colors
                    line.material.color.setHex(Math.random() > 0.5 ? 0xffffff : 0x00ffff);
                    
                    const pos = line.geometry.attributes.position;
                    const segments = pos.count - 1;
                    
                    const angle = Math.random() * Math.PI * 2;
                    const radius = (1.0 + Math.random() * 2.0) * s;
                    const targetX = handsPos.x + Math.cos(angle) * radius;
                    const targetY = handsPos.y + (Math.random() - 0.5) * 3 * s;
                    const targetZ = handsPos.z + Math.sin(angle) * radius;

                    for(let j = 0; j <= segments; j++) {
                        const alpha = j / segments;
                        let jitter = (j > 0 && j < segments) ? (Math.random() - 0.5) * 0.8 : 0;
                        pos.setXYZ(j, 
                            THREE.MathUtils.lerp(handsPos.x, targetX, alpha) + jitter,
                            THREE.MathUtils.lerp(handsPos.y, targetY, alpha) + jitter,
                            THREE.MathUtils.lerp(handsPos.z, targetZ, alpha) + jitter
                        );
                    }
                    pos.needsUpdate = true;
                });

                // Camera Shake based on charge
                shakeIntensity = (chargeProgress / 100) * 0.05;

            } else if (state === 'FIRING') {
                fireTime += delta;
                
                // Shockwave expansion
                if (shockwave.scale.x < 15) {
                    shockwave.scale.addScalar(delta * 40);
                    shockwave.material.opacity = Math.max(0, 1.0 - shockwave.scale.x / 15);
                }

                // Sparks fly forward along the beam
                sparks.material.opacity = 1;
                const positions = sparks.geometry.attributes.position.array;
                for(let i=0; i<sparksCount; i++) {
                    const idx = i*3;
                    positions[idx] += 20 * delta; // move fast along X
                    positions[idx+1] += (Math.random() - 0.5) * 0.5;
                    positions[idx+2] += (Math.random() - 0.5) * 0.5;
                    
                    if (positions[idx] > 30) {
                        // Reset near hands
                        positions[idx] = handsPos.x;
                        positions[idx+1] = handsPos.y + (Math.random() - 0.5) * 2;
                        positions[idx+2] = handsPos.z + (Math.random() - 0.5) * 2;
                    }
                }
                sparks.geometry.attributes.position.needsUpdate = true;

                // Wild Lightning around the beam
                lightningLines.forEach((line) => {
                    line.visible = true;
                    line.material.color.setHex(0xffbbff); // Pinkish-white lightning
                    const pos = line.geometry.attributes.position;
                    const segments = pos.count - 1;
                    const forwardDist = 5 + Math.random() * 30; 

                    for(let j = 0; j <= segments; j++) {
                        const alpha = j / segments;
                        const jitter = (j > 0 && j < segments) ? (Math.random() - 0.5) * 2.0 : 0;
                        pos.setXYZ(j, 
                            handsPos.x + alpha * forwardDist,
                            handsPos.y + (Math.random() - 0.5) * 3.5 + jitter,
                            handsPos.z + (Math.random() - 0.5) * 3.5 + jitter
                        );
                    }
                    pos.needsUpdate = true;
                });

                // Beam Pulse Effect
                const pulse = 1.0 + Math.sin(time * 30) * 0.1;
                beamGroup.scale.x = THREE.MathUtils.lerp(beamGroup.scale.x, 1, delta * 15);
                beamGroup.scale.y = THREE.MathUtils.lerp(beamGroup.scale.y, pulse, delta * 20);
                beamGroup.scale.z = THREE.MathUtils.lerp(beamGroup.scale.z, pulse, delta * 20);
                
                // Outer beam spin
                outerBeam.rotation.y += delta * 10;
                midBeam.rotation.y -= delta * 15;

                coreSphere.scale.set(2.5, 2.5, 2.5);
                vortexGroup.scale.set(1.5, 1.5, 1.5);
                vortexGroup.rotation.z += delta * 15;
                
                energyLight.intensity = 12 + Math.sin(time * 20) * 3; // reduced flickering light
                bloomPass.strength = 1.6 + Math.random() * 0.3; // balanced flickering bloom

                // Maximum Camera Shake
                shakeIntensity = 0.2;

                // Stop firing after a certain time (e.g., 2.5 seconds)
                if (fireTime > 2.5) {
                    state = 'IDLE';
                    fireTime = 0;
                    resetEffects();
                    fadeToAction('Idle', 0.5);
                    instText.innerText = "Hold SPACE or CLICK to Charge!";
                    instText.style.color = "#00ffff";
                    instText.style.textShadow = "none";
                }
            } else {
                // IDLE
                shakeIntensity = 0;
            }

            // Apply Camera Movement + Shake
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, delta * 2);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, delta * 2);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, delta * 2);

            if (shakeIntensity > 0) {
                camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                camera.position.y += (Math.random() - 0.5) * shakeIntensity;
                camera.position.z += (Math.random() - 0.5) * shakeIntensity;
            }

            camera.lookAt(cameraTarget);

            // Render using composer for post-processing
            composer.render();
        }

        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
