<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Ribbon</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
(function () {

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// =====================================================
// SIZE / DPR — crisp rendering on retina screens
// =====================================================

let W, H, DPR;

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener("resize", resize);


// =====================================================
// POINTER (mouse + touch)
// =====================================================

let mouseX = W / 2;
let mouseY = H / 2;

let smoothX = mouseX;
let smoothY = mouseY;

let lastMouseX = mouseX;
let lastMouseY = mouseY;

let mouseSpeed = 0;

function setPointer(x, y) {
    mouseX = x;
    mouseY = y;
}

window.addEventListener("mousemove", (e) => setPointer(e.clientX, e.clientY));
window.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    if (t) {
        setPointer(t.clientX, t.clientY);
        smoothX = t.clientX;
        smoothY = t.clientY;
    }
}, { passive: true });
window.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    if (t) setPointer(t.clientX, t.clientY);
    e.preventDefault();
}, { passive: false });


// =====================================================
// RIBBON — chain of points with tapered width
// =====================================================

const POINTS = 70;
const ribbon = [];

for (let i = 0; i < POINTS; i++) {
    ribbon.push({ x: mouseX, y: mouseY, width: 0 });
}

// gentle idle drift so the ribbon isn't static before the first move
let idleT = 0;
let hasMoved = false;
window.addEventListener("mousemove", () => (hasMoved = true), { once: true });
window.addEventListener("touchstart", () => (hasMoved = true), { once: true });


// =====================================================
// UPDATE
// =====================================================

function updateRibbon(time, dt) {

    if (!hasMoved) {
        idleT += 0.02 * dt;
        const rx = Math.min(W, H) * 0.18;
        const ry = Math.min(W, H) * 0.13;
        mouseX = W / 2 + Math.sin(idleT) * rx;
        mouseY = H / 2 + Math.sin(idleT * 2) * ry;
    }

    // head eases toward the pointer
    smoothX += (mouseX - smoothX) * 0.18 * dt;
    smoothY += (mouseY - smoothY) * 0.18 * dt;

    ribbon[0].x = smoothX;
    ribbon[0].y = smoothY;

    for (let i = 1; i < POINTS; i++) {
        const p = ribbon[i];
        const prev = ribbon[i - 1];

        const dx = prev.x - p.x;
        const dy = prev.y - p.y;

        p.x += dx * 0.28 * dt;
        p.y += dy * 0.28 * dt;

        // silk flutter — a wave that grows toward the tail
        const t = i / POINTS;
        const waveAmount = t * 3.2;

        p.x += Math.sin(time * 0.003 - i * 0.25) * waveAmount;
        p.y += Math.cos(time * 0.002 - i * 0.18) * waveAmount * 0.5;

        // width tapers from head to tail, with a subtle speed-driven pulse
        const taper = 1 - t * 0.88;
        const pulse = 1 + Math.min(mouseSpeed * 0.015, 0.6) * (1 - t);
        p.width = Math.max(taper * pulse, 0.05);
    }
}


// =====================================================
// DRAW — filled, tapered ribbon shape (not just a stroked line)
// =====================================================

const BASE_WIDTH = 9;

function drawRibbon() {

    // compute left/right offset points using each segment's normal
    const left = [];
    const right = [];

    for (let i = 0; i < POINTS; i++) {
        const p = ribbon[i];
        const prev = ribbon[i - 1] || p;
        const next = ribbon[i + 1] || p;

        let dx = next.x - prev.x;
        let dy = next.y - prev.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        dx /= len; dy /= len;

        // perpendicular
        const nx = -dy;
        const ny = dx;

        const halfWidth = (p.width * BASE_WIDTH) / 2;

        left.push({ x: p.x + nx * halfWidth, y: p.y + ny * halfWidth });
        right.push({ x: p.x - nx * halfWidth, y: p.y - ny * halfWidth });
    }

    ctx.save();

    // -----------------------------------------------
    // GLOW PASS
    // -----------------------------------------------
    ctx.shadowBlur = 22;
    ctx.shadowColor = "#7c6cff";

    tracePath(left, right);
    ctx.fillStyle = "rgba(120,100,255,0.22)";
    ctx.fill();

    // -----------------------------------------------
    // MAIN FILLED RIBBON — gradient runs along its own length
    // -----------------------------------------------
    ctx.shadowBlur = 8;

    tracePath(left, right);

    const head = ribbon[0];
    const tail = ribbon[POINTS - 1];
    const gradient = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.18, "#9db7ff");
    gradient.addColorStop(0.45, "#8d6cff");
    gradient.addColorStop(0.72, "#c76cff");
    gradient.addColorStop(1, "rgba(100,80,255,0)");

    ctx.fillStyle = gradient;
    ctx.fill();

    // -----------------------------------------------
    // CENTERLINE HIGHLIGHT — silky sheen down the middle
    // -----------------------------------------------
    ctx.shadowBlur = 0;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    for (let i = 0; i < POINTS; i++) {
        const p = ribbon[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.restore();
}

// build one smooth closed path: down the left edge, back along the right edge
function tracePath(left, right) {
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);
    for (let i = 1; i < left.length; i++) {
        const p = left[i];
        const prev = left[i - 1];
        const mx = (prev.x + p.x) / 2;
        const my = (prev.y + p.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
    }
    ctx.lineTo(right[right.length - 1].x, right[right.length - 1].y);
    for (let i = right.length - 2; i >= 0; i--) {
        const p = right[i];
        const next = right[i + 1];
        const mx = (next.x + p.x) / 2;
        const my = (next.y + p.y) / 2;
        ctx.quadraticCurveTo(next.x, next.y, mx, my);
    }
    ctx.closePath();
}


// =====================================================
// CURSOR GLOW
// =====================================================

function drawCursor() {
    const gradient = ctx.createRadialGradient(smoothX, smoothY, 0, smoothX, smoothY, 100);
    gradient.addColorStop(0, "rgba(150,130,255,0.18)");
    gradient.addColorStop(0.5, "rgba(100,100,255,0.05)");
    gradient.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(smoothX, smoothY, 100, 0, Math.PI * 2);
    ctx.fill();
}


// =====================================================
// PARTICLES — spawn along the head, react to speed
// =====================================================

const MAX_PARTICLES = 200;
let particles = [];

function createParticles() {
    if (mouseSpeed < 3) return;
    if (Math.random() > 0.35) return;
    if (particles.length >= MAX_PARTICLES) return;

    particles.push({
        x: smoothX,
        y: smoothY,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        size: Math.random() * 1.6 + 1,
        life: 1
    });
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= 0.03 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    ctx.save();
    for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,170,255,${p.life})`;
        ctx.fill();
    }
    ctx.restore();
}


// =====================================================
// ANIMATION LOOP — delta-time based so speed is frame-rate independent
// =====================================================

let lastTime = performance.now();

function animate(time) {
    const dt = Math.min((time - lastTime) / 16.67, 2.5); // normalized to ~60fps steps, clamped
    lastTime = time;

    ctx.clearRect(0, 0, W, H);

    const dx = mouseX - lastMouseX;
    const dy = mouseY - lastMouseY;
    mouseSpeed = Math.sqrt(dx * dx + dy * dy);
    lastMouseX = mouseX;
    lastMouseY = mouseY;

    updateRibbon(time, dt);
    createParticles();
    updateParticles(dt);

    drawCursor();
    drawRibbon();
    drawParticles();

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

})();
</script>
</body>
</html>
