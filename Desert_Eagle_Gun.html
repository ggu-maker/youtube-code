<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talon .50 AE — Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            cursor: none;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #ui h1 { margin: 0; font-size: 2.5rem; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
        #ui p { margin: 5px 0 0 0; font-size: 1rem; color: #aaa; }
        #ui .controls { margin-top: 15px; font-size: 0.8rem; color: #00ffcc; }
        #ammo {
            position: absolute;
            bottom: 30px;
            right: 30px;
            text-align: right;
            color: #ffdca0;
            pointer-events: none;
        }
        #ammo .count { font-size: 2.2rem; }
        #ammo .count.low { color: #ff5c4d; }
        #ammo .label { font-size: 0.75rem; color: #999; letter-spacing: 2px; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; color: white; cursor: pointer;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }
        #overlay h2 {
            font-size: 2.5rem; letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.98); } }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 150%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="overlay"><h2>CLICK TO EQUIP</h2></div>
    <div id="vignette"></div>

    <div id="ui">
        <h1>Talon</h1>
        <p>.50 Action Express</p>
        <div class="controls">[CLICK] FIRE &nbsp;&nbsp; [SPACE] LASER SIGHT &nbsp;&nbsp; [R] RELOAD</div>
    </div>

    <div id="ammo">
        <div class="count" id="ammoCount">7</div>
        <div class="label">ROUNDS &nbsp;·&nbsp; <span id="reserveCount">21</span> RESERVE</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const ammoCountEl = document.getElementById('ammoCount');
        const reserveCountEl = document.getElementById('reserveCount');

        let width, height, cx, cy;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playGunshot() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 3000;
            noiseFilter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            const noiseEnv = audioCtx.createGain();
            noiseEnv.gain.setValueAtTime(2.5, audioCtx.currentTime);
            noiseEnv.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            noiseSource.connect(noiseFilter); noiseFilter.connect(noiseEnv); noiseEnv.connect(audioCtx.destination);

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            const oscEnv = audioCtx.createGain();
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            oscEnv.gain.setValueAtTime(3, audioCtx.currentTime);
            oscEnv.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(oscEnv); oscEnv.connect(audioCtx.destination);

            const delay = audioCtx.createDelay();
            delay.delayTime.value = 0.05;
            const delayFeedback = audioCtx.createGain();
            delayFeedback.gain.value = 0.3;
            noiseEnv.connect(delay); delay.connect(delayFeedback); delayFeedback.connect(delay); delay.connect(audioCtx.destination);

            noiseSource.start();
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }

        function playCasingDrop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            const env = audioCtx.createGain();
            osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.05);
            env.gain.setValueAtTime(0.3, audioCtx.currentTime);
            env.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(env); env.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playDryFire() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.05;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass'; filter.frequency.value = 1800;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
            src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            src.start(); src.stop(audioCtx.currentTime + 0.07);
        }

        function playReloadSound() {
            if (!audioCtx) return;
            [0, 0.5].forEach((t) => {
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass'; filter.frequency.value = 1300;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + t);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.08);
                src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                src.start(audioCtx.currentTime + t); src.stop(audioCtx.currentTime + t + 0.1);
            });
        }

        let gun = {
            x: 0, y: 0,
            targetRotation: 0, rotation: 0,
            recoilY: 0, recoilX: 0,
            slideOffset: 0,
            scale: 1.8,
            isFiring: false
        };

        let laserEnabled = true;
        let ammo = { current: 7, max: 7, reserve: 21, reloading: false };

        const mouse = { x: cx, y: cy };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); laserEnabled = !laserEnabled; }
            if (e.code === 'KeyR') reload();
        });

        let particles = [];
        let casings = [];
        let screenShake = { x: 0, y: 0 };
        let isStarted = false;

        overlay.addEventListener('click', () => {
            if (!isStarted) {
                initAudio();
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);
                isStarted = true;
                requestAnimationFrame(loop);
            }
        });

        window.addEventListener('mousedown', (e) => {
            if (isStarted && !gun.isFiring && e.target === canvas) fire();
        });

        function updateAmmoUI() {
            ammoCountEl.textContent = ammo.current;
            ammoCountEl.classList.toggle('low', ammo.current <= 2);
            reserveCountEl.textContent = ammo.reserve;
        }

        function reload() {
            if (ammo.reloading || ammo.reserve <= 0 || ammo.current === ammo.max) return;
            ammo.reloading = true;
            playReloadSound();
            setTimeout(() => {
                const needed = ammo.max - ammo.current;
                const used = Math.min(needed, ammo.reserve);
                ammo.current += used;
                ammo.reserve -= used;
                ammo.reloading = false;
                updateAmmoUI();
            }, 900);
        }

        function createMuzzleFlash(x, y, angle) {
            particles.push({ x, y, vx: 0, vy: 0, life: 1, decay: 0.11, size: 65, color: 'rgba(255,230,150,1)', type: 'star_flash', angle });
            particles.push({ x, y, vx: 0, vy: 0, life: 1, decay: 0.35, size: 26, color: 'rgba(255,255,255,1)', type: 'core_flash' });

            for (let i = 0; i < 18; i++) {
                particles.push({
                    x, y,
                    vx: Math.cos(angle + (Math.random() - 0.5) * 0.5) * (Math.random() * 34 + 10),
                    vy: Math.sin(angle + (Math.random() - 0.5) * 0.5) * (Math.random() * 34 + 10),
                    life: 1, decay: Math.random() * 0.05 + 0.05,
                    size: Math.random() * 8 + 2,
                    color: `rgba(255, ${150 + Math.random() * 100}, 0, 1)`,
                    type: 'spark'
                });
            }

            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x + Math.cos(angle) * 20, y: y + Math.sin(angle) * 20,
                    vx: Math.cos(angle + (Math.random() - 0.5) * 0.6) * (Math.random() * 5 + 2),
                    vy: Math.sin(angle + (Math.random() - 0.5) * 0.6) * (Math.random() * 5 + 2) - 1,
                    life: 1, decay: Math.random() * 0.01 + 0.005,
                    size: Math.random() * 16 + 10,
                    color: 'rgba(180,180,180,0.4)',
                    type: 'smoke'
                });
            }
        }

        function createCasing(x, y) {
            casings.push({
                x, y,
                vx: (-3 - Math.random() * 4),
                vy: (-6 - Math.random() * 6),
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.8,
                life: 1, decay: 0.003,
                bounced: false
            });
        }

        function fire() {
            if (ammo.reloading) return;
            if (ammo.current <= 0) {
                playDryFire();
                screenShake.x = (Math.random() - 0.5) * 10;
                screenShake.y = (Math.random() - 0.5) * 10;
                return;
            }
            ammo.current--;
            updateAmmoUI();

            gun.isFiring = true;
            gun.recoilY = -40;
            gun.recoilX = -25;
            gun.slideOffset = -45;

            playGunshot();

            screenShake.x = (Math.random() - 0.5) * 40;
            screenShake.y = (Math.random() - 0.5) * 40;

            let isFlipped = Math.abs(gun.rotation) > Math.PI / 2;
            let dirY = isFlipped ? -1 : 1;

            const barrelX = 196 * gun.scale;
            const barrelY = -35 * gun.scale * dirY;
            const cos = Math.cos(gun.rotation);
            const sin = Math.sin(gun.rotation);
            const tipX = cx + gun.x + (barrelX * cos - barrelY * sin);
            const tipY = cy + gun.y + (barrelX * sin + barrelY * cos);

            createMuzzleFlash(tipX, tipY, gun.rotation);

            const ejectionX = -10 * gun.scale;
            const ejectionY = -45 * gun.scale * dirY;
            const cXpos = cx + gun.x + (ejectionX * cos - ejectionY * sin);
            const cYpos = cy + gun.y + (ejectionX * sin + ejectionY * cos);

            createCasing(cXpos, cYpos);

            setTimeout(() => { gun.isFiring = false; }, 120);
        }

        function drawGun(ctx, slideOffset) {
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            const brushedMetal = ctx.createLinearGradient(0, -80, 0, 70);
            brushedMetal.addColorStop(0.0, '#3a3a3a');
            brushedMetal.addColorStop(0.15, '#ffffff');
            brushedMetal.addColorStop(0.35, '#999999');
            brushedMetal.addColorStop(0.5, '#e0e0e0');
            brushedMetal.addColorStop(0.7, '#666666');
            brushedMetal.addColorStop(0.9, '#a0a0a0');
            brushedMetal.addColorStop(1.0, '#111111');

            const darkMetal = ctx.createLinearGradient(0, -60, 0, 40);
            darkMetal.addColorStop(0, '#555');
            darkMetal.addColorStop(0.3, '#777');
            darkMetal.addColorStop(0.7, '#222');
            darkMetal.addColorStop(1, '#000');

            const blackPlastic = ctx.createLinearGradient(-35, 20, -10, 100);
            blackPlastic.addColorStop(0, '#2b2b2b');
            blackPlastic.addColorStop(1, '#050505');

            // Ground contact shadow beneath the whole gun
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(20, 115, 130, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // 1. LOWER FRAME
            ctx.fillStyle = brushedMetal;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.0;

            ctx.beginPath();
            ctx.moveTo(-70, -12);
            ctx.lineTo(125, -12);
            ctx.lineTo(125, 4);
            ctx.lineTo(112, 10);
            ctx.lineTo(45, 10);
            ctx.lineTo(45, 45);
            ctx.lineTo(38, 50);
            ctx.lineTo(-8, 50);
            ctx.lineTo(-18, 20);
            ctx.lineTo(-30, 20);
            ctx.lineTo(-38, 50);
            ctx.lineTo(-44, 105);
            ctx.lineTo(-12, 110);
            ctx.lineTo(0, 95);
            ctx.lineTo(-10, 25);
            ctx.lineTo(-68, -2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-70, -12); ctx.lineTo(125, -12); ctx.stroke();

            ctx.strokeStyle = 'rgba(0,0,0,0.8)';
            ctx.beginPath(); ctx.moveTo(125, 4); ctx.lineTo(112, 10); ctx.lineTo(45, 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(45, 45); ctx.lineTo(38, 50); ctx.lineTo(-8, 50); ctx.stroke();

            // frame-side texture lines (subtle machining marks)
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 0.6;
            for (let i = -60; i < 110; i += 6) {
                ctx.beginPath(); ctx.moveTo(i, -10); ctx.lineTo(i, 6); ctx.stroke();
            }

            // Trigger guard cutout
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.moveTo(35, 24); ctx.lineTo(35, 44); ctx.lineTo(-4, 44); ctx.lineTo(-12, 24);
            ctx.closePath(); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            ctx.beginPath(); ctx.moveTo(35, 24); ctx.lineTo(35, 44); ctx.lineTo(-4, 44); ctx.lineTo(-12, 24); ctx.closePath();
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.5; ctx.stroke();

            // Trigger
            ctx.fillStyle = brushedMetal;
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#111';
            ctx.beginPath();
            ctx.moveTo(0, 22);
            ctx.quadraticCurveTo(8, 32, 2, 42);
            ctx.lineTo(-3, 42);
            ctx.quadraticCurveTo(3, 32, -5, 22);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.8;
            for (let i = 25; i < 40; i += 3) { ctx.beginPath(); ctx.moveTo(-2, i); ctx.lineTo(4, i + 2); ctx.stroke(); }

            // Mag release
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(-15, 23, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#555'; ctx.stroke();
            ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-15, 23, 2.5, 0, Math.PI * 2); ctx.fill();

            // Takedown lever & slide stop
            ctx.fillStyle = darkMetal;
            ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.roundRect(85, -2, 20, 6, 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(101, 1, 3, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = darkMetal;
            ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(25, -12); ctx.lineTo(22, 2); ctx.lineTo(2, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#111'; ctx.fillRect(2, -10, 18, 10);
            ctx.fillStyle = '#444';
            for (let i = 3; i < 19; i += 2) ctx.fillRect(i, -10, 1, 10);

            // Frame picatinny rail
            ctx.fillStyle = darkMetal;
            for (let i = 45; i < 110; i += 10) ctx.fillRect(i, 10, 4, 3);

            // Grip base plastic edge
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.moveTo(-30, 20); ctx.lineTo(-12, 28); ctx.lineTo(-7, 95); ctx.lineTo(-38, 92);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // Grip stippled panel
            ctx.fillStyle = blackPlastic;
            ctx.beginPath();
            ctx.moveTo(-27, 24); ctx.lineTo(-15, 30); ctx.lineTo(-10, 92); ctx.lineTo(-35, 89);
            ctx.closePath(); ctx.fill();

            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            for (let x = -35; x < -5; x += 1.2) {
                for (let y = 27; y < 93; y += 1.2) {
                    if (ctx.isPointInPath(x, y)) ctx.fillRect(x + Math.random() * 0.8, y + Math.random() * 0.8, 1, 1);
                }
            }

            // grip screws
            ctx.fillStyle = '#222'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(-20, 40, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-22, 39); ctx.lineTo(-18, 41); ctx.stroke();
            ctx.beginPath(); ctx.arc(-22, 80, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-24, 79); ctx.lineTo(-20, 81); ctx.stroke();

            // grip medallion (abstract wing motif, not a real brand mark)
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(-23, 60, 9, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#3a3a3a';
            ctx.beginPath(); ctx.moveTo(-30, 60); ctx.lineTo(-23, 55); ctx.lineTo(-16, 60); ctx.lineTo(-23, 66); ctx.fill();

            // Magazine baseplate
            ctx.fillStyle = '#151515';
            ctx.beginPath(); ctx.rect(-45, 105, 34, 8); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#333'; ctx.fillRect(-45, 105, 34, 2);

            // Fictional frame markings (not a real serial or manufacturer)
            ctx.fillStyle = 'rgba(20,20,20,0.85)';
            ctx.font = '3.8px "Orbitron", sans-serif';
            ctx.fillText('TALON MODEL T-50', -15, -4);
            ctx.font = '5px "Orbitron", sans-serif';
            ctx.fillText('TX0000001', -15, 2);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(32, -8, 6, 6);
            ctx.font = '2.2px sans-serif'; ctx.fillText('CAL', 33, -5); ctx.fillText('.50', 32.5, -2.5);

            // 2. BARREL (fixed) — lengthened to match the reference photo's long slide/barrel proportion
            ctx.fillStyle = brushedMetal;
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(32, -60);
            ctx.lineTo(183, -60);
            ctx.lineTo(190, -45);
            ctx.lineTo(190, -12);
            ctx.lineTo(32, -12);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(32, -60); ctx.lineTo(183, -60); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(32, -45); ctx.lineTo(188, -45); ctx.stroke();

            // barrel fluting
            ctx.fillStyle = '#111';
            for (let i = 160; i < 186; i += 6.5) {
                ctx.beginPath();
                ctx.moveTo(i, -60); ctx.lineTo(i + 3, -60);
                ctx.lineTo(i - 3, -40); ctx.lineTo(i - 6, -40);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(i + 3, -60); ctx.lineTo(i - 3, -40); ctx.stroke();
            }

            // muzzle brake porting (side vents near the tip)
            ctx.fillStyle = '#0c0c0c';
            for (let i = 0; i < 3; i++) {
                const py = -55 + i * 6;
                ctx.beginPath();
                ctx.ellipse(181, py, 3.2, 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 0.5;
                ctx.beginPath(); ctx.ellipse(181, py - 0.6, 3.2, 1.1, 0, Math.PI, Math.PI * 2); ctx.stroke();
            }

            // muzzle bushing ring at the very tip
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(189, -44); ctx.lineTo(189, -13); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 0.8;
            ctx.beginPath(); ctx.moveTo(187.5, -43); ctx.lineTo(187.5, -14); ctx.stroke();

            // top rail slots
            ctx.fillStyle = '#1a1a1a';
            for (let i = 38; i < 153; i += 7) ctx.fillRect(i, -62, 3, 2.5);

            // front sight
            ctx.fillStyle = '#151515';
            ctx.beginPath();
            ctx.moveTo(173, -60); ctx.lineTo(176, -72); ctx.lineTo(184, -72); ctx.lineTo(184, -60);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(181, -68, 1.5, 0, Math.PI * 2); ctx.fill();

            // fictional barrel markings
            ctx.fillStyle = 'rgba(20,20,20,0.85)';
            ctx.font = '5px sans-serif';
            ctx.fillText('TALON PRECISION ARMS', 55, -35);
            ctx.font = '4.5px sans-serif';
            ctx.fillText('FICTIONAL CITY, ST', 62, -27);

            ctx.lineWidth = 0.5;
            ctx.strokeRect(148, -32, 6, 6);
            ctx.font = '2.2px sans-serif'; ctx.fillText('.50', 149, -29); ctx.fillText('AE', 149, -26.5);

            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.moveTo(188, -42); ctx.lineTo(190, -42); ctx.lineTo(190, -20); ctx.lineTo(188, -20); ctx.fill();

            // 3. SLIDE (moving)
            ctx.save();
            ctx.translate(slideOffset, 0);

            ctx.fillStyle = brushedMetal;
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-74, -60);
            ctx.lineTo(32, -60);
            ctx.lineTo(32, -12);
            ctx.lineTo(-74, -12);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-74, -60); ctx.lineTo(32, -60); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath(); ctx.moveTo(-74, -45); ctx.lineTo(32, -45); ctx.stroke();

            if (slideOffset < -5) {
                ctx.fillStyle = '#050505';
                ctx.fillRect(15 - slideOffset, -50, 18, 35);
                ctx.fillStyle = '#555';
                ctx.fillRect(15 - slideOffset, -40, 5, 20);
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(18 - slideOffset, -36, 10, 8);
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(28 - slideOffset, -32, 4, -Math.PI / 2, Math.PI / 2); ctx.fill();
            }

            // rear serrations
            for (let i = -65; i < -15; i += 4.5) {
                ctx.fillStyle = '#111';
                ctx.fillRect(i, -56, 2.5, 42);
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(i + 2.5, -56, 0.5, 42);
            }

            // safety lever
            ctx.fillStyle = darkMetal;
            ctx.beginPath();
            ctx.moveTo(-45, -28); ctx.lineTo(-25, -24); ctx.lineTo(-25, -34); ctx.lineTo(-40, -38);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-42, -29); ctx.lineTo(-38, -36); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-39, -29); ctx.lineTo(-35, -35); ctx.stroke();

            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath(); ctx.arc(-28, -29, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.beginPath(); ctx.arc(-28, -29, 3, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#e60000';
            ctx.beginPath(); ctx.arc(-28, -42, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();

            ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-5, -40); ctx.lineTo(30, -40); ctx.stroke();

            // rear sight
            ctx.fillStyle = '#151515';
            ctx.beginPath();
            ctx.moveTo(-70, -60); ctx.lineTo(-70, -70); ctx.lineTo(-58, -70); ctx.lineTo(-50, -60);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#000'; ctx.fillRect(-65, -70, 4, 5);
            // rear sight side notch highlight
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.6;
            ctx.beginPath(); ctx.moveTo(-70, -70); ctx.lineTo(-58, -70); ctx.stroke();

            ctx.restore();

            // 4. HAMMER
            ctx.fillStyle = darkMetal;
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            ctx.beginPath();
            if (slideOffset < -5) {
                ctx.arc(-72, -5, 8, 0, Math.PI * 2);
                ctx.lineTo(-88, -8); ctx.lineTo(-88, -2);
            } else {
                ctx.arc(-72, -5, 8, 0, Math.PI * 2);
                ctx.lineTo(-84, -25); ctx.lineTo(-76, -25);
            }
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(-72, -5, 3.5, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawCasingGraphic(ctx, casing) {
            ctx.save();
            ctx.translate(casing.x, casing.y);
            ctx.rotate(casing.rot);

            const brass = ctx.createLinearGradient(0, -4, 0, 4);
            brass.addColorStop(0, '#e5c158');
            brass.addColorStop(0.3, '#fff2cc');
            brass.addColorStop(0.7, '#d4af37');
            brass.addColorStop(1, '#8c6700');

            ctx.fillStyle = brass;
            ctx.fillRect(-10, -5, 20, 10);

            ctx.fillStyle = '#8c6700';
            ctx.fillRect(8, -5, 4, 10);

            ctx.fillStyle = '#332200';
            ctx.fillRect(8, -4, 2, 8);

            ctx.fillStyle = '#111';
            ctx.fillRect(-10, -4, 2, 8);

            ctx.restore();
        }

        function update() {
            let dx = mouse.x - cx;
            let dy = mouse.y - cy;
            gun.targetRotation = Math.atan2(dy, dx);

            let diff = gun.targetRotation - gun.rotation;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            gun.rotation += diff * 0.15;

            gun.recoilY += (0 - gun.recoilY) * 0.15;
            gun.recoilX += (0 - gun.recoilX) * 0.15;
            gun.slideOffset += (0 - gun.slideOffset) * 0.25;

            screenShake.x *= 0.8;
            screenShake.y *= 0.8;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.type === 'smoke') { p.size += 0.5; p.vx *= 0.95; }
                else if (p.type === 'spark') p.vy += 0.5;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = casings.length - 1; i >= 0; i--) {
                let c = casings[i];
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.6;
                c.rot += c.vRot;
                c.life -= c.decay;

                if (c.y > height + 20) {
                    if (!c.bounced) {
                        c.y = height + 20;
                        c.vy *= -0.5;
                        c.vx *= 0.5;
                        c.vRot *= 0.5;
                        c.bounced = true;
                        playCasingDrop();
                    } else if (c.y > height + 100) {
                        casings.splice(i, 1);
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);

            let isFlipped = Math.abs(gun.rotation) > Math.PI / 2;

            if (laserEnabled) {
                ctx.save();
                ctx.translate(cx + gun.recoilX, cy);
                ctx.rotate(gun.rotation + gun.recoilY * 0.005);
                ctx.scale(gun.scale, isFlipped ? -gun.scale : gun.scale);

                ctx.globalCompositeOperation = 'screen';
                ctx.beginPath();
                ctx.moveTo(110, 15);
                ctx.lineTo(2000, 15);

                let laserGradient = ctx.createLinearGradient(110, 0, 800, 0);
                laserGradient.addColorStop(0, 'rgba(255, 0, 0, 0.8)');
                laserGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');

                ctx.strokeStyle = laserGradient;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 200, 200, 0.9)';
                ctx.lineWidth = 0.5;
                ctx.stroke();

                ctx.globalCompositeOperation = 'source-over';
                ctx.restore();
            }

            casings.forEach(c => drawCasingGraphic(ctx, c));

            ctx.save();
            ctx.translate(cx + gun.recoilX, cy);
            ctx.rotate(gun.rotation + gun.recoilY * 0.005);
            ctx.scale(gun.scale, isFlipped ? -gun.scale : gun.scale);
            drawGun(ctx, gun.slideOffset);
            ctx.restore();

            ctx.globalCompositeOperation = 'screen';
            particles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);

                if (p.type === 'star_flash') {
                    ctx.rotate(p.angle);
                    ctx.fillStyle = `rgba(255, 220, 100, ${p.life})`;
                    ctx.beginPath();
                    let spikes = 6;
                    let outer = p.size * p.life;
                    let inner = outer * 0.3;
                    for (let i = 0; i < spikes * 2; i++) {
                        let rad = i % 2 === 0 ? outer : inner;
                        let a = (i * Math.PI) / spikes;
                        let x = Math.cos(a) * rad;
                        let y = Math.sin(a) * rad;
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (p.type === 'core_flash') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'smoke') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = `rgba(120, 120, 120, ${p.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'screen';
                } else {
                    ctx.fillStyle = `rgba(255, 200, 50, ${p.life})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
            ctx.globalCompositeOperation = 'source-over';

            ctx.restore();

            ctx.strokeStyle = 'rgba(0, 255, 200, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
            ctx.moveTo(mouse.x + 15, mouse.y); ctx.lineTo(mouse.x + 5, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y - 5);
            ctx.moveTo(mouse.x, mouse.y + 15); ctx.lineTo(mouse.x, mouse.y + 5);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            if (isStarted) { update(); draw(); }
            requestAnimationFrame(loop);
        }

        updateAmmoUI();
    </script>
</body>
</html>
