<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Poké Ball</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #2a2a35 0%, #0a0a0f 100%); 
            font-family: 'Inter', -apple-system, sans-serif; 
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            display: block;
        }
        #loading { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: white; 
            font-size: 1.2rem; 
            pointer-events: none; 
            transition: opacity 0.5s ease;
            letter-spacing: 2px;
            font-weight: 300;
        }
        #instructions { 
            position: absolute; 
            bottom: 40px; 
            width: 100%; 
            text-align: center; 
            color: rgba(255, 255, 255, 0.5); 
            pointer-events: none; 
            user-select: none; 
            font-size: 0.85rem; 
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }
        .hidden {
            opacity: 0 !important;
        }
    </style>
    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">ASSEMBLING...</div>
    <div id="canvas-container"></div>
    <div id="instructions">CLICK TO CATCH</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const BALL_RADIUS = 2;
        let isAnimatingCatch = false;
        
        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Optional: Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 5;
        controls.maxDistance = 20;
        // Restrict vertical rotation slightly
        controls.maxPolarAngle = Math.PI / 2 + 0.2; 

        // --- Post Processing ---
        const renderScene = new RenderPass(scene, camera);
        renderScene.clearColor = new THREE.Color(0x000000);
        renderScene.clearAlpha = 0;
        
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.8; // High threshold so only emissive stuff glows
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.001;
        scene.add(mainLight);

        // Add a back light for edge highlights
        const rimLight = new THREE.DirectionalLight(0x99aaff, 1.5);
        rimLight.position.set(-5, 3, -5);
        scene.add(rimLight);
        
        // Point light for strong glossy reflection
        const pointLight = new THREE.PointLight(0xffffff, 2, 20);
        pointLight.position.set(2, 4, 4);
        scene.add(pointLight);

        // --- Build Poké Ball ---
        const pokeballGroup = new THREE.Group();
        const pivotGroup = new THREE.Group(); // Used for shake animation pivot
        pivotGroup.position.y = BALL_RADIUS; // Pivot at center
        pokeballGroup.position.y = -BALL_RADIUS; // Move visual ball down so bottom is at pivot y=0
        pivotGroup.add(pokeballGroup);
        scene.add(pivotGroup);

        // Materials
        const redMaterial = new THREE.MeshStandardMaterial({
            color: 0xcc0000,
            roughness: 0.1,
            metalness: 0.2,
            clearcoat: 0.8,
            clearcoatRoughness: 0.1
        });

        const whiteMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.1,
            clearcoat: 0.8,
            clearcoatRoughness: 0.1
        });

        const blackMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: 0.7,
            metalness: 0.1
        });

        const buttonEmissiveMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xff0000,
            emissiveIntensity: 0.0, // Start off
            roughness: 0.2,
            metalness: 0.1
        });

        // Top Hemisphere (Red)
        const topGeo = new THREE.SphereGeometry(BALL_RADIUS, 64, 64, 0, Math.PI * 2, 0, Math.PI / 2);
        const topHemisphere = new THREE.Mesh(topGeo, redMaterial);
        topHemisphere.castShadow = true;
        topHemisphere.receiveShadow = true;
        pokeballGroup.add(topHemisphere);

        // Bottom Hemisphere (White)
        const bottomGeo = new THREE.SphereGeometry(BALL_RADIUS, 64, 64, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
        const bottomHemisphere = new THREE.Mesh(bottomGeo, whiteMaterial);
        bottomHemisphere.castShadow = true;
        bottomHemisphere.receiveShadow = true;
        pokeballGroup.add(bottomHemisphere);

        // Center Black Band
        // Torus or Cylinder? Cylinder is better for flat band
        const bandGeo = new THREE.CylinderGeometry(BALL_RADIUS * 1.01, BALL_RADIUS * 1.01, 0.15, 64);
        const band = new THREE.Mesh(bandGeo, blackMaterial);
        band.castShadow = true;
        band.receiveShadow = true;
        pokeballGroup.add(band);

        // Button System
        const buttonGroup = new THREE.Group();
        buttonGroup.position.set(0, 0, BALL_RADIUS);
        buttonGroup.rotation.x = Math.PI / 2; // Face forward
        pokeballGroup.add(buttonGroup);

        // Button Outer Ring (Black)
        const btnOuterGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.1, 64);
        const btnOuter = new THREE.Mesh(btnOuterGeo, blackMaterial);
        btnOuter.position.y = 0.05;
        buttonGroup.add(btnOuter);

        // Button Inner Ring (White)
        const btnInnerGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 64);
        const btnInner = new THREE.Mesh(btnInnerGeo, whiteMaterial);
        btnInner.position.y = 0.075;
        buttonGroup.add(btnInner);

        // Button Core (Emissive)
        const btnCoreGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.16, 64);
        const btnCore = new THREE.Mesh(btnCoreGeo, buttonEmissiveMaterial);
        btnCore.position.y = 0.08;
        buttonGroup.add(btnCore);

        // Ground Plane for soft shadow
        const planeGeo = new THREE.PlaneGeometry(20, 20);
        // Shadow material
        const planeMat = new THREE.ShadowMaterial({ opacity: 0.4 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -BALL_RADIUS * 1.5; // Starts below the floating ball
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Setup base position (for idle anim)
        const basePivotY = 0; // Where the pivot rests on the ground

        document.getElementById('loading').style.opacity = '0';

        // --- Particle System ---
        const particleCount = 50;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleVel = [];
        
        for(let i=0; i < particleCount; i++) {
            particlePos[i*3] = 0;
            particlePos[i*3+1] = 0;
            particlePos[i*3+2] = 0;
            
            // Random direction
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const speed = 2 + Math.random() * 3;
            
            particleVel.push({
                x: Math.sin(phi) * Math.cos(theta) * speed,
                y: Math.sin(phi) * Math.sin(theta) * speed,
                z: Math.cos(phi) * speed
            });
        }
        
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        
        // Star texture for particles
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.beginPath();
        // Draw simple star
        for (let i = 0; i < 5; i++) {
            ctx.lineTo(16 + 15 * Math.cos(18 + i * 72 * Math.PI / 180), 16 + 15 * Math.sin(18 + i * 72 * Math.PI / 180));
            ctx.lineTo(16 + 6 * Math.cos(54 + i * 72 * Math.PI / 180), 16 + 6 * Math.sin(54 + i * 72 * Math.PI / 180));
        }
        ctx.closePath();
        ctx.fill();
        const starTexture = new THREE.CanvasTexture(canvas);

        const particleMat = new THREE.PointsMaterial({
            size: 0.5,
            map: starTexture,
            transparent: true,
            opacity: 0, // Hidden initially
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);


        // --- Interaction & Animation Logic ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        const clock = new THREE.Clock();
        
        // State variables
        let idleTime = 0;
        let catchState = 0; // 0: idle, 1: dropping, 2: shaking, 3: caught
        let shakeTime = 0;
        let shakeCount = 0;
        let maxShakes = 3;
        
        // Custom easing functions
        const easeOutBounce = (x) => {
            const n1 = 7.5625; const d1 = 2.75;
            if (x < 1 / d1) { return n1 * x * x; } 
            else if (x < 2 / d1) { return n1 * (x -= 1.5 / d1) * x + 0.75; } 
            else if (x < 2.5 / d1) { return n1 * (x -= 2.25 / d1) * x + 0.9375; } 
            else { return n1 * (x -= 2.625 / d1) * x + 0.984375; }
        };

        const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;

        window.addEventListener('resize', onWindowResize, false);
        
        window.addEventListener('pointermove', (e) => {
            if (isAnimatingCatch) return;
            // Normalize mouse coords
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            // Subtle rotation towards mouse
            const targetRotX = mouse.y * 0.2;
            const targetRotY = mouse.x * 0.2;
            
            pivotGroup.rotation.x += (targetRotX - pivotGroup.rotation.x) * 0.1;
            pivotGroup.rotation.y += (targetRotY - pivotGroup.rotation.y) * 0.1;
        });

        window.addEventListener('click', (e) => {
            if (isAnimatingCatch) return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pokeballGroup.children);

            if (intersects.length > 0) {
                startCatchSequence();
            }
        });

        function startCatchSequence() {
            isAnimatingCatch = true;
            catchState = 1; // Start dropping
            idleTime = 0;
            shakeCount = 0;
            document.getElementById('instructions').classList.add('hidden');
            
            // Reorient ball facing camera before dropping
            pivotGroup.rotation.set(0,0,0);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            const dt = clock.getDelta();
            
            if (!isAnimatingCatch) {
                // Idle animation: Floating
                idleTime += dt;
                pivotGroup.position.y = basePivotY + Math.sin(idleTime * 2) * 0.2 + 0.5; // Float above ground
                plane.position.y = -BALL_RADIUS * 1.5; // Adjust shadow
                plane.material.opacity = 0.3 - (Math.sin(idleTime * 2) * 0.1); // Shadow pulses
            } else {
                // Catch Sequence State Machine
                if (catchState === 1) {
                    // Dropping to ground
                    idleTime += dt * 3; // Use idleTime as a normalized 0-1 timer
                    let progress = Math.min(idleTime, 1.0);
                    
                    // Bounce effect
                    let yPos = 0.5 * (1 - easeOutBounce(progress));
                    pivotGroup.position.y = basePivotY + yPos;
                    
                    if (progress >= 1.0) {
                        catchState = 2; // Transition to shaking
                        shakeTime = 0;
                    }
                } 
                else if (catchState === 2) {
                    // Shaking and Blinking
                    shakeTime += dt;
                    
                    // Shake config
                    const shakeDuration = 1.0;
                    const waitDuration = 0.5;
                    const totalPhase = shakeDuration + waitDuration;
                    
                    let phaseTime = shakeTime % totalPhase;
                    
                    if (phaseTime < shakeDuration) {
                        // Wobble left and right
                        let p = phaseTime / shakeDuration; // 0 to 1
                        // Math.sin(p * PI * 2) gives a full oscillation, we want it to wobble and return
                        let angle = Math.sin(p * Math.PI * 2) * 0.4 * (1 - p); // Dampen at the end
                        
                        pivotGroup.rotation.z = angle; // Roll left/right
                        // Lift slightly when wobbling
                        pivotGroup.position.y = basePivotY + Math.abs(Math.sin(p * Math.PI)) * 0.2;
                        
                        // Blink logic during the wobble
                        if (p > 0.2 && p < 0.5) {
                            buttonEmissiveMaterial.emissiveIntensity = 2.0; // Glow Bright
                        } else {
                            buttonEmissiveMaterial.emissiveIntensity = 0.0;
                        }
                    } else {
                        // Wait phase
                        pivotGroup.rotation.z = 0;
                        pivotGroup.position.y = basePivotY;
                        buttonEmissiveMaterial.emissiveIntensity = 0.0;
                        
                        if (shakeTime >= totalPhase) {
                            shakeTime -= totalPhase;
                            shakeCount++;
                            if (shakeCount >= maxShakes) {
                                catchState = 3; // Caught!
                                shakeTime = 0;
                            }
                        }
                    }
                } 
                else if (catchState === 3) {
                    // Caught! Final Ding and Particles
                    shakeTime += dt;
                    if (shakeTime < 0.2) {
                        buttonEmissiveMaterial.emissiveIntensity = 5.0; // Big flash
                        buttonEmissiveMaterial.emissive.setHex(0xffffcc); // Slightly yellowish white flash
                    } else {
                        buttonEmissiveMaterial.emissiveIntensity = 1.0;
                        buttonEmissiveMaterial.emissive.setHex(0xaaaaaa); // Dimmed out, caught state
                        
                        // Trigger particles once
                        if (particleMat.opacity === 0) {
                            particleMat.opacity = 1.0;
                            particleSystem.position.copy(pivotGroup.position);
                            // Move to button
                            particleSystem.position.z += BALL_RADIUS;
                        }
                    }
                    
                    // Animate particles expanding
                    if (particleMat.opacity > 0) {
                        const positions = particleGeo.attributes.position.array;
                        for(let i=0; i<particleCount; i++) {
                            positions[i*3] += particleVel[i].x * dt * 5;
                            positions[i*3+1] += particleVel[i].y * dt * 5;
                            positions[i*3+2] += particleVel[i].z * dt * 5;
                        }
                        particleGeo.attributes.position.needsUpdate = true;
                        particleMat.opacity -= dt * 1.5; // Fade out
                        
                        if (particleMat.opacity <= 0) {
                            // Reset everything after particle fade
                            setTimeout(resetCatch, 1500);
                            catchState = 4; // Done
                        }
                    }
                }
            }

            controls.update();
            composer.render();
        }
        
        function resetCatch() {
            isAnimatingCatch = false;
            catchState = 0;
            idleTime = 0;
            buttonEmissiveMaterial.emissive.setHex(0xff0000);
            buttonEmissiveMaterial.emissiveIntensity = 0;
            
            // Reset particles
            const positions = particleGeo.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                positions[i*3] = 0;
                positions[i*3+1] = 0;
                positions[i*3+2] = 0;
            }
            particleGeo.attributes.position.needsUpdate = true;
            particleMat.opacity = 0;
            
            document.getElementById('instructions').classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        animate();

    </script>
</body>
</html>
