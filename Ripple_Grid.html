<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Grid</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070612; }
  canvas { display: block; }
  .hint {
    position: fixed; bottom: 5%; width: 100%; text-align: center; pointer-events: none;
    font: 300 12px system-ui, sans-serif; letter-spacing: 0.5em; text-transform: uppercase;
    color: rgba(255,255,255,0.5); transition: opacity 2s;
  }
</style>
</head>
<body>
<div class="hint" id="hint">hover · click to send a ripple</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070612);
scene.fog = new THREE.Fog(0x070612, 25, 70);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------- Lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(10, 30, 10);
scene.add(sun);
const pinkLight = new THREE.PointLight(0xff3fd0, 2.2, 60);
const cyanLight = new THREE.PointLight(0x30d5ff, 2.2, 60);
scene.add(pinkLight, cyanLight);

/* ---------- Instanced bar grid ---------- */
const GRID = 64, SP = 1;
const geo = new THREE.BoxGeometry(0.78, 1, 0.78);
geo.translate(0, 0.5, 0);                 // pivot at the base so scaling grows upward
const mat = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.25 });
const mesh = new THREE.InstancedMesh(geo, mat, GRID * GRID);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);

const dummy = new THREE.Object3D();
const color = new THREE.Color();
const gx = new Float32Array(GRID * GRID), gz = new Float32Array(GRID * GRID);
for (let i = 0; i < GRID; i++)
  for (let j = 0; j < GRID; j++) {
    gx[i * GRID + j] = (i - GRID / 2) * SP;
    gz[i * GRID + j] = (j - GRID / 2) * SP;
  }

/* ---------- Interaction: mouse -> point on the floor ---------- */
const raycaster = new THREE.Raycaster();
const floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2(0, 0);
const hit = new THREE.Vector3(999, 0, 999);
let hasMouse = false;

addEventListener('pointermove', e => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  hasMouse = true;
});
const ripples = [];
function addRipple(x, z, strength = 1) { ripples.push({ x, z, t: clock.getElapsedTime(), s: strength }); }
addEventListener('pointerdown', () => { if (hasMouse) addRipple(hit.x, hit.z, 1.3); });

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
let nextAuto = 1;

function animate() {
  const t = clock.getElapsedTime();

  // find mouse position on the floor
  raycaster.setFromCamera(ndc, camera);
  if (hasMouse) raycaster.ray.intersectPlane(floor, hit);

  // automatic ripples so it's alive even without input
  if (t > nextAuto) {
    addRipple((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.9);
    nextAuto = t + 1.6 + Math.random() * 1.5;
  }
  for (let r = ripples.length - 1; r >= 0; r--) if (t - ripples[r].t > 7) ripples.splice(r, 1);

  for (let k = 0; k < GRID * GRID; k++) {
    const x = gx[k], z = gz[k];

    // gentle rolling base waves
    let h = 1.6
      + Math.sin(x * 0.28 + t * 0.9) * 0.55
      + Math.sin(z * 0.24 - t * 1.1) * 0.55
      + Math.sin((x + z) * 0.14 + t * 0.6) * 0.8;

    // bump that follows the cursor
    if (hasMouse) {
      const dx = x - hit.x, dz = z - hit.z;
      h += 3.2 * Math.exp(-(dx * dx + dz * dz) / 7);
    }
    // expanding ring ripples
    for (let r = 0; r < ripples.length; r++) {
      const rp = ripples[r], age = t - rp.t;
      const dx = x - rp.x, dz = z - rp.z;
      const d = Math.sqrt(dx * dx + dz * dz);
      const wave = Math.exp(-Math.pow(d - age * 9, 2) / 3);
      h += 5 * rp.s * wave * Math.exp(-age * 0.55);
    }
    h = Math.max(h, 0.15);

    dummy.position.set(x, 0, z);
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(k, dummy.matrix);

    const n = Math.min(h / 7, 1);
    color.setHSL(0.56 + n * 0.32 + Math.sin(t * 0.2) * 0.04, 0.9, 0.3 + n * 0.35);
    mesh.setColorAt(k, color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;

  // orbiting colored lights + slow camera drift
  pinkLight.position.set(Math.cos(t * 0.5) * 22, 8, Math.sin(t * 0.5) * 22);
  cyanLight.position.set(Math.cos(t * 0.5 + Math.PI) * 22, 8, Math.sin(t * 0.5 + Math.PI) * 22);
  const ang = t * 0.06;
  camera.position.set(Math.sin(ang) * 30, 17 + Math.sin(t * 0.2) * 2, Math.cos(ang) * 30);
  camera.lookAt(0, 1, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
setTimeout(() => (document.getElementById('hint').style.opacity = 0), 6000);
</script>
</body>
</html>
