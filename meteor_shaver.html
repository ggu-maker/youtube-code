
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meteor Shower</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05070f;
    height: 100%;
    width: 100%;
    cursor: default;
  }
  canvas {
    display: block;
  }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(200, 210, 235, 0.45);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hint">click for a shooting star</div>
<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Background gradient (night sky) ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02030a');
  g.addColorStop(0.55, '#060a1a');
  g.addColorStop(1, '#0c1226');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Stars ----------
const STAR_COUNT = 260;
let stars = [];
function makeStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      baseAlpha: Math.random() * 0.6 + 0.3,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}
makeStars();
window.addEventListener('resize', () => { makeStars(); });

function drawStars(t) {
  for (const s of stars) {
    const flicker = Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.35;
    const alpha = Math.max(0, Math.min(1, s.baseAlpha + flicker));
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Distant glow / nebula haze ----------
function drawHaze() {
  const g1 = ctx.createRadialGradient(W*0.75, H*0.15, 0, W*0.75, H*0.15, W*0.55);
  g1.addColorStop(0, 'rgba(80,60,140,0.10)');
  g1.addColorStop(1, 'rgba(80,60,140,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);

  const g2 = ctx.createRadialGradient(W*0.15, H*0.6, 0, W*0.15, H*0.6, W*0.5);
  g2.addColorStop(0, 'rgba(40,80,140,0.08)');
  g2.addColorStop(1, 'rgba(40,80,140,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Meteors ----------
class Meteor {
  constructor(forcedBurst) {
    this.reset(forcedBurst);
  }
  reset(forcedBurst) {
    // Meteors enter from top area, travel down-left to down-right diagonal (typical shower look)
    const angle = (Math.random() * 18 + 55) * Math.PI / 180; // 55-73 deg from horizontal
    this.angle = angle;
    this.speed = Math.random() * 9 + 11; // px per frame baseline
    this.len = Math.random() * 140 + 90;
    this.x = Math.random() * (W * 1.3) - W * 0.15;
    this.y = -Math.random() * H * 0.4 - 20;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    this.life = 1;
    this.maxLife = Math.random() * 40 + 55;
    this.age = 0;
    this.thickness = Math.random() * 1.4 + 1.1;
    this.hue = Math.random() < 0.75 ? 0 : (Math.random() < 0.5 ? 1 : 2);
    // 0: white-blue classic, 1: warm gold, 2: pale green
    this.flare = forcedBurst || Math.random() < 0.12; // occasional bright fireball
    if (this.flare) {
      this.thickness *= 2.2;
      this.len *= 1.4;
    }
    this.trail = [];
  }
  colorStops() {
    if (this.hue === 0) return ['255,255,255', '190,210,255', '120,150,255'];
    if (this.hue === 1) return ['255,244,214', '255,210,140', '255,160,80'];
    return ['220,255,230', '160,255,190', '90,220,160'];
  }
  update() {
    this.age++;
    this.x += this.vx;
    this.y += this.vy;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 6) this.trail.shift();
    if (this.age > this.maxLife || this.x > W + 100 || this.y > H + 100) {
      this.dead = true;
    }
  }
  draw() {
    const tailX = this.x - this.vx * (this.len / this.speed);
    const tailY = this.y - this.vy * (this.len / this.speed);
    const [c1, c2, c3] = this.colorStops();

    // fade in/out over life
    let progress = this.age / this.maxLife;
    let fade = 1;
    if (progress < 0.12) fade = progress / 0.12;
    else if (progress > 0.75) fade = 1 - (progress - 0.75) / 0.25;

    const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
    grad.addColorStop(0, `rgba(${c3},0)`);
    grad.addColorStop(0.4, `rgba(${c2},${0.35 * fade})`);
    grad.addColorStop(1, `rgba(${c1},${0.95 * fade})`);

    ctx.save();
    ctx.lineCap = 'round';

    // outer glow
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.thickness * 3.2;
    ctx.globalAlpha = 0.28 * fade;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    // core streak
    ctx.globalAlpha = 1;
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.thickness;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    // bright head
    const headGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.thickness * 5);
    headGlow.addColorStop(0, `rgba(${c1},${0.9 * fade})`);
    headGlow.addColorStop(1, `rgba(${c1},0)`);
    ctx.fillStyle = headGlow;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.thickness * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

let meteors = [];
let lastSpawn = 0;
let spawnInterval = 900; // ms, will vary

function maybeSpawn(t) {
  if (t - lastSpawn > spawnInterval) {
    meteors.push(new Meteor(false));
    lastSpawn = t;
    spawnInterval = Math.random() * 1400 + 500;
  }
}

// click / tap to burst a bright meteor
window.addEventListener('pointerdown', () => {
  meteors.push(new Meteor(true));
});

// ---------- Animation loop ----------
let lastT = performance.now();
function frame(t) {
  drawSky();
  drawHaze();
  drawStars(t * 0.06);

  maybeSpawn(t);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.update();
    m.draw();
    if (m.dead) meteors.splice(i, 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
