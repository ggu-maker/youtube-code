<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Fractal Warp</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    color: rgba(255,255,255,0.6); font: 12px/1.6 monospace;
    letter-spacing: 3px; text-transform: uppercase; pointer-events: none;
    text-shadow: 0 0 10px #000;
  }
  .title {
    position: fixed; top: 18px; left: 22px;
    color: rgba(255,255,255,0.8); font: 13px monospace; letter-spacing: 4px;
    text-transform: uppercase; pointer-events: none; text-shadow: 0 0 12px #0ff;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title" id="title">Universe 1</div>
<div class="hud">Move: steer · Click: shockwave + next universe · Hold: warp · M: mic reactive · F: fullscreen</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });
if (!gl) {
  document.body.innerHTML = '<h2 style="color:#fff;font-family:sans-serif;padding:20px">WebGL is not supported in this browser.</h2>';
}

// ---------- Shaders ----------
const vsSrc = `
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
`;

// PASS 1: the fractal scene
const sceneSrc = `
precision highp float;
uniform vec2 r;
uniform float t, clock, p, bass, twist, thick;
uniform vec2 m;
uniform vec3 fold;

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

vec3 pal(float x){
  return 0.5 + 0.5 * cos(6.28318 * (x + vec3(0.0, 0.33, 0.67) + p));
}

float map(vec3 q){
  q.xy *= rot(q.z * twist + clock * 0.15);
  q = abs(mod(q, 4.0) - 2.0);
  for(int j = 0; j < 4; j++){
    q = abs(q) - fold;
    q.xy *= rot(0.7 + 0.25 * sin(clock * 0.4));
    q.xz *= rot(0.45 + 0.15 * cos(clock * 0.3));
  }
  float d1 = length(q.xy);
  float d2 = length(q.yz);
  float d3 = length(q.xz);
  return min(d1, min(d2, d3)) - thick * (1.0 + bass * 1.6);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * r) / r.y;
  vec2 mo = (m - 0.5 * r) / r.y;

  vec3 ro = vec3(0.0, 0.0, t);
  // FOV punches with the beat
  vec3 rd = normalize(vec3(uv, 1.0 - bass * 0.35));
  rd.xy *= rot(clock * 0.1 + mo.x * 2.5);
  rd.yz *= rot(mo.y * 1.5);

  vec3 col = vec3(0.0);
  float d = 0.0;

  for(int i = 0; i < 72; i++){
    vec3 q = ro + rd * d;
    float dist = map(q);
    float glow = (0.007 + bass * 0.006) / (0.012 + abs(dist));
    col += pal(d * 0.08 + clock * 0.05) * glow * exp(-d * 0.045);
    d += max(abs(dist) * 0.65, 0.015);
    if(d > 40.0) break;
  }

  float c = length(uv);
  col += pal(clock * 0.1) * (0.025 + bass * 0.05) / (c + 0.05);

  col = 1.0 - exp(-col * 1.3);
  gl_FragColor = vec4(col, 1.0);
}
`;

// PASS 2: post-processing (bloom, chromatic aberration, glitch, shockwave, grain)
const postSrc = `
precision highp float;
uniform sampler2D tex;
uniform vec2 r;
uniform float clock, bass, shockT;
uniform vec2 shockC;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

void main(){
  vec2 uv = gl_FragCoord.xy / r;
  float aspect = r.x / r.y;

  // shockwave ripple from click
  vec2 dir = uv - shockC;
  float dist = length(dir * vec2(aspect, 1.0));
  float ring = exp(-pow((dist - shockT * 0.9) * 10.0, 2.0)) * exp(-shockT * 1.4);
  uv += normalize(dir + 1e-5) * ring * 0.06;

  // glitch slices on strong beats
  float glitch = smoothstep(0.55, 1.0, bass);
  float band = floor(uv.y * 28.0);
  float h = hash(vec2(band, floor(clock * 14.0)));
  uv.x += step(0.93, h) * (h - 0.96) * glitch * 1.2;

  // chromatic aberration (stronger at edges and on beats)
  vec2 cd = uv - 0.5;
  float ab = 0.004 + bass * 0.012 + ring * 0.02;
  vec3 col;
  col.r = texture2D(tex, uv + cd * ab * 1.5).r;
  col.g = texture2D(tex, uv).g;
  col.b = texture2D(tex, uv - cd * ab * 1.5).b;

  // cheap bloom: ring of blurred taps at two radii
  vec3 bloom = vec3(0.0);
  for(int i = 0; i < 12; i++){
    float a = float(i) * 0.5236;
    vec2 o = vec2(cos(a), sin(a));
    bloom += texture2D(tex, uv + o * 0.008).rgb;
    bloom += texture2D(tex, uv + o * 0.022).rgb;
  }
  bloom /= 24.0;
  col += bloom * (0.9 + bass * 0.8);

  // scanlines + grain + vignette
  col *= 0.94 + 0.06 * sin(gl_FragCoord.y * 1.5);
  col += (hash(uv * r + clock) - 0.5) * 0.05;
  float v = length(cd);
  col *= 1.0 - 0.9 * v * v;

  col = pow(col, vec3(0.88));
  gl_FragColor = vec4(col, 1.0);
}
`;

// ---------- GL helpers ----------
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'a');
  gl.linkProgram(pr);
  return pr;
}
function uniforms(pr, names) {
  const o = {};
  names.forEach(n => o[n] = gl.getUniformLocation(pr, n));
  return o;
}

const sceneProg = makeProgram(sceneSrc);
const postProg = makeProgram(postSrc);
const SU = uniforms(sceneProg, ['r','t','clock','p','bass','twist','thick','m','fold']);
const PU = uniforms(postProg, ['tex','r','clock','bass','shockT','shockC']);

// fullscreen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ---------- Render target ----------
const SCALE = 0.6;          // scene resolution relative to the screen (lower = faster)
let sw, sh, tex, fb;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  sw = Math.floor(canvas.width * SCALE);
  sh = Math.floor(canvas.height * SCALE);

  if (tex) gl.deleteTexture(tex);
  if (fb) gl.deleteFramebuffer(fb);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sw, sh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
window.addEventListener('resize', resize);
resize();

// ---------- Universes (fractal presets) ----------
const universes = [
  { name: 'Neon Cathedral', fold: [0.55, 0.75, 0.45], twist: 0.12,  thick: 0.030, hue: 0.00 },
  { name: 'Plasma Veins',   fold: [0.80, 0.50, 0.90], twist: 0.30,  thick: 0.020, hue: 0.30 },
  { name: 'Ghost Engine',   fold: [0.35, 0.95, 0.60], twist: -0.20, thick: 0.045, hue: 0.60 },
  { name: 'Solar Lattice',  fold: [0.90, 0.90, 0.30], twist: 0.05,  thick: 0.025, hue: 0.85 }
];
let uIndex = 0;
const cur = { fold: [...universes[0].fold], twist: universes[0].twist, thick: universes[0].thick, hue: universes[0].hue };
const titleEl = document.getElementById('title');

function nextUniverse() {
  uIndex = (uIndex + 1) % universes.length;
  titleEl.textContent = 'Universe ' + (uIndex + 1) + ' · ' + universes[uIndex].name;
}
titleEl.textContent = 'Universe 1 · ' + universes[0].name;

// ---------- Input ----------
const mouse = { x: 0.5, y: 0.5 };
const smooth = { x: 0.5, y: 0.5 };
function setPointer(e) {
  const p = e.touches ? e.touches[0] : e;
  mouse.x = p.clientX / window.innerWidth;
  mouse.y = 1 - p.clientY / window.innerHeight;
}
window.addEventListener('mousemove', setPointer);
window.addEventListener('touchmove', setPointer, { passive: true });

let boosting = false;
let shockStart = -1e5;
const shockC = { x: 0.5, y: 0.5 };
function down(e) {
  setPointer(e);
  boosting = true;
  shockStart = performance.now();
  shockC.x = mouse.x; shockC.y = mouse.y;
  nextUniverse();
}
function up() { boosting = false; }
window.addEventListener('mousedown', down);
window.addEventListener('mouseup', up);
window.addEventListener('touchstart', down, { passive: true });
window.addEventListener('touchend', up);

window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  if (e.key === 'm' || e.key === 'M') enableMic();
});

// ---------- Audio (optional microphone) ----------
let analyser = null, freq = null;
async function enableMic() {
  if (analyser) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    titleEl.textContent += ' · MIC ON';
  } catch (err) {
    titleEl.textContent += ' · MIC DENIED';
  }
}

// ---------- Main loop ----------
let travel = 0, speed = 1.6, bass = 0, palette = 0, last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const clock = now / 1000;

  // beat energy: real mic if enabled, otherwise a synthetic pulse
  let target;
  if (analyser) {
    analyser.getByteFrequencyData(freq);
    let s = 0;
    for (let i = 0; i < 6; i++) s += freq[i];
    target = Math.min(1, Math.pow(s / 6 / 255, 1.6) * 1.8);
  } else {
    target = Math.pow(Math.max(0, Math.sin(clock * 2.6)), 10) * 0.55;
  }
  bass += (target - bass) * (target > bass ? 0.5 : 0.08);

  // speed
  const targetSpeed = (boosting ? 10 : 1.6) + bass * 3;
  speed += (targetSpeed - speed) * 0.06;
  travel += speed * dt;

  // ease everything toward the active universe
  const U = universes[uIndex];
  for (let i = 0; i < 3; i++) cur.fold[i] += (U.fold[i] - cur.fold[i]) * 0.03;
  cur.twist += (U.twist - cur.twist) * 0.03;
  cur.thick += (U.thick - cur.thick) * 0.03;
  cur.hue += (U.hue - cur.hue) * 0.03;
  palette = cur.hue;

  smooth.x += (mouse.x - smooth.x) * 0.08;
  smooth.y += (mouse.y - smooth.y) * 0.08;

  // PASS 1: scene -> texture
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, sw, sh);
  gl.useProgram(sceneProg);
  gl.uniform2f(SU.r, sw, sh);
  gl.uniform1f(SU.t, travel);
  gl.uniform1f(SU.clock, clock);
  gl.uniform1f(SU.p, palette);
  gl.uniform1f(SU.bass, bass);
  gl.uniform1f(SU.twist, cur.twist);
  gl.uniform1f(SU.thick, cur.thick);
  gl.uniform2f(SU.m, smooth.x * sw, smooth.y * sh);
  gl.uniform3f(SU.fold, cur.fold[0], cur.fold[1], cur.fold[2]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // PASS 2: post-process -> screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(PU.tex, 0);
  gl.uniform2f(PU.r, canvas.width, canvas.height);
  gl.uniform1f(PU.clock, clock);
  gl.uniform1f(PU.bass, bass);
  gl.uniform1f(PU.shockT, (now - shockStart) / 1000);
  gl.uniform2f(PU.shockC, shockC.x, shockC.y);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
