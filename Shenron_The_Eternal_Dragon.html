<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shenron - The Eternal Dragon</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#010201; font-family: 'Segoe UI', system-ui, sans-serif; }
  #info {
    position:absolute; top:20px; left:20px; color:#ffcc00; font-size:20px;
    letter-spacing:.15em; text-transform:uppercase; font-weight: bold; pointer-events:none; 
    text-shadow: 0 0 15px rgba(255, 204, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.5);
    z-index: 10;
  }
  #hint {
    position:absolute; top:52px; left:20px; color:#f0e68c; font-size:12px;
    letter-spacing:.08em; opacity:.8; pointer-events:none;
    text-shadow: 0 0 5px rgba(255, 204, 0, 0.4);
    z-index: 10;
  }
  #castBtn {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    padding:16px 36px; background:rgba(20, 15, 5, .7); border:2px solid #ffcc00;
    color:#ffdd44; border-radius:30px; cursor:pointer; font-size:15px;
    letter-spacing:.18em; text-transform:uppercase; font-weight: bold;
    backdrop-filter:blur(8px); transition:all .3s ease;
    box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    z-index: 10;
  }
  #castBtn:hover { 
    background:rgba(60, 40, 10, .9); 
    box-shadow: 0 0 35px rgba(255, 204, 0, .8), inset 0 0 15px rgba(255,204,0,.5); 
    color: #fff;
    border-color: #fff;
  }
  #castBtn:active { transform:translateX(-50%) scale(.94); }
  
  #flashOverlay {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="flashOverlay"></div>
<div id="info">Shenron</div>
<div id="hint">The Eternal Dragon</div>
<button id="castBtn">Grant My Wish</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
let scene, camera, renderer, clock, composer;
let dragonGroup, segments = [];
let auraPoints, auraData, dbGroup;
let castActive = false, castTimer = 0, castBoost = 0, lightningFlash = 0;
let tendrilR = [], tendrilL = [];
let attachmentR, attachmentL;
let spinePoints = [];
let mouse = new THREE.Vector2(0, 0);

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
  }
}, {passive: true});

// Make Shenron insanely long and detailed
const N = 180;
const SEGMENT_SPACING = 0.3;

// Procedural Scale Texture for ultra-realism
function createScaleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Background (crevices)
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, 512, 512);
    
    const rows = 16;
    const cols = 24;
    const w = 512 / cols;
    const h = 512 / rows;
    
    // Draw scales overlapping
    for(let i = 0; i <= rows + 1; i++) {
        for(let j = -1; j <= cols + 1; j++) {
            const x = j * w + (i % 2 === 0 ? w / 2 : 0);
            const y = i * h;
            
            // Gradient for 3D scale bump
            const grad = ctx.createRadialGradient(x, y + h*0.2, 0, x, y, w*0.8);
            grad.addColorStop(0, '#fff'); // Peak of scale
            grad.addColorStop(0.6, '#777');
            grad.addColorStop(1, '#111'); // Edge
            
            ctx.beginPath();
            ctx.moveTo(x, y - h*0.2);
            ctx.quadraticCurveTo(x + w*0.7, y, x, y + h*0.9);
            ctx.quadraticCurveTo(x - w*0.7, y, x, y - h*0.2);
            
            ctx.fillStyle = grad;
            ctx.fill();
        }
    }
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 1); // Wrap around the cylinder body
    return tex;
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010201);
  scene.fog = new THREE.FogExp2(0x010201, 0.02); // Slightly less fog to see the long body

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 4, 30); // Pulled back for massive scale

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  
  // Enable shadows for realism
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  
  document.body.appendChild(renderer.domElement);

  // Epic Bloom Settings
  const renderScene = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.5, 0.85);
  bloomPass.threshold = 0.35;
  bloomPass.strength = 1.5;
  bloomPass.radius = 0.9; 
  
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  scene.add(new THREE.AmbientLight(0x223322, 1.4)); 
  
  // Dynamic Shadow-casting Key Light
  const keyLight = new THREE.DirectionalLight(0xfff0c2, 1.8);
  keyLight.position.set(12, 20, 15);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 100;
  const d = 25;
  keyLight.shadow.camera.left = -d;
  keyLight.shadow.camera.right = d;
  keyLight.shadow.camera.top = d;
  keyLight.shadow.camera.bottom = -d;
  keyLight.shadow.bias = -0.001;
  scene.add(keyLight);
  
  const fillLight = new THREE.DirectionalLight(0x77bbff, 0.6);
  fillLight.position.set(-15, -5, -10);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xffaa00, 2.5, 50);
  rimLight.position.set(0, -6, 8);
  scene.add(rimLight);

  addStarfield();
  addDragonBalls();

  dragonGroup = new THREE.Group();
  scene.add(dragonGroup);
  
  for(let i=0; i<N; i++) {
    spinePoints.push(new THREE.Vector3(0, -15, -i * SEGMENT_SPACING)); 
  }
  
  buildDragon();
  buildTendrils();
  buildAura();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  document.getElementById('castBtn').addEventListener('click', () => {
    castActive = true;
    castTimer = 0;
    // Initial big lightning flash
    document.getElementById('flashOverlay').style.opacity = '1';
    setTimeout(() => { document.getElementById('flashOverlay').style.opacity = '0'; }, 200);
  });
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function addStarfield() {
  const geo = new THREE.BufferGeometry();
  const count = 1500;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * 150;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 150;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 150;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffeedd, size: 0.05, transparent: true, opacity: 0.6 });
  scene.add(new THREE.Points(geo, mat));
}

function createStarGeo() {
    const shape = new THREE.Shape();
    const outerRadius = 0.12;
    const innerRadius = 0.05;
    const points = 5;
    for (let j = 0; j < points * 2; j++) {
        const r = (j % 2 === 0) ? outerRadius : innerRadius;
        const a = (j / (points * 2)) * Math.PI * 2 - Math.PI / 2;
        if (j === 0) shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    const extrudeSettings = { depth: 0.02, bevelEnabled: false };
    const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    geo.center(); 
    return geo;
}

function addDragonBalls() {
  dbGroup = new THREE.Group();
  const dbGeo = new THREE.SphereGeometry(1.3, 32, 32);
  const dbMat = new THREE.MeshStandardMaterial({
      color: 0xff6600, emissive: 0xff3300, emissiveIntensity: 0.6,
      roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.85
  });
  
  const starGeo = createStarGeo();
  const starMat = new THREE.MeshBasicMaterial({color: 0xcc0000}); // Classic red stars
  
  for(let i=0; i<7; i++) {
      const db = new THREE.Mesh(dbGeo, dbMat);
      const angle = (i/7) * Math.PI * 2;
      db.position.set(Math.cos(angle)*6.0, -6.5, Math.sin(angle)*4.5 - 2);
      
      const numStars = i + 1;
      const starGroup = new THREE.Group();
      
      for(let s=0; s<numStars; s++) {
          const star = new THREE.Mesh(starGeo, starMat);
          if (numStars === 1) {
              star.position.set(0, 0, 0);
          } else if (numStars === 2) {
              star.position.set(-0.2 + s*0.4, 0, 0);
          } else if (numStars === 3) {
              const a = (s/3) * Math.PI*2 - Math.PI/2;
              star.position.set(Math.cos(a)*0.25, Math.sin(a)*0.25, 0);
          } else if (numStars === 4) {
              const r = Math.floor(s/2);
              const c = s%2;
              star.position.set(-0.2 + c*0.4, 0.2 - r*0.4, 0);
          } else if (numStars === 5) {
              const a = (s/5) * Math.PI*2 - Math.PI/2;
              star.position.set(Math.cos(a)*0.3, Math.sin(a)*0.3, 0);
          } else if (numStars === 6) {
              const r = Math.floor(s/2); 
              const c = s%2;
              star.position.set(-0.2 + c*0.4, 0.35 - r*0.35, 0);
          } else if (numStars === 7) {
              if (s === 0) star.position.set(0, 0, 0);
              else {
                  const a = ((s-1)/6) * Math.PI*2 - Math.PI/2;
                  star.position.set(Math.cos(a)*0.35, Math.sin(a)*0.35, 0);
              }
          }
          starGroup.add(star);
      }
      
      starGroup.position.set(0, 0, 0.7);
      starGroup.rotation.x = -0.2;
      db.add(starGroup);
      
      const innerGlow = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0.3}));
      db.add(innerGlow);
      
      const dbLight = new THREE.PointLight(0xff6600, 0.6, 12);
      db.add(dbLight);
      
      dbGroup.add(db);
  }
  scene.add(dbGroup);
}

function spinePoint(t, time, out) {
  const idx = t * (N - 1);
  const i = Math.floor(idx);
  const f = idx - i;
  if (i >= N - 1) return out.copy(spinePoints[N - 1]);
  if (i < 0) return out.copy(spinePoints[0]);
  
  out.copy(spinePoints[i]).lerp(spinePoints[i+1], f);
  return out;
}

const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
function spineTangent(t, time, out) {
  const eps = 0.05; 
  spinePoint(Math.min(t + eps, 1), time, _p1);
  spinePoint(Math.max(t - eps, 0), time, _p2);
  out.copy(_p1).sub(_p2).normalize();
  return out;
}

function radiusAt(t) {
  if (t < 0.03) return 0.6 + t * 6.0; // Head expands quickly
  const body = 1.0 * Math.pow(1 - t, 0.65); // Gradual taper
  return Math.max(0.08, body * 0.95 + 0.1);
}

function buildDragon() {
  const scaleTex = createScaleTexture();
  
  // Highly detailed, smooth materials with bump maps
  const bodyMat = new THREE.MeshStandardMaterial({ 
      color: 0x074a16, // Rich emerald green
      roughness: 0.5, 
      metalness: 0.2,
      bumpMap: scaleTex,
      bumpScale: 0.03
  }); 
  const bellyMat = new THREE.MeshStandardMaterial({ color: 0xdeb86a, roughness: 0.7, metalness: 0.1 }); 
  const hornMat = new THREE.MeshStandardMaterial({ color: 0x3d2511, roughness: 0.8, metalness: 0.1 }); 
  const clawMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.6 });
  const redMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 

  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const r = radiusAt(t);
    const segGroup = new THREE.Group();
    
    // Main Body Cylinder
    const geo = new THREE.CylinderGeometry(r, r * 0.94, SEGMENT_SPACING * 1.15, 20);
    geo.rotateX(-Math.PI / 2); 
    const mesh = new THREE.Mesh(geo, bodyMat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    segGroup.add(mesh);
    
    // Ribbed Belly 
    const bellyGeo = new THREE.CylinderGeometry(r * 0.97, r * 0.95, SEGMENT_SPACING * 1.2, 16, 1, false, Math.PI/2 - 0.5, Math.PI + 1.0);
    bellyGeo.rotateX(-Math.PI/2);
    bellyGeo.rotateZ(-Math.PI/2);
    const belly = new THREE.Mesh(bellyGeo, bellyMat);
    belly.position.y = -r * 0.05;
    belly.castShadow = true;
    belly.receiveShadow = true;
    
    // Deep ridges for realistic segmentation
    const ridgeGeo = new THREE.BoxGeometry(r * 1.85, 0.08, SEGMENT_SPACING * 0.4);
    const ridge = new THREE.Mesh(ridgeGeo, bellyMat);
    ridge.position.set(0, -r * 0.93, SEGMENT_SPACING * 0.3); 
    ridge.castShadow = true;
    belly.add(ridge);
    
    segGroup.add(belly);

    // Continuous Dense Dorsal Spikes
    if (i > 4 && i < N - 3) {
      // 3 overlapping spikes per segment to form a thick, continuous ridge
      for(let s = -1; s <= 1; s++) {
          const spikeGeo = new THREE.ConeGeometry(r * 0.12, r * 0.8, 6);
          const spike = new THREE.Mesh(spikeGeo, bodyMat);
          spike.position.set(0, r * 0.92, s * SEGMENT_SPACING * 0.33);
          spike.rotation.x = -0.5 + s*0.1; // sweep back
          spike.castShadow = true;
          segGroup.add(spike);
      }
    }

    // Legs (Perfectly spaced along the massive body)
    if (i === 25 || i === 130) {
      const buildArm = (isRight) => {
        const arm = new THREE.Group();
        
        // Shoulder
        const upperGeo = new THREE.CylinderGeometry(r*0.25, r*0.2, r*2.2, 10);
        upperGeo.translate(0, -r*1.1, 0);
        const upper = new THREE.Mesh(upperGeo, bodyMat);
        upper.rotation.z = isRight ? -1.0 : 1.0;
        upper.rotation.x = 0.5;
        upper.position.set(isRight ? r*0.7 : -r*0.7, -r*0.2, 0);
        upper.castShadow = true;
        arm.add(upper);
        
        // Elbow 
        const lowerGeo = new THREE.CylinderGeometry(r*0.2, r*0.12, r*2.0, 10);
        lowerGeo.translate(0, -r*1.0, 0);
        const lower = new THREE.Mesh(lowerGeo, bodyMat);
        lower.position.set(isRight ? r*1.6 : -r*1.6, -r*1.3, r*0.8);
        lower.rotation.x = -0.6;
        lower.rotation.z = isRight ? -0.2 : 0.2;
        lower.castShadow = true;
        
        // Fur tufts at the elbow
        const furGroup = new THREE.Group();
        const furGeo = new THREE.ConeGeometry(0.06, 0.6, 5);
        furGeo.translate(0, 0.3, 0);
        for(let f=0; f<6; f++) {
            const fur = new THREE.Mesh(furGeo, bodyMat);
            fur.rotation.x = Math.random()*2;
            fur.rotation.z = Math.random()*2;
            fur.rotation.y = Math.random()*2;
            furGroup.add(fur);
        }
        furGroup.position.set(0, r*0.5, 0); // near elbow joint
        lower.add(furGroup);
        
        arm.add(lower);
        
        // Hand
        const hand = new THREE.Mesh(new THREE.SphereGeometry(r*0.25, 12, 12), bodyMat);
        hand.position.set(isRight ? r*2.0 : -r*2.0, -r*2.9, r*1.7);
        hand.castShadow = true;
        
        // Claws
        const clawGeo = new THREE.ConeGeometry(0.06, 0.7, 6);
        clawGeo.translate(0, 0.35, 0);
        for(let c=0; c<3; c++) {
          const claw = new THREE.Mesh(clawGeo, clawMat);
          claw.rotation.x = -1.2;
          claw.rotation.y = (c - 1) * 0.45;
          claw.position.set((c-1)*0.2, 0, -0.25);
          claw.castShadow = true;
          hand.add(claw);
        }
        // Thumb claw
        const thumb = new THREE.Mesh(clawGeo, clawMat);
        thumb.rotation.x = -0.2;
        thumb.rotation.z = isRight ? 1.2 : -1.2;
        thumb.position.set(isRight ? -0.25 : 0.25, 0, 0);
        thumb.castShadow = true;
        hand.add(thumb);
        
        arm.add(hand);
        return arm;
      };
      
      segGroup.add(buildArm(true), buildArm(false));
    }
    
    // Tail Tuft
    if (i === N - 2) {
        const tuftGroup = new THREE.Group();
        const tuftGeo = new THREE.ConeGeometry(0.12, 1.8, 5);
        tuftGeo.translate(0, 0.9, 0);
        for(let j=0; j<8; j++) {
            const tuft = new THREE.Mesh(tuftGeo, bodyMat);
            tuft.rotation.x = 1.2 + Math.random()*0.8;
            tuft.rotation.z = (Math.random() - 0.5) * 1.8;
            tuft.rotation.y = (Math.random() - 0.5) * 1.8;
            tuft.castShadow = true;
            tuftGroup.add(tuft);
        }
        segGroup.add(tuftGroup);
    }

    dragonGroup.add(segGroup);
    segments.push({ mesh: segGroup, t, r });
  }

  // ---- ULTRA-DETAILED SHENRON HEAD ----
  const headGroup = new THREE.Group();
  
  // Skull Base
  const skullGeo = new THREE.BoxGeometry(1.6, 1.4, 1.8);
  const skull = new THREE.Mesh(skullGeo, bodyMat);
  skull.position.set(0, 0.3, 0.2); 
  skull.castShadow = true;
  headGroup.add(skull);

  // Snout 
  const snoutGeo = new THREE.BoxGeometry(1.1, 0.8, 2.4); 
  const snout = new THREE.Mesh(snoutGeo, bodyMat);
  snout.position.set(0, -0.1, -1.6); 
  snout.castShadow = true;
  headGroup.add(snout);
  
  // Upper Lip / Nose Ridge
  const upperLipGeo = new THREE.BoxGeometry(1.2, 0.35, 2.5);
  const upperLip = new THREE.Mesh(upperLipGeo, bodyMat);
  upperLip.position.set(0, -0.4, -1.65);
  upperLip.castShadow = true;
  headGroup.add(upperLip);
  
  const noseGeo = new THREE.BoxGeometry(0.8, 0.45, 0.8);
  const nose = new THREE.Mesh(noseGeo, bodyMat);
  nose.position.set(0, 0.35, -2.4);
  nose.castShadow = true;
  headGroup.add(nose);

  // Nostrils (Dark pits)
  const nostrilGeo = new THREE.SphereGeometry(0.12, 12, 12);
  const nostrilMat = new THREE.MeshBasicMaterial({color: 0x000000});
  const nostrilR = new THREE.Mesh(nostrilGeo, nostrilMat);
  nostrilR.position.set(0.28, 0.45, -2.75);
  nostrilR.scale.set(1, 0.5, 1);
  const nostrilL = nostrilR.clone();
  nostrilL.position.set(-0.28, 0.45, -2.75);
  headGroup.add(nostrilR, nostrilL);

  // Eyebrow Ridges 
  const browGeo = new THREE.ConeGeometry(0.35, 1.8, 5);
  browGeo.rotateX(-Math.PI/2);
  
  const browR = new THREE.Mesh(browGeo, bodyMat);
  browR.position.set(0.65, 0.9, -0.8);
  browR.rotation.y = 0.35;
  browR.rotation.x = 0.5;
  browR.castShadow = true;
  
  const browL = browR.clone();
  browL.position.set(-0.65, 0.9, -0.8);
  browL.rotation.y = -0.35;
  headGroup.add(browR, browL);

  // Glowing Red Eyes 
  const eyeR = new THREE.Group();
  eyeR.position.set(0.7, 0.45, -1.1);
  eyeR.rotation.y = -0.35;
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 24), redMat);
  sclera.scale.set(1, 0.5, 1.6);
  eyeR.add(sclera);
  
  const eyeL = eyeR.clone();
  eyeL.position.set(-0.7, 0.45, -1.1);
  eyeL.rotation.y = 0.35;
  headGroup.add(eyeR, eyeL);

  // Lower Jaw & Teeth
  const jawGeo = new THREE.BoxGeometry(1.0, 0.5, 2.4);
  const jawOuter = new THREE.Mesh(jawGeo, bellyMat); 
  jawOuter.position.set(0, -0.75, -1.45);
  jawOuter.rotation.x = 0.25; 
  jawOuter.castShadow = true;
  headGroup.add(jawOuter);

  // Goatee (Chin hair)
  const goateeGroup = new THREE.Group();
  const goateeGeo = new THREE.ConeGeometry(0.08, 0.9, 5);
  goateeGeo.translate(0, 0.45, 0);
  for(let i=0; i<6; i++) {
      const g = new THREE.Mesh(goateeGeo, bodyMat);
      g.rotation.x = -1.0 + Math.random()*0.5;
      g.rotation.z = (Math.random()-0.5)*0.6;
      g.position.set((Math.random()-0.5)*0.3, -0.2, -1.0);
      goateeGroup.add(g);
  }
  jawOuter.add(goateeGroup);

  // Denser Teeth
  const toothGeo = new THREE.ConeGeometry(0.05, 0.4, 5);
  toothGeo.translate(0, 0.2, 0);
  for(let i=0; i<9; i++) {
    const zPos = -1.0 - i*0.22;
    
    const tR = new THREE.Mesh(toothGeo, clawMat);
    tR.position.set(0.45 - i*0.015, 0.2, zPos + 2.1);
    tR.rotation.z = -0.15;
    const tL = new THREE.Mesh(toothGeo, clawMat);
    tL.position.set(-0.45 + i*0.015, 0.2, zPos + 2.1);
    tL.rotation.z = 0.15;
    jawOuter.add(tR, tL);
    
    const utR = new THREE.Mesh(toothGeo, clawMat);
    utR.rotation.x = Math.PI;
    utR.position.set(0.55 - i*0.02, -0.25, zPos - 0.2);
    const utL = new THREE.Mesh(toothGeo, clawMat);
    utL.rotation.x = Math.PI;
    utL.position.set(-0.55 + i*0.02, -0.25, zPos - 0.2);
    headGroup.add(utR, utL);
  }

  // Massive Antler Horns
  const buildAntler = () => {
      const antler = new THREE.Group();
      
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 3.8, 8), hornMat);
      trunk.position.set(0, 1.9, 0);
      trunk.castShadow = true;
      antler.add(trunk);
      
      const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.8, 7), hornMat);
      b1.position.set(0.45, 1.2, 0);
      b1.rotation.z = -0.7;
      b1.castShadow = true;
      antler.add(b1);
      
      const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.4, 7), hornMat);
      b2.position.set(-0.4, 2.2, 0);
      b2.rotation.z = 0.6;
      b2.castShadow = true;
      antler.add(b2);
      
      const b3 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 1.1, 7), hornMat);
      b3.position.set(0.3, 3.0, 0);
      b3.rotation.z = -0.4;
      b3.castShadow = true;
      antler.add(b3);
      
      return antler;
  };
  
  const antlerR = buildAntler();
  antlerR.position.set(0.7, 0.7, 0.5);
  antlerR.rotation.x = -0.5;
  antlerR.rotation.z = -0.25;
  
  const antlerL = buildAntler();
  antlerL.scale.set(-1, 1, 1);
  antlerL.position.set(-0.7, 0.7, 0.5);
  antlerL.rotation.x = -0.5;
  antlerL.rotation.z = 0.25;
  
  headGroup.add(antlerR, antlerL);

  // Extremely Fluffy Mane
  const maneGroup = new THREE.Group();
  const hairGeo = new THREE.ConeGeometry(0.2, 1.8, 6);
  hairGeo.translate(0, 0.9, 0);
  
  for(let i=0; i<50; i++) {
     const hair = new THREE.Mesh(hairGeo, bodyMat);
     const angle = (i / 50) * Math.PI * 2;
     if (angle > Math.PI * 0.1 && angle < Math.PI * 1.9) {
         hair.position.set(Math.cos(angle)*1.1, Math.sin(angle)*1.1, 0.8);
         hair.lookAt(Math.cos(angle)*4, Math.sin(angle)*4, 2.5);
         hair.rotation.x += Math.PI/2; 
         hair.scale.y = 0.8 + Math.random()*0.6;
         hair.rotation.z += (Math.random()-0.5)*0.5;
         hair.castShadow = true;
         maneGroup.add(hair);
     }
  }
  headGroup.add(maneGroup);

  attachmentR = new THREE.Object3D();
  attachmentR.position.set(0.65, -0.3, -2.8); 
  headGroup.add(attachmentR);
  
  attachmentL = new THREE.Object3D();
  attachmentL.position.set(-0.65, -0.3, -2.8);
  headGroup.add(attachmentL);

  segments[0].mesh.add(headGroup);
}

function buildAura() {
  const count = 800;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  auraData = [];
  
  const colorA = new THREE.Color('#FF5500'); 
  const colorB = new THREE.Color('#FFCC00'); 
  const colorC = new THREE.Color('#FFFFDD'); 

  for (let i = 0; i < count; i++) {
    const t = Math.random();
    const angle = Math.random() * Math.PI * 2;
    const radiusOffset = 1.0 + Math.random() * 2.0;
    auraData.push({ t, angle, radiusOffset, speed: 0.5 + Math.random() * 1.0 });
    positions[i * 3] = 0; positions[i * 3 + 1] = 0; positions[i * 3 + 2] = 0;
    const c = colorA.clone().lerp(colorB, Math.random()).lerp(colorC, Math.random() * 0.5);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.28, vertexColors: true, transparent: true, opacity: 0.75,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  auraPoints = new THREE.Points(geo, mat);
  scene.add(auraPoints);
}

function buildTendrils() {
  const whiskerMat = new THREE.MeshStandardMaterial({ color: 0x074a16, roughness: 0.5 }); 
  
  const numSegs = 90; // Extremely long, majestic whiskers
  for(let i=0; i<numSegs; i++) {
    const r1 = Math.max(0.005, 0.08 - (i/numSegs)*0.075);
    const r2 = Math.max(0.005, 0.08 - ((i+1)/numSegs)*0.075);
    const geo = new THREE.CylinderGeometry(r1, r2, 1.4, 8);
    geo.rotateX(Math.PI/2);
    geo.translate(0, 0, 0.7); 
    
    const meshR = new THREE.Mesh(geo, whiskerMat);
    meshR.castShadow = true;
    scene.add(meshR);
    tendrilR.push(meshR);
    
    const meshL = meshR.clone();
    meshL.castShadow = true;
    scene.add(meshL);
    tendrilL.push(meshL);
  }
}

const _pos = new THREE.Vector3();
const _tan = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _lookTarget = new THREE.Vector3();

function updateDragon(time) {
  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    spinePoint(s.t, time, _pos);
    spineTangent(s.t, time, _tan);
    s.mesh.position.copy(_pos);
    _lookTarget.copy(_pos).add(_tan);
    s.mesh.lookAt(_lookTarget);
    // Deep breathing / pulsing effect
    s.mesh.scale.setScalar(1 + Math.sin(time * 2.5 + s.t * 20) * 0.02);
  }

  // --- UPDATE WHISKERS (Flowing majestically) ---
  segments[0].mesh.updateMatrixWorld(true);
  
  const snoutPosR = new THREE.Vector3();
  const snoutPosL = new THREE.Vector3();
  if (attachmentR && attachmentL) {
    attachmentR.getWorldPosition(snoutPosR);
    attachmentL.getWorldPosition(snoutPosL);
  }
  
  const _base0R = new THREE.Vector3();
  const _base0L = new THREE.Vector3();
  
  spinePoint(0, time, _base0R);
  _base0R.x += Math.sin(time * 1.5) * 3.0 + 1.5;
  _base0R.y += Math.cos(time * 1.0) * 2.5 - 2.5;
  _base0R.z += 4.0;
  
  spinePoint(0, time, _base0L);
  _base0L.x += Math.sin(time * 1.5) * 3.0 - 1.5;
  _base0L.y += Math.cos(time * 1.0) * 2.5 - 2.5;
  _base0L.z += 4.0;
  
  const diffR = new THREE.Vector3().subVectors(snoutPosR, _base0R);
  const diffL = new THREE.Vector3().subVectors(snoutPosL, _base0L);
  
  function getTendrilPos(t, side, diff, out) {
    spinePoint(t, time, out);
    const spread = 4.0 + t * 8.0;
    out.x += Math.sin(time * 1.5 - t * 12) * spread * 0.6 + side * 2.0;
    out.y += Math.cos(time * 1.0 - t * 10) * spread * 0.6 - t * 7.0;
    out.z += spread * 1.0;
    const fade = Math.pow(1 - t, 3.5);
    out.addScaledVector(diff, fade);
    return out;
  }
  
  const _tR = new THREE.Vector3();
  const _tL = new THREE.Vector3();
  
  const num = tendrilR.length;
  for(let i=0; i<num; i++) {
    const t1 = i / num;
    const t2 = (i + 1) / num;
    
    getTendrilPos(t1, 1, diffR, _pos);
    getTendrilPos(t2, 1, diffR, _tR);
    tendrilR[i].position.copy(_pos);
    tendrilR[i].lookAt(_tR);
    tendrilR[i].scale.z = _pos.distanceTo(_tR) / 1.4; 
    
    getTendrilPos(t1, -1, diffL, _pos);
    getTendrilPos(t2, -1, diffL, _tL);
    tendrilL[i].position.copy(_pos);
    tendrilL[i].lookAt(_tL);
    tendrilL[i].scale.z = _pos.distanceTo(_tL) / 1.4;
  }
}

function updateAura(time, delta) {
  const posAttr = auraPoints.geometry.attributes.position;
  const boostTarget = castActive ? 1 : 0;
  castBoost += (boostTarget - castBoost) * Math.min(1, delta * 3.0);
  
  if (castActive) {
    castTimer += delta;
    if (castTimer > 4.5) castActive = false;
    
    // Lightning flashes during summoning
    if (Math.random() > 0.93) {
        lightningFlash = 1.0;
    }
  }

  for (let i = 0; i < auraData.length; i++) {
    const d = auraData[i];
    spinePoint(d.t, time, _pos);
    const swirl = d.angle + time * d.speed * (1 + castBoost * 3.0);
    const r = (d.radiusOffset + castBoost * 2.5) * (1 + Math.sin(time * 2.5 + d.t * 8) * 0.2);
    posAttr.array[i * 3]     = _pos.x + Math.cos(swirl) * r;
    posAttr.array[i * 3 + 1] = _pos.y + Math.sin(swirl * 1.8) * r * 0.6;
    posAttr.array[i * 3 + 2] = _pos.z + Math.sin(swirl) * r;
  }
  posAttr.needsUpdate = true;
  auraPoints.material.size = 0.28 + castBoost * 0.4;
  auraPoints.material.opacity = 0.75 + castBoost * 0.25;
  
  dbGroup.children.forEach((db, i) => {
     db.position.y = -6.5 + Math.sin(time * 2 + i) * 0.6;
     db.material.emissiveIntensity = 1.2 + Math.sin(time * 5 + i) * 0.5 + castBoost * 3.5;
  });
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  const targetPos = new THREE.Vector3();
  targetPos.x = mouse.x * 20;
  targetPos.y = mouse.y * 14 + 3;
  
  // Immense sweeping loops for the massive body
  const orbitSpeed = 0.6;
  targetPos.x += Math.sin(time * orbitSpeed) * 8.0 + Math.sin(time * orbitSpeed * 0.4) * 6.0;
  targetPos.y += Math.cos(time * orbitSpeed * 1.1) * 7.0;
  targetPos.z = Math.sin(time * orbitSpeed * 0.7) * 10.0;
  
  spinePoints[0].lerp(targetPos, delta * 3.0); // Slightly slower, more massive movement
  
  for(let i = 1; i < N; i++) {
    const prev = spinePoints[i-1];
    const curr = spinePoints[i];
    const dir = new THREE.Vector3().subVectors(prev, curr);
    const dist = dir.length();
    if (dist > 0) {
      dir.normalize();
      curr.copy(prev).sub(dir.multiplyScalar(SEGMENT_SPACING)); 
    }
  }

  updateDragon(time);
  updateAura(time, delta);
  
  // Lightning Background Flashes
  lightningFlash = Math.max(0, lightningFlash - delta * 3.5);
  const bgVal = 0.004 + lightningFlash * 0.6;
  scene.background.setRGB(bgVal, bgVal + lightningFlash * 0.15, bgVal + lightningFlash * 0.05);
  scene.fog.color.copy(scene.background);

  camera.position.x += (mouse.x * 10 - camera.position.x) * 0.05;
  camera.position.y += (mouse.y * 6 + 6 - camera.position.y) * 0.05;
  camera.position.z += (32 - camera.position.z) * 0.05;
  camera.lookAt(0, 4, 0);

  composer.render();
}

init();
animate();
</script>
