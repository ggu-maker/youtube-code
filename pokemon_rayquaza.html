<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpent of the Emerald Current - Perfect 3D Rayquaza</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#03050a; font-family: 'Segoe UI', system-ui, sans-serif; }
  #info {
    position:absolute; top:18px; left:18px; color:#bfe9cf; font-size:12px;
    letter-spacing:.12em; text-transform:uppercase; opacity:.55; pointer-events:none;
  }
  #hint {
    position:absolute; top:40px; left:18px; color:#8fb; font-size:11px;
    letter-spacing:.05em; opacity:.35; pointer-events:none;
  }
  #castBtn {
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    padding:12px 26px; background:rgba(15,25,20,.55); border:1px solid #4f9c76;
    color:#c9ffe0; border-radius:26px; cursor:pointer; font-size:12px;
    letter-spacing:.14em; text-transform:uppercase; backdrop-filter:blur(6px);
    transition:all .25s ease;
  }
  #castBtn:hover { background:rgba(60,120,90,.55); box-shadow:0 0 18px rgba(140,255,190,.35); }
  #castBtn:active { transform:translateX(-50%) scale(.96); }
</style>
</head>
<body>
<div id="info">Legendary pokemon rayquaza </div>
<div id="hint">Earth protecter</div>
<button id="castBtn">Channel Aura Surge</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
let scene, camera, renderer, clock, composer;
let dragonGroup, segments = [];
let auraPoints, auraData;
let castActive = false, castTimer = 0, castBoost = 0;
let tendrilR = [], tendrilL = [];
let attachmentR, attachmentL;
let spinePoints = [];
let mouse = new THREE.Vector2(0, 0);

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
  }
}, {passive: true});

const N = 40;

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03050a, 0.032);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 14);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Setup Post-Processing Bloom
  const renderScene = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
  bloomPass.threshold = 0.65; // High threshold: only very bright materials glow
  bloomPass.strength = 3.0; // Extremely intense glowing aura
  bloomPass.radius = 0.8; // Wide, soft light bleed
  
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  scene.add(new THREE.AmbientLight(0x2a3a30, 0.9));
  const key = new THREE.DirectionalLight(0xffe9c2, 1.1);
  key.position.set(5, 8, 6);
  scene.add(key);
  const rim = new THREE.PointLight(0x5fffb0, 1.6, 34);
  rim.position.set(-4, -2, 4);
  scene.add(rim);

  addStarfield();

  dragonGroup = new THREE.Group();
  scene.add(dragonGroup);
  
  for(let i=0; i<N; i++) {
    spinePoints.push(new THREE.Vector3(0, 0, -i * 0.42)); // Initialize straight back
  }
  
  buildDragon();
  buildTendrils();
  buildAura();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  document.getElementById('castBtn').addEventListener('click', () => {
    castActive = true;
    castTimer = 0;
  });
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function addStarfield() {
  const geo = new THREE.BufferGeometry();
  const count = 900;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * 90;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 90;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 90;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xbfd8ff, size: 0.06, transparent: true, opacity: 0.7 });
  scene.add(new THREE.Points(geo, mat));
}

function spinePoint(t, time, out) {
  const idx = t * (N - 1);
  const i = Math.floor(idx);
  const f = idx - i;
  if (i >= N - 1) return out.copy(spinePoints[N - 1]);
  if (i < 0) return out.copy(spinePoints[0]);
  
  out.copy(spinePoints[i]).lerp(spinePoints[i+1], f);
  return out;
}

const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
function spineTangent(t, time, out) {
  const eps = 0.05; // Large epsilon perfectly smooths the tangents across piecewise IK joints
  spinePoint(Math.min(t + eps, 1), time, _p1);
  spinePoint(Math.max(t - eps, 0), time, _p2);
  out.copy(_p1).sub(_p2).normalize();
  return out;
}

function radiusAt(t) {
  if (t < 0.06) return 0.5 + t * 3.2;
  const body = 0.95 * Math.pow(1 - t, 0.55);
  return Math.max(0.9 * (1 - t) * (1 - t) + 0.08, body * 0.75 + 0.15);
}

function buildDragon() {
  // Flat shading gives it a crisp, defined, anime-like 3D look
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x118c4f, roughness: 0.6, metalness: 0.1, flatShading: true });
  const bellyMat = new THREE.MeshStandardMaterial({ color: 0x1f2421, roughness: 0.7, metalness: 0.1, flatShading: true });
  const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.9, emissive: 0x332200 }); // Shiny Gold
  const redMat = new THREE.MeshStandardMaterial({ color: 0xff1e3a, roughness: 0.5, metalness: 0.1 });
  const clawMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.5 });

  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const r = radiusAt(t);
    const segGroup = new THREE.Group();
    
    // Main Body Segment
    const geo = new THREE.CylinderGeometry(r, r * 0.95, 1.2, 16);
    geo.rotateX(-Math.PI / 2); // align with Z axis
    const mesh = new THREE.Mesh(geo, bodyMat);
    segGroup.add(mesh);
    
    // Belly Segment
    const bellyGeo = new THREE.CylinderGeometry(r * 0.9, r * 0.85, 1.25, 12, 1, false, Math.PI/2, Math.PI);
    bellyGeo.rotateX(-Math.PI/2);
    bellyGeo.rotateZ(-Math.PI/2);
    const belly = new THREE.Mesh(bellyGeo, bellyMat);
    belly.position.y = -r * 0.05;
    segGroup.add(belly);

    // Shiny Gold Treads (running along the whole body perfectly segmented)
    if (i > 2 && i < N - 2) {
      const lineGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.25, 8);
      lineGeo.rotateX(Math.PI/2);
      const lineR = new THREE.Mesh(lineGeo, yellowMat);
      lineR.position.set(r*0.96, 0, 0);
      const lineL = new THREE.Mesh(lineGeo, yellowMat);
      lineL.position.set(-r*0.96, 0, 0);
      segGroup.add(lineR, lineL);
    }

    // Yellow Ring Pattern (on the sides of the body)
    if (i > 3 && i < N - 4 && i % 4 === 0) {
      const ringGeo = new THREE.TorusGeometry(r * 0.45, 0.06, 8, 24);
      ringGeo.rotateY(Math.PI/2); // Place flat on the side
      
      const ringR = new THREE.Mesh(ringGeo, yellowMat);
      ringR.position.set(r * 0.95, 0, 0);
      
      const ringL = new THREE.Mesh(ringGeo, yellowMat);
      ringL.position.set(-r * 0.95, 0, 0);
      
      segGroup.add(ringR, ringL);
    }

    // Aerodynamic Blocky Side Fins
    if (i > 5 && i < N - 8 && i % 7 === 0) {
      const finGeo = new THREE.BoxGeometry(r*2.5, 0.15, r*1.8);
      // Shift pivot to base
      finGeo.translate(r*1.25, 0, 0); 
      
      const finR = new THREE.Mesh(finGeo, bodyMat);
      finR.position.set(r*0.8, 0, 0);
      finR.rotation.y = -0.3; // Sweep back
      finR.rotation.z = 0.1; // Tilt slightly up
      
      const edgeGeo = new THREE.BoxGeometry(0.2, 0.2, r*1.8);
      const edge = new THREE.Mesh(edgeGeo, redMat);
      edge.position.set(r*2.4, 0, 0);
      finR.add(edge);

      const finL = finR.clone();
      finL.position.set(-r*0.8, 0, 0);
      finL.rotation.y = 0.3;
      finL.rotation.z = -0.1;
      finL.scale.set(-1, 1, 1);
      
      segGroup.add(finR, finL);
    }

    // Arms
    if (i === 3) {
      const buildArm = () => {
        const arm = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 1.5, 8), bodyMat);
        upper.rotation.z = -1.8;
        upper.position.set(r*0.8, -0.2, 0);
        arm.add(upper);
        
        const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.4, 8), bodyMat);
        lower.position.set(r*1.4, -0.6, -0.6);
        lower.rotation.x = -0.8;
        lower.rotation.z = -1.0;
        arm.add(lower);
        
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), bodyMat);
        hand.position.set(r*1.6, -1.0, -1.1);
        
        const clawGeo = new THREE.ConeGeometry(0.08, 0.5, 4);
        clawGeo.translate(0, 0.25, 0);
        for(let c=0; c<3; c++) {
          const claw = new THREE.Mesh(clawGeo, clawMat);
          claw.rotation.x = -1.2;
          claw.rotation.y = (c - 1) * 0.5;
          claw.position.set((c-1)*0.15, 0, -0.15);
          hand.add(claw);
        }
        arm.add(hand);
        return arm;
      };
      
      const armR = buildArm();
      const armL = buildArm();
      armL.scale.set(-1, 1, 1);
      segGroup.add(armR, armL);
    }

    // Tail Fins
    if (i === N - 2) {
      const tGeo = new THREE.BoxGeometry(r*3.0, 0.1, r*1.5);
      tGeo.translate(r*1.5, 0, 0);
      
      const tailFinR = new THREE.Mesh(tGeo, bodyMat);
      tailFinR.position.set(r*0.5, 0, r);
      tailFinR.rotation.y = -0.8; // Sweep back severely
      
      const tEdge = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, r*1.5), redMat);
      tEdge.position.set(r*2.9, 0, 0);
      tailFinR.add(tEdge);
      
      const tailFinL = tailFinR.clone();
      tailFinL.position.set(-r*0.5, 0, r);
      tailFinL.rotation.y = 0.8;
      tailFinL.scale.set(-1, 1, 1);
      
      segGroup.add(tailFinR, tailFinL);
    }

    dragonGroup.add(segGroup);
    segments.push({ mesh: segGroup, t, r });
  }

  // ---- PERFECT REALISTIC HEAD ----
  const headGroup = new THREE.Group();
  
  // 1. Skull Base
  const skullGeo = new THREE.CylinderGeometry(0.7, 1.1, 1.8, 12);
  skullGeo.rotateX(-Math.PI/2);
  const skull = new THREE.Mesh(skullGeo, bodyMat);
  skull.position.set(0, 0.3, 0.2); 
  headGroup.add(skull);

  // 2. Sharper Diamond Snout
  const snoutGeo = new THREE.CylinderGeometry(0.2, 0.9, 2.4, 4); 
  snoutGeo.rotateY(Math.PI/4); 
  snoutGeo.scale(1, 0.55, 1); // flatter and sharper
  snoutGeo.rotateX(-Math.PI/2);
  const snout = new THREE.Mesh(snoutGeo, bodyMat);
  snout.position.set(0, 0.1, -1.7); 
  headGroup.add(snout);

  // Eyebrow Ridges (Fierce look)
  const browGeo = new THREE.CylinderGeometry(0.1, 0.2, 1.2, 4);
  browGeo.rotateX(-Math.PI/2);
  const browR = new THREE.Mesh(browGeo, bodyMat);
  browR.position.set(0.55, 0.6, -1.0);
  browR.rotation.y = 0.3;
  browR.rotation.x = 0.2;
  const browL = browR.clone();
  browL.position.set(-0.55, 0.6, -1.0);
  browL.rotation.y = -0.3;
  headGroup.add(browR, browL);

  // Black Eye Trails
  const trailGeo = new THREE.ConeGeometry(0.15, 0.8, 4);
  trailGeo.rotateY(Math.PI/4);
  trailGeo.rotateX(-Math.PI/2);
  const trailR = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({color: 0x000000}));
  trailR.position.set(0.65, 0.42, -0.7);
  trailR.rotation.y = 0.2;
  const trailL = trailR.clone();
  trailL.position.set(-0.65, 0.42, -0.7);
  trailL.rotation.y = -0.2;
  headGroup.add(trailR, trailL);

  // 3. Shiny Gold Crown (Oval on forehead)
  const crownGeo = new THREE.TorusGeometry(0.35, 0.05, 6, 24);
  crownGeo.rotateX(Math.PI/2);
  crownGeo.scale(1, 1, 1.8);
  const crown = new THREE.Mesh(crownGeo, yellowMat);
  crown.position.set(0, 0.85, -0.6);
  headGroup.add(crown);

  // 4. Fierce Eyes 
  const eyeR = new THREE.Group();
  eyeR.position.set(0.65, 0.4, -1.2);
  eyeR.rotation.y = -0.3; // Angle out
  eyeR.rotation.z = -0.1;
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshBasicMaterial({color: 0x000000}));
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), yellowMat);
  iris.position.set(0.12, 0, 0.08);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), redMat);
  pupil.position.set(0.18, 0, 0.12);
  eyeR.add(sclera, iris, pupil);
  
  const eyeL = eyeR.clone();
  eyeL.position.set(-0.65, 0.4, -1.2);
  eyeL.rotation.y = 0.3;
  eyeL.rotation.z = 0.1;
  headGroup.add(eyeR, eyeL);

  // 5. Articulated Lower Jaw (Diamond shape!)
  const jawGeo = new THREE.CylinderGeometry(0.2, 0.8, 2.0, 4);
  jawGeo.rotateY(Math.PI/4);
  jawGeo.scale(1, 0.5, 1);
  jawGeo.rotateX(-Math.PI/2); // Point forward
  const jaw = new THREE.Mesh(jawGeo, bellyMat); // Darker inside
  jaw.position.set(0, -0.2, -1.5);
  jaw.rotation.x = 0.3; // Roaring (positive X rotation opens down when pointing -Z)
  
  const jawOuter = new THREE.Mesh(jawGeo, bodyMat);
  jawOuter.scale.set(1.1, 0.8, 1.05);
  jawOuter.position.y = -0.05;
  jaw.add(jawOuter); // Green outside, dark inside

  // Teeth
  const toothGeo = new THREE.ConeGeometry(0.06, 0.3, 4);
  toothGeo.translate(0, 0.15, 0);
  for(let i=0; i<4; i++) {
    const zPos = -0.8 + i*0.4;
    // Lower
    const tR = new THREE.Mesh(toothGeo, clawMat);
    tR.position.set(0.4 - i*0.06, 0.1, zPos);
    tR.rotation.z = -0.2;
    const tL = new THREE.Mesh(toothGeo, clawMat);
    tL.position.set(-0.4 + i*0.06, 0.1, zPos);
    tL.rotation.z = 0.2;
    jaw.add(tR, tL);
    
    // Upper
    const utR = new THREE.Mesh(toothGeo, clawMat);
    utR.rotation.x = Math.PI;
    utR.rotation.z = 0.2;
    utR.position.set(0.45 - i*0.06, -0.25, zPos - 1.2);
    const utL = new THREE.Mesh(toothGeo, clawMat);
    utL.rotation.x = Math.PI;
    utL.rotation.z = -0.2;
    utL.position.set(-0.45 + i*0.06, -0.25, zPos - 1.2);
    headGroup.add(utR, utL);
  }
  headGroup.add(jaw);

  // 6. Swept-Back Upper Horns (Pure Green, 4-sided sharp)
  const hornGeo = new THREE.ConeGeometry(0.3, 3.5, 4); 
  hornGeo.rotateY(Math.PI/4); // Diamond cross section
  hornGeo.scale(1, 1, 0.2); // Flatten
  hornGeo.rotateX(Math.PI/2); // Point backward (+Z)
  
  const hornR = new THREE.Mesh(hornGeo, bodyMat);
  hornR.position.set(0.6, 0.8, 1.0);
  hornR.rotation.y = 0.4; // Sweep outwards
  hornR.rotation.x = -0.2; // Point slightly up
  
  const hornL = new THREE.Mesh(hornGeo, bodyMat);
  hornL.position.set(-0.6, 0.8, 1.0);
  hornL.rotation.y = -0.4;
  hornL.rotation.x = -0.2;
  
  headGroup.add(hornR, hornL);

  // 7. Lower Mandible Horns (Pure Green)
  const manGeo = new THREE.ConeGeometry(0.25, 2.0, 4);
  manGeo.rotateY(Math.PI/4);
  manGeo.scale(1, 1, 0.2);
  manGeo.rotateX(Math.PI/2); // Point backward (+Z)
  
  const manR = new THREE.Mesh(manGeo, bodyMat);
  manR.position.set(0.6, -0.4, 0.8);
  manR.rotation.y = 0.3;
  manR.rotation.x = 0.2; // Point slightly down
  
  attachmentR = new THREE.Object3D();
  attachmentR.position.set(0, 0, 1.0); // Tip of the horn
  manR.add(attachmentR);
  
  const manL = new THREE.Mesh(manGeo, bodyMat);
  manL.position.set(-0.6, -0.4, 0.8);
  manL.rotation.y = -0.3;
  manL.rotation.x = 0.2;
  
  attachmentL = new THREE.Object3D();
  attachmentL.position.set(0, 0, 1.0);
  manL.add(attachmentL);
  
  headGroup.add(manR, manL);

  // Attach the complete head to the first body segment
  segments[0].mesh.add(headGroup);
}

function buildAura() {
  const count = 420;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  auraData = [];
  const colorA = new THREE.Color('#7CFFB2');
  const colorB = new THREE.Color('#FFD36E');
  const colorC = new THREE.Color('#9B7CFF');

  for (let i = 0; i < count; i++) {
    const t = Math.random();
    const angle = Math.random() * Math.PI * 2;
    const radiusOffset = 0.6 + Math.random() * 0.5;
    auraData.push({ t, angle, radiusOffset, speed: 0.6 + Math.random() * 0.8 });
    positions[i * 3] = 0; positions[i * 3 + 1] = 0; positions[i * 3 + 2] = 0;
    const c = colorA.clone().lerp(colorB, Math.random()).lerp(colorC, Math.random() * 0.25);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.14, vertexColors: true, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  auraPoints = new THREE.Points(geo, mat);
  scene.add(auraPoints);
}

function buildTendrils() {
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffd500 }); // Extremely bright golden yellow
  
  const numSegs = 40;
  for(let i=0; i<numSegs; i++) {
    const r1 = Math.max(0.01, 0.12 - (i/numSegs)*0.11);
    const r2 = Math.max(0.01, 0.12 - ((i+1)/numSegs)*0.11);
    const geo = new THREE.CylinderGeometry(r1, r2, 1.0, 6);
    geo.rotateX(Math.PI/2);
    geo.translate(0, 0, 0.5); // Pivot at the base
    
    const meshR = new THREE.Mesh(geo, glowMat);
    if (i > 8 && i % 10 === 0 && i < 35) {
       const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.06, 6, 16), glowMat);
       ring.position.set(0, 0, 0.5); 
       meshR.add(ring);
    }
    scene.add(meshR);
    tendrilR.push(meshR);
    
    const meshL = meshR.clone();
    scene.add(meshL);
    tendrilL.push(meshL);
  }
}

const _pos = new THREE.Vector3();
const _tan = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _lookTarget = new THREE.Vector3();

function updateDragon(time) {
  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    spinePoint(s.t, time, _pos);
    spineTangent(s.t, time, _tan);
    s.mesh.position.copy(_pos);
    _lookTarget.copy(_pos).add(_tan);
    s.mesh.lookAt(_lookTarget);
    s.mesh.scale.setScalar(1 + Math.sin(time * 3 + s.t * 10) * 0.03);
  }

  // --- UPDATE GOLD TENDRILS ---
  segments[0].mesh.updateMatrixWorld(true);
  
  const jawPosR = new THREE.Vector3();
  const jawPosL = new THREE.Vector3();
  if (attachmentR && attachmentL) {
    attachmentR.getWorldPosition(jawPosR);
    attachmentL.getWorldPosition(jawPosL);
  }
  
  const _base0R = new THREE.Vector3();
  const _base0L = new THREE.Vector3();
  
  spinePoint(0, time, _base0R);
  _base0R.x += Math.sin(time * 2.5) * 1.5 * 0.4;
  _base0R.y += Math.cos(time * 2.0) * 1.5 * 0.5;
  _base0R.z += 1.5;
  
  spinePoint(0, time, _base0L);
  _base0L.x += Math.sin(time * 2.5) * 1.5 * 0.4;
  _base0L.y += Math.cos(time * 2.0) * 1.5 * 0.5;
  _base0L.z += -1.5;
  
  const diffR = new THREE.Vector3().subVectors(jawPosR, _base0R);
  const diffL = new THREE.Vector3().subVectors(jawPosL, _base0L);
  
  function getTendrilPos(t, side, diff, out) {
    spinePoint(t, time, out);
    const spread = 1.5 + t * 4.0;
    out.x += Math.sin(time * 2.5 - t * 10) * spread * 0.4;
    out.y += Math.cos(time * 2.0 - t * 8) * spread * 0.5 - t * 2.0;
    out.z += side * spread;
    const fade = Math.pow(1 - t, 2.0); // Smooth connection to the jaw
    out.addScaledVector(diff, fade);
    return out;
  }
  
  const _tR = new THREE.Vector3();
  const _tL = new THREE.Vector3();
  
  const num = tendrilR.length;
  for(let i=0; i<num; i++) {
    const t1 = i / num;
    const t2 = (i + 1) / num;
    
    getTendrilPos(t1, 1, diffR, _pos);
    getTendrilPos(t2, 1, diffR, _tR);
    tendrilR[i].position.copy(_pos);
    tendrilR[i].lookAt(_tR);
    tendrilR[i].scale.z = _pos.distanceTo(_tR); // Stretch cylinder seamlessly
    
    getTendrilPos(t1, -1, diffL, _pos);
    getTendrilPos(t2, -1, diffL, _tL);
    tendrilL[i].position.copy(_pos);
    tendrilL[i].lookAt(_tL);
    tendrilL[i].scale.z = _pos.distanceTo(_tL);
  }
}

function updateAura(time, delta) {
  const posAttr = auraPoints.geometry.attributes.position;
  const boostTarget = castActive ? 1 : 0;
  castBoost += (boostTarget - castBoost) * Math.min(1, delta * 2.5);
  if (castActive) {
    castTimer += delta;
    if (castTimer > 2.6) castActive = false;
  }

  for (let i = 0; i < auraData.length; i++) {
    const d = auraData[i];
    spinePoint(d.t, time, _pos);
    const swirl = d.angle + time * d.speed * (1 + castBoost * 1.8);
    const r = (d.radiusOffset + castBoost * 0.5) * (1 + Math.sin(time * 2 + d.t * 6) * 0.08);
    posAttr.array[i * 3]     = _pos.x + Math.cos(swirl) * r;
    posAttr.array[i * 3 + 1] = _pos.y + Math.sin(swirl * 1.3) * r * 0.6;
    posAttr.array[i * 3 + 2] = _pos.z + Math.sin(swirl) * r;
  }
  posAttr.needsUpdate = true;
  auraPoints.material.size = 0.14 + castBoost * 0.08;
  auraPoints.material.opacity = 0.85 + castBoost * 0.15;
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  // --- IK PHYSICS: Cursor Follow & Slither ---
  const targetPos = new THREE.Vector3();
  targetPos.x = mouse.x * 14;
  targetPos.y = mouse.y * 9;
  // Add procedural orbit to target to simulate dragon slithering aggressively
  targetPos.x += Math.sin(time * 3.5) * 2.0;
  targetPos.y += Math.cos(time * 2.5) * 1.5;
  targetPos.z = Math.sin(time * 2.0) * 4.0;
  
  // Head chases target
  spinePoints[0].lerp(targetPos, delta * 5.0);
  
  // Body segments strictly follow the head (Rope IK)
  for(let i = 1; i < N; i++) {
    const prev = spinePoints[i-1];
    const curr = spinePoints[i];
    const dir = new THREE.Vector3().subVectors(prev, curr);
    const dist = dir.length();
    if (dist > 0) {
      dir.normalize();
      curr.copy(prev).sub(dir.multiplyScalar(0.42)); // segment spacing
    }
  }

  updateDragon(time);
  updateAura(time, delta);

  // Dynamic chase camera
  camera.position.x += (mouse.x * 6 - camera.position.x) * 0.05;
  camera.position.y += (mouse.y * 4 + 2 - camera.position.y) * 0.05;
  camera.position.z += (17 - camera.position.z) * 0.05;
  camera.lookAt(0, 0, 0);

  composer.render();
}

init();
animate();
</script>
