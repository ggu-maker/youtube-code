<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Stars</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center, #050505 0%, #000 70%);
  }

  .star-wrap {
    position: absolute;
    transform: translate(-50%, -50%);
    animation: float 4s ease-in-out infinite, pulse 2.6s ease-in-out infinite;
    animation-delay: var(--fdelay), var(--pdelay);
  }

  .star-wrap svg {
    display: block;
    width: var(--size, 90px);
    height: var(--size, 90px);
    overflow: visible;
  }

  .star-pink  { top: 26%; left: 50%; --size: 100px; --glow: #ff2f6e; --fdelay: 0s;  --pdelay: 0s; }
  .star-green { top: 67%; left: 31%; --size: 88px;  --glow: #2fe08f; --fdelay: .4s; --pdelay: .5s; }
  .star-blue  { top: 67%; left: 69%; --size: 88px;  --glow: #3fb6ff; --fdelay: .8s; --pdelay: 1s; }

  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
    50%      { transform: translate(-50%, -50%) translateY(-6px); }
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 8px var(--glow)) drop-shadow(0 0 22px var(--glow)) drop-shadow(0 0 40px var(--glow)) brightness(1); }
    50%      { filter: drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 34px var(--glow)) drop-shadow(0 0 60px var(--glow)) brightness(1.25); }
  }

  /* glint sweep across the crystal */
  .glint {
    animation: glintMove 2.6s linear infinite;
  }
  @keyframes glintMove {
    0%   { opacity: 0; transform: translateX(-40px) translateY(-40px); }
    45%  { opacity: 0; }
    50%  { opacity: .9; }
    55%  { opacity: 0; }
    100% { opacity: 0; transform: translateX(40px) translateY(40px); }
  }

  .sparkle-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    animation: twinkle 1.6s ease-in-out infinite;
    box-shadow: 0 0 4px #fff, 0 0 8px currentColor;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.3); }
    50%      { opacity: 1; transform: scale(1.3); }
  }

  /* four-point cross sparkle flares that flash on top of each star */
  .flare {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    animation: flareFlash 3.2s ease-in-out infinite;
  }
  @keyframes flareFlash {
    0%, 80%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    88%           { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    94%           { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Pink crystal star -->
  <div class="star-wrap star-pink">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="corePink" cx="50%" cy="42%" r="65%">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#ffc2d6"/>
          <stop offset="65%" stop-color="#ff5484"/>
          <stop offset="100%" stop-color="#c8003f"/>
        </radialGradient>
        <linearGradient id="facetPinkL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polygon points="50,4 60,36 93,36 66,56 76,90 50,70 24,90 34,56 7,36 40,36"
               fill="url(#corePink)" stroke="#ff3e73" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- inner facet lines for crystal look -->
      <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.8" fill="none">
        <line x1="50" y1="4" x2="50" y2="70"/>
        <line x1="24" y1="90" x2="66" y2="56"/>
        <line x1="76" y1="90" x2="34" y2="56"/>
        <line x1="7" y1="36" x2="93" y2="36"/>
      </g>
      <polygon class="glint" points="50,4 60,36 93,36 66,56 76,90 50,70 24,90 34,56 7,36 40,36"
               fill="url(#facetPinkL)"/>
    </svg>
  </div>

  <!-- Green crystal star -->
  <div class="star-wrap star-green">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="coreGreen" cx="50%" cy="42%" r="65%">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#bdf7d9"/>
          <stop offset="65%" stop-color="#3fe08f"/>
          <stop offset="100%" stop-color="#0d9a56"/>
        </radialGradient>
        <linearGradient id="facetGreenL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polygon points="50,4 60,36 93,36 66,56 76,90 50,70 24,90 34,56 7,36 40,36"
               fill="url(#coreGreen)" stroke="#2fd47f" stroke-width="1.2" stroke-linejoin="round"/>
      <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.8" fill="none">
        <line x1="50" y1="4" x2="50" y2="70"/>
        <line x1="24" y1="90" x2="66" y2="56"/>
        <line x1="76" y1="90" x2="34" y2="56"/>
        <line x1="7" y1="36" x2="93" y2="36"/>
      </g>
      <polygon class="glint" points="50,4 60,36 93,36 66,56 76,90 50,70 24,90 34,56 7,36 40,36"
               fill="url(#facetGreenL)"/>
    </svg>
  </div>

  <!-- Blue crystal star -->
  <div class="star-wrap star-blue">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="coreBlue" cx="50%" cy="42%" r="65%">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#bfe4ff"/>
          <stop offset="65%" stop-color="#4fb3ff"/>
          <stop offset="100%" stop-color="#0d6fc7"/>
        </radialGradient>
        <linearGradient id="facetBlueL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polygon points="50,4 60,36 93,36 66,56 76,90 50,70 24,90 34,56 7,36 40,36"
               fill="url(#coreBlue)" stroke="#3fa9ff" stroke-width="1.2" stroke-linejoin="round"/>
      <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.8" fill="none">
        <line x1="50" y1="4" x2="50" y2="70"/>
        <line x1="24" y1="90" x2="66" y2="56"/>
        <line x1="76" y1="90" x2="34" y2="56"/>
        <line x1="7" y1="36" x2="93" y2="36"/>
      </g>
      <polygon class="glint" points="50,4 60,36 93,36 66,56 76,90 50,70 24,90 34,56 7,36 40,36"
               fill="url(#facetBlueL)"/>
    </svg>
  </div>

</div>

<script>
  const stage = document.getElementById('stage');
  const centers = [
    { x: 50, y: 26, color: '#ff2f6e' },
    { x: 31, y: 67, color: '#2fe08f' },
    { x: 69, y: 67, color: '#3fb6ff' }
  ];

  centers.forEach(c => {
    // dust sparkle particles
    for (let i = 0; i < 8; i++) {
      const dot = document.createElement('div');
      dot.className = 'sparkle-dot';
      const angle = Math.random() * Math.PI * 2;
      const dist = 7 + Math.random() * 12;
      const x = c.x + Math.cos(angle) * dist;
      const y = c.y + Math.sin(angle) * dist;
      dot.style.left = x + '%';
      dot.style.top = y + '%';
      dot.style.background = c.color;
      dot.style.color = c.color;
      dot.style.animationDelay = (Math.random() * 2) + 's';
      dot.style.animationDuration = (1.2 + Math.random() * 1.4) + 's';
      stage.appendChild(dot);
    }

    // four-point cross flare
    const flare = document.createElement('div');
    flare.className = 'flare';
    flare.style.left = c.x + '%';
    flare.style.top = c.y + '%';
    flare.style.animationDelay = (Math.random() * 3) + 's';
    flare.innerHTML = `
      <svg width="70" height="70" viewBox="0 0 100 100">
        <g fill="${c.color}">
          <polygon points="50,0 54,46 100,50 54,54 50,100 46,54 0,50 46,46"/>
        </g>
        <g fill="#ffffff" opacity="0.85">
          <polygon points="50,15 52,47 85,50 52,53 50,85 48,53 15,50 48,47"/>
        </g>
      </svg>`;
    stage.appendChild(flare);
  });
</script>

</body>
</html>
