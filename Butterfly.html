<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Metamorphosis</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e0f2fe; /* Light blue watercolor background */
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        
        /* Small overlay instructions */
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(15, 23, 42, 0.7);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>
    <div id="info">Watch the metamorphosis...</div>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = { x: width / 2, y: height / 2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        let state = 'caterpillar'; // caterpillar, cocoon, butterfly
        let stateTimer = 0;

        // --- PARTICLE SYSTEM ---
        class Particle {
            constructor(x, y, color, speedMultiplier = 1) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 * speedMultiplier;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = color;
                this.size = Math.random() * 3 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        let particles = [];

        // --- CATERPILLAR PHASE ---
        class Caterpillar {
            constructor() {
                this.numSegments = 16;
                this.segments = [];
                let startX = -50;
                let startY = height / 2;
                for (let i = 0; i < this.numSegments; i++) {
                    this.segments.push({ x: startX - i * 15, y: startY });
                }
                this.target = { x: width / 2, y: height / 2 };
                this.angle = 0;
                this.speed = 1.5;
                this.time = 0;
            }

            update() {
                this.time += 0.05;

                // Random wandering behavior
                if (Math.random() < 0.01) {
                    this.target.x = width * 0.2 + Math.random() * width * 0.6;
                    this.target.y = height * 0.2 + Math.random() * height * 0.6;
                }

                // If about to cocoon, force to center
                if (stateTimer > 350) {
                    this.target.x = width / 2;
                    this.target.y = height / 2;
                }

                let head = this.segments[0];
                let dx = this.target.x - head.x;
                let dy = this.target.y - head.y;
                let targetAngle = Math.atan2(dy, dx);
                
                // Smoothly interpolate angle
                let angleDiff = targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                this.angle += angleDiff * 0.05;

                // Wavy motion for the head
                let wave = Math.sin(this.time * 2) * 2;

                head.x += Math.cos(this.angle) * this.speed + Math.cos(this.angle + Math.PI/2) * wave;
                head.y += Math.sin(this.angle) * this.speed + Math.sin(this.angle + Math.PI/2) * wave;

                // Update body segments (Inverse Kinematics trailing)
                for (let i = 1; i < this.numSegments; i++) {
                    let seg = this.segments[i];
                    let prev = this.segments[i - 1];
                    let sdx = prev.x - seg.x;
                    let sdy = prev.y - seg.y;
                    let dist = Math.sqrt(sdx * sdx + sdy * sdy);
                    let desiredDist = 12;
                    
                    if (dist > desiredDist) {
                        let ratio = (dist - desiredDist) / dist;
                        seg.x += sdx * ratio * 0.8;
                        seg.y += sdy * ratio * 0.8;
                    }
                }
            }

            draw(ctx) {
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                // Draw from tail to head
                for (let i = this.numSegments - 1; i >= 0; i--) {
                    let seg = this.segments[i];
                    let size = 12 - Math.abs(i - this.numSegments / 2) * 0.6; // Bulky in middle
                    if (i === 0) size = 10; // Head

                    // Draw tiny legs
                    if (i > 1 && i < this.numSegments - 1 && i % 2 === 0) {
                        ctx.strokeStyle = '#32cd32';
                        ctx.lineWidth = 2;
                        let prev = this.segments[i-1];
                        let angle = Math.atan2(seg.y - prev.y, seg.x - prev.x);
                        
                        let legLength = 12;
                        let legWiggle = Math.sin(this.time * 4 + i) * 3;

                        // Left leg
                        ctx.beginPath();
                        ctx.moveTo(seg.x, seg.y);
                        ctx.lineTo(seg.x + Math.cos(angle + Math.PI/2) * legLength + Math.cos(angle)*legWiggle, 
                                   seg.y + Math.sin(angle + Math.PI/2) * legLength + Math.sin(angle)*legWiggle);
                        ctx.stroke();

                        // Right leg
                        ctx.beginPath();
                        ctx.moveTo(seg.x, seg.y);
                        ctx.lineTo(seg.x + Math.cos(angle - Math.PI/2) * legLength + Math.cos(angle)*legWiggle, 
                                   seg.y + Math.sin(angle - Math.PI/2) * legLength + Math.sin(angle)*legWiggle);
                        ctx.stroke();
                    }

                    // Draw body segment
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, size, 0, Math.PI * 2);
                    
                    let gradient = ctx.createRadialGradient(seg.x - size*0.3, seg.y - size*0.3, 0, seg.x, seg.y, size);
                    gradient.addColorStop(0, '#aaff00');
                    gradient.addColorStop(0.7, '#228b22');
                    gradient.addColorStop(1, '#006400');

                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // Spine details
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, size * 0.2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        // --- COCOON PHASE ---
        class Cocoon {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.time = 0;
                this.size = 25;
            }

            update() {
                this.time += 0.05;
                if (Math.random() < 0.3) {
                    particles.push(new Particle(this.x, this.y, '#3b82f6', 0.5));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let pulse = Math.sin(this.time * 3) * 3;
                
                // Magical Outer glow
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size + 15 + pulse, this.size * 1.5 + 15 + pulse, 0, 0, Math.PI * 2);
                let glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 1.5 + 15 + pulse);
                glowGrad.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
                glowGrad.addColorStop(1, 'rgba(59, 130, 246, 0)');
                ctx.fillStyle = glowGrad;
                ctx.fill();

                // Solid chrysalis body
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size + pulse/2, this.size * 1.5 + pulse/2, 0, 0, Math.PI * 2);
                let grad = ctx.createRadialGradient(-10, -10, 0, 0, 0, this.size * 1.5);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.2, '#93c5fd');
                grad.addColorStop(1, '#1e3a8a');
                ctx.fillStyle = grad;
                ctx.fill();
                
                ctx.restore();
            }
        }

        // --- BUTTERFLY PHASE ---
        class Butterfly {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.time = 0;
                this.angle = -Math.PI / 2; // Start facing up
            }

            update() {
                this.time += 0.12; // Majestic, slower flap speed

                // Follow mouse smoothly
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let targetAngle = Math.atan2(dy, dx);
                
                let angleDiff = targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                this.angle += angleDiff * 0.08;

                let dist = Math.sqrt(dx*dx + dy*dy);
                let maxSpeed = 7;
                let speed = Math.min(dist * 0.04, maxSpeed); 

                // Organic wandering to simulate real flight
                let wanderX = Math.cos(this.time * 0.4) * 2;
                let wanderY = Math.sin(this.time * 0.6) * 2;

                this.vx = Math.cos(this.angle) * speed + wanderX;
                this.vy = Math.sin(this.angle) * speed + wanderY;

                this.x += this.vx;
                this.y += this.vy;

                // Magical sparkling trail
                if (Math.random() < 0.6) {
                    let colors = ['#3b82f6', '#60a5fa', '#93c5fd', '#1e3a8a'];
                    let color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(this.x - Math.cos(this.angle)*25, this.y - Math.sin(this.angle)*25, color, 0.5));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                let flap = Math.abs(Math.sin(this.time)); // 0 to 1
                ctx.globalCompositeOperation = 'source-over';

                const drawWing = (side) => {
                    ctx.save();
                    ctx.scale(1, side * (0.4 + flap * 0.6)); // Majestic 3D Flap
                    
                    // --- FOREWING (Top Wing) ---
                    ctx.beginPath();
                    ctx.moveTo(15, 0); 
                    ctx.bezierCurveTo(60, 30, 75, 120, 37, 210); // Leading edge
                    ctx.bezierCurveTo(0, 225, -45, 180, -45, 120); // Outer edge
                    ctx.bezierCurveTo(-30, 60, -15, 30, -7, 0); // Trailing edge
                    
                    let fGrad = ctx.createRadialGradient(0, 0, 15, 0, 120, 225);
                    fGrad.addColorStop(0, '#ffffff');
                    fGrad.addColorStop(0.5, '#bae6fd');
                    fGrad.addColorStop(0.8, '#3b82f6');
                    fGrad.addColorStop(1, '#1e3a8a');
                    ctx.fillStyle = fGrad;
                    ctx.fill();
                    
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#1e3a8a';
                    ctx.stroke();

                    // Forewing Veins
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(7, 7); ctx.lineTo(37, 210);
                    ctx.moveTo(7, 7); ctx.lineTo(-15, 187);
                    ctx.moveTo(7, 7); ctx.lineTo(-37, 150);
                    ctx.moveTo(7, 7); ctx.lineTo(-45, 120);
                    ctx.moveTo(7, 7); ctx.lineTo(22, 135);
                    ctx.stroke();

                    // --- HINDWING (Bottom Wing) ---
                    ctx.beginPath();
                    ctx.moveTo(-7, 0); 
                    ctx.bezierCurveTo(-22, 45, -45, 90, -30, 135); 
                    ctx.bezierCurveTo(-45, 180, -90, 165, -105, 135); 
                    ctx.bezierCurveTo(-120, 75, -75, 15, -22, 0); 
                    
                    let hGrad = ctx.createRadialGradient(-15, 0, 15, -60, 90, 180);
                    hGrad.addColorStop(0, '#ffffff');
                    hGrad.addColorStop(0.5, '#bae6fd');
                    hGrad.addColorStop(0.8, '#3b82f6');
                    hGrad.addColorStop(1, '#1e3a8a');
                    ctx.fillStyle = hGrad;
                    ctx.fill();
                    
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#1e3a8a';
                    ctx.stroke();
                    
                    // Hindwing Veins
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-15, 7); ctx.lineTo(-30, 135);
                    ctx.moveTo(-15, 7); ctx.lineTo(-60, 157);
                    ctx.moveTo(-15, 7); ctx.lineTo(-97, 142);
                    ctx.moveTo(-15, 7); ctx.lineTo(-112, 90);
                    ctx.stroke();

                    // Wing scalloped edge details (dark spots)
                    ctx.fillStyle = '#1e3a8a';
                    ctx.beginPath();
                    ctx.arc(30, 202, 7, 0, Math.PI*2);
                    ctx.arc(-15, 183, 8, 0, Math.PI*2);
                    ctx.arc(-57, 154, 7, 0, Math.PI*2);
                    ctx.arc(-97, 142, 8, 0, Math.PI*2);
                    ctx.fill();

                    ctx.restore();
                };

                // Draw Wings
                drawWing(1);  // Right/Bottom side
                drawWing(-1); // Left/Top side

                // --- BODY ---
                ctx.fillStyle = '#0f172a'; // Very dark blue/black
                ctx.beginPath();
                ctx.ellipse(5, 0, 30, 5, 0, 0, Math.PI * 2); // Longer body
                
                // Head
                ctx.ellipse(40, 0, 6, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // --- ANTENNAE ---
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(45, -3);
                ctx.quadraticCurveTo(60, -20, 55, -40);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(45, 3);
                ctx.quadraticCurveTo(60, 20, 55, 40);
                ctx.stroke();
                
                // Antennae knobs
                ctx.beginPath();
                ctx.arc(55, -40, 3, 0, Math.PI*2);
                ctx.arc(55, 40, 3, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- ANIMATION LOGIC ---
        let caterpillar = new Caterpillar();
        let cocoon = null;
        let butterfly = null;

        function animate() {
            if (state === 'butterfly') {
                ctx.fillStyle = '#e0f2fe'; // Solid background to show crisp art
            } else {
                ctx.fillStyle = 'rgba(224, 242, 254, 0.4)'; // Trail effect for caterpillar
            }
            ctx.fillRect(0, 0, width, height);

            stateTimer++;

            if (state === 'caterpillar') {
                caterpillar.update();
                caterpillar.draw(ctx);

                if (stateTimer > 450) { // Transition to cocoon
                    state = 'cocoon';
                    stateTimer = 0;
                    info.style.opacity = '0'; // Hide info
                    cocoon = new Cocoon(caterpillar.segments[0].x, caterpillar.segments[0].y);
                }
            } else if (state === 'cocoon') {
                cocoon.update();
                cocoon.draw(ctx);

                if (stateTimer > 250) { // Transition to butterfly
                    state = 'butterfly';
                    stateTimer = 0;
                    info.innerText = 'Move your mouse...';
                    info.style.opacity = '1';
                    
                    butterfly = new Butterfly(cocoon.x, cocoon.y);
                    
                    // Massive particle explosion
                    for(let i = 0; i < 150; i++) {
                        let colors = ['#3b82f6', '#93c5fd', '#1e3a8a', '#ffffff'];
                        particles.push(new Particle(cocoon.x, cocoon.y, colors[Math.floor(Math.random()*colors.length)], 3));
                    }
                }
            } else if (state === 'butterfly') {
                butterfly.update();
                butterfly.draw(ctx);
                
                // Fade out instruction after a bit
                if (stateTimer > 300) {
                    info.style.opacity = '0';
                }
            }

            // Update and draw all particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
