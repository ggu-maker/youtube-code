<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Fire Chains</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030303;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #instruction {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Arial', sans-serif;
            font-size: 15px;
            pointer-events: none;
            user-select: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            transition: color 0.3s ease;
        }
        #instruction.active {
            color: rgba(255, 150, 60, 0.85);
        }
        #instruction span {
            display: block;
            font-size: 11px;
            letter-spacing: 1.5px;
            margin-top: 4px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="instruction">Swing the chain with your mouse<span>Hold SPACE to spin it up</span></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const instructionEl = document.getElementById('instruction');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // Mouse interaction
        const mouse = { x: width / 2, y: height / 2, vx: 0, vy: 0 };
        let lastMouse = { x: width / 2, y: height / 2 };

        window.addEventListener('mousemove', (e) => {
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.vx = mouse.x - lastMouse.x;
            mouse.vy = mouse.y - lastMouse.y;
        });

        window.addEventListener('touchmove', (e) => {
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.vx = mouse.x - lastMouse.x;
            mouse.vy = mouse.y - lastMouse.y;
        }, { passive: true });

        // --- Spacebar spin control ---
        let spinHeld = false;
        let spinPower = 0;       // ramps up while held, decays when released
        const SPIN_MAX = 1;
        const SPIN_RAMP = 0.045;
        const SPIN_DECAY = 0.02;

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!spinHeld) {
                    spinHeld = true;
                    instructionEl.classList.add('active');
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                spinHeld = false;
                instructionEl.classList.remove('active');
            }
        });
        // Also allow touch/click-and-hold to trigger spin on mobile (no keyboard)
        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // right click also spins
                spinHeld = true;
                instructionEl.classList.add('active');
            }
        });
        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                spinHeld = false;
                instructionEl.classList.remove('active');
            }
        });
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        // Physics Settings
        const GRAVITY = 0.6;
        const FRICTION = 0.982;
        const CHAIN_LINKS = 26;
        const LINK_LENGTH = 22;
        const ITERATIONS = 10;

        class Point {
            constructor(x, y, pinned = false) {
                this.x = x;
                this.y = y;
                this.oldX = x;
                this.oldY = y;
                this.pinned = pinned;
            }

            update() {
                if (this.pinned) {
                    this.x = mouse.x;
                    this.y = mouse.y;
                    this.oldX = mouse.x - mouse.vx;
                    this.oldY = mouse.y - mouse.vy;
                    return;
                }

                let vx = (this.x - this.oldX) * FRICTION;
                let vy = (this.y - this.oldY) * FRICTION;

                this.oldX = this.x;
                this.oldY = this.y;

                this.x += vx;
                this.y += vy + GRAVITY;
            }
        }

        class Constraint {
            constructor(p1, p2, length) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = length;
            }

            update() {
                let dx = this.p2.x - this.p1.x;
                let dy = this.p2.y - this.p1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist === 0) return;

                let diff = (this.length - dist) / dist;
                let offsetX = dx * diff * 0.5;
                let offsetY = dy * diff * 0.5;

                if (!this.p1.pinned) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.pinned) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }
            }

            draw(ctx, index) {
                let dx = this.p2.x - this.p1.x;
                let dy = this.p2.y - this.p1.y;
                let angle = Math.atan2(dy, dx);
                let midX = (this.p1.x + this.p2.x) / 2;
                let midY = (this.p1.y + this.p2.y) / 2;

                ctx.save();
                ctx.translate(midX, midY);
                ctx.rotate(angle);

                ctx.strokeStyle = '#444';
                ctx.lineWidth = 3.5;

                if (index % 2 === 0) {
                    ctx.beginPath();
                    ctx.roundRect(-this.length / 2 - 2, -7, this.length + 4, 14, 7);
                    ctx.stroke();

                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.roundRect(-this.length / 2 + 2, -3, this.length - 4, 6, 3);
                    ctx.stroke();

                    ctx.strokeStyle = '#aaa';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // Particle System
        let particles = [];
        let sparks = [];
        let embers = [];

        class FireParticle {
            constructor(x, y, cvx, cvy, heat) {
                this.x = x + (Math.random() - 0.5) * 12;
                this.y = y + (Math.random() - 0.5) * 12;

                this.vx = cvx * 0.15 + (Math.random() - 0.5) * 1.5;
                this.vy = cvy * 0.15 + (Math.random() - 0.5) * 1.5 - (Math.random() * 3 + 1);

                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015;
                this.size = (Math.random() * 25 + 15) * (1 + heat * 0.4);

                const rand = Math.random();
                if (rand < 0.15 + heat * 0.15) this.color = { r: 255, g: 235, b: 120 }; // white-hot core
                else if (rand < 0.7) this.color = { r: 255, g: 100, b: 10 };            // orange mid
                else this.color = { r: 200, g: 20, b: 0 };                              // red outer
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size *= 0.96;
            }

            draw(ctx) {
                if (this.life <= 0) return;

                const r = this.size * this.life;
                if (r < 0.1) return;

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.life})`);
                gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g * 0.5}, 0, ${this.life * 0.5})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class SparkParticle {
            constructor(x, y, cvx, cvy) {
                this.x = x;
                this.y = y;
                this.vx = cvx * 0.4 + (Math.random() - 0.5) * 10;
                this.vy = cvy * 0.4 + (Math.random() - 0.5) * 10 - 2;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.005;
                this.size = Math.random() * 2.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.vy += 0.05;
                this.life -= this.decay;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.fillStyle = `rgba(255, 230, 150, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Slow floating embers that drift up from a fast-spinning chain — pure atmosphere
        class Ember {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = -Math.random() * 1.2 - 0.3;
                this.life = 1.0;
                this.decay = Math.random() * 0.006 + 0.003;
                this.size = Math.random() * 1.8 + 0.6;
                this.flicker = Math.random() * Math.PI * 2;
            }
            update() {
                this.flicker += 0.2;
                this.x += this.vx + Math.sin(this.flicker) * 0.3;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                const a = this.life * (0.5 + 0.5 * Math.sin(this.flicker * 2));
                ctx.fillStyle = `rgba(255, 170, 80, ${a})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Chain
        const points = [];
        const constraints = [];

        for (let i = 0; i < CHAIN_LINKS; i++) {
            points.push(new Point(width / 2, height / 2 + i * LINK_LENGTH, i === 0));
        }

        for (let i = 0; i < CHAIN_LINKS - 1; i++) {
            constraints.push(new Constraint(points[i], points[i + 1], LINK_LENGTH));
        }

        // Bends the chain into a closed wheel/ring shape and spins it around the
        // pin, like a flaming hoop. Every link is pulled onto the same circle
        // (radius sized so link-to-link spacing still ~= LINK_LENGTH) at an
        // evenly-spaced angle, all sharing one steadily advancing rotation angle
        // -- so at full power the whole chain locks into one clean spinning wheel
        // instead of a straight spoke. Runs AFTER the constraint solve each frame
        // so the wheel shape always wins over the chain-length constraints.
        let spinAngle = 0;
        const SPIN_ANGULAR_SPEED = 0.18; // radians/frame at full spin power

        function applySpin() {
            if (spinPower <= 0.001) return;

            spinAngle += SPIN_ANGULAR_SPEED * spinPower;

            const pin = points[0];
            const ringCount = points.length - 1;           // links forming the wheel
            const angleStep = (Math.PI * 2) / ringCount;    // even spacing around a full circle
            const radius = LINK_LENGTH / (2 * Math.sin(angleStep / 2)); // keeps chord ~= LINK_LENGTH

            // Eases from natural swing into a fully locked, rigid wheel at max power
            const blend = Math.min(1, spinPower * spinPower * 1.2);

            for (let i = 1; i < points.length; i++) {
                const p = points[i];
                const angle = spinAngle + (i - 1) * angleStep;

                const targetX = pin.x + Math.cos(angle) * radius;
                const targetY = pin.y + Math.sin(angle) * radius;

                p.x += (targetX - p.x) * blend;
                p.y += (targetY - p.y) * blend;
            }
        }

        // Main Loop
        function animate() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Ramp spin power up/down
            if (spinHeld) {
                spinPower = Math.min(SPIN_MAX, spinPower + SPIN_RAMP);
            } else {
                spinPower = Math.max(0, spinPower - SPIN_DECAY);
            }

            // Update physics
            for (let i = 0; i < points.length; i++) {
                points[i].update();
            }

            for (let iter = 0; iter < ITERATIONS; iter++) {
                for (let i = 0; i < constraints.length; i++) {
                    constraints[i].update();
                }
            }

            applySpin();

            // Draw Chain links (base)
            ctx.globalCompositeOperation = 'source-over';
            for (let i = 0; i < constraints.length; i++) {
                constraints[i].draw(ctx, i);
            }

            // Emit particles along the chain
            const mouseSpeed = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
            const speed = mouseSpeed + spinPower * 14; // spin adds heat even if mouse is still
            const intensity = Math.min(speed / 10 + 1, 6);

            for (let i = 0; i < points.length - 1; i++) {
                let p1 = points[i];
                let p2 = points[i + 1];
                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let steps = dist / 8;

                for (let j = 0; j < steps; j++) {
                    if (Math.random() < 0.4 * intensity) {
                        let t = j / steps;
                        let emitX = p1.x + dx * t;
                        let emitY = p1.y + dy * t;

                        let cvx = (p1.x - p1.oldX) * (1 - t) + (p2.x - p2.oldX) * t;
                        let cvy = (p1.y - p1.oldY) * (1 - t) + (p2.y - p2.oldY) * t;

                        particles.push(new FireParticle(emitX, emitY, cvx, cvy, spinPower));

                        if (Math.random() < 0.05 * intensity) {
                            sparks.push(new SparkParticle(emitX, emitY, cvx, cvy));
                        }
                        if (spinPower > 0.5 && Math.random() < 0.01 * intensity) {
                            embers.push(new Ember(emitX, emitY));
                        }
                    }
                }
            }

            // Update & Draw Particles (additive blending)
            ctx.globalCompositeOperation = 'lighter';

            particles = particles.filter(p => p.life > 0);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw(ctx);
            }

            sparks = sparks.filter(s => s.life > 0);
            for (let i = 0; i < sparks.length; i++) {
                sparks[i].update();
                sparks[i].draw(ctx);
            }

            embers = embers.filter(e => e.life > 0);
            for (let i = 0; i < embers.length; i++) {
                embers[i].update();
                embers[i].draw(ctx);
            }

            // Global glow around the whole chain when moving fast or spinning
            if (speed > 5) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.strokeStyle = `rgba(255, 100, 0, ${Math.min(speed / 100, 0.35)})`;
                ctx.lineWidth = 40;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.filter = 'blur(15px)';
                ctx.stroke();
                ctx.filter = 'none';
            }

            // Soft screen-wide warm vignette while spinning, intensifying with spin power
            if (spinPower > 0.05) {
                const vg = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, Math.max(width, height) * 0.6
                );
                vg.addColorStop(0, `rgba(255, 90, 0, ${spinPower * 0.10})`);
                vg.addColorStop(1, 'rgba(255, 90, 0, 0)');
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = vg;
                ctx.fillRect(0, 0, width, height);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
