
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Interactive Panda</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, #151820 0%, #08090c 55%, #030405 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    cursor: default;
}

/* ---------------- BACKGROUND ---------------- */

.glow {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.025) 35%,
        transparent 70%
    );
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: left .15s, top .15s;
}

.star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .35;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%,100% {
        opacity: .15;
        transform: scale(.7);
    }
    50% {
        opacity: .8;
        transform: scale(1.4);
    }
}

/* ---------------- PANDA ---------------- */

.panda {
    position: relative;
    width: 330px;
    height: 310px;
    transition: transform .15s ease-out;
    cursor: pointer;
}

/* EARS */

.ear {
    position: absolute;
    width: 105px;
    height: 105px;
    background: #050505;
    border-radius: 50%;
    top: 5px;
    z-index: 1;
    transition: transform .2s ease;
}

.ear.left {
    left: 10px;
}

.ear.right {
    right: 10px;
}

.panda:hover .ear.left {
    transform: rotate(-10deg) translateY(-3px);
}

.panda:hover .ear.right {
    transform: rotate(10deg) translateY(-3px);
}

/* FACE */

.face {
    position: absolute;
    width: 290px;
    height: 270px;
    left: 20px;
    top: 35px;
    background: #f7f7f7;
    border-radius: 48% 48% 45% 45%;
    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 -10px 25px rgba(0,0,0,.07);
    z-index: 2;
    transition: transform .2s ease;
}

/* subtle face shine */

.face::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 40px;
    background: rgba(255,255,255,.35);
    border-radius: 50%;
    top: 20px;
    left: 75px;
    filter: blur(15px);
}

/* EYE PATCHES */

.eye-patch {
    position: absolute;
    width: 82px;
    height: 105px;
    background: #070707;
    border-radius: 50%;
    top: 65px;
}

.eye-patch.left {
    left: 40px;
    transform: rotate(28deg);
}

.eye-patch.right {
    right: 40px;
    transform: rotate(-28deg);
}

/* EYES */

.eye {
    position: absolute;
    width: 38px;
    height: 38px;
    background: white;
    border-radius: 50%;
    top: 32px;
    left: 22px;
    overflow: hidden;
    transition: height .1s;
}

/* PUPILS */

.pupil {
    position: absolute;
    width: 17px;
    height: 17px;
    background: #050505;
    border-radius: 50%;
    left: 10px;
    top: 10px;
    transition: transform .08s linear;
}

/* EYE SHINE */

.pupil::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 3px;
}

/* NOSE */

.nose {
    position: absolute;
    width: 38px;
    height: 28px;
    background: #050505;
    border-radius: 50% 50% 55% 55%;
    top: 160px;
    left: 126px;
    transition: transform .15s;
}

.panda:hover .nose {
    transform: scale(1.08);
}

/* MOUTH */

.mouth {
    position: absolute;
    width: 48px;
    height: 25px;
    left: 121px;
    top: 190px;
    transition: transform .2s;
}

.mouth::before,
.mouth::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 15px;
    border-bottom: 3px solid #050505;
}

.mouth::before {
    left: 0;
    border-radius: 0 0 0 20px;
    transform: rotate(-8deg);
}

.mouth::after {
    right: 0;
    border-radius: 0 0 20px 0;
    transform: rotate(8deg);
}

/* HAPPY MOUTH */

.panda.happy .mouth {
    transform: scale(1.25) translateY(-2px);
}

/* CHEEKS */

.cheek {
    position: absolute;
    width: 30px;
    height: 14px;
    background: rgba(255,120,145,.18);
    border-radius: 50%;
    top: 175px;
    transition: .2s;
}

.cheek.left {
    left: 32px;
}

.cheek.right {
    right: 32px;
}

.panda.happy .cheek {
    background: rgba(255,100,130,.42);
    transform: scale(1.25);
}

/* BLINK */

.eye.closed {
    height: 5px;
    top: 48px;
    border-radius: 10px;
    background: #050505;
}

.eye.closed .pupil {
    display: none;
}

/* ---------------- FLOATING HEARTS ---------------- */

.heart {
    position: fixed;
    pointer-events: none;
    font-size: 20px;
    animation: floatHeart 1.8s ease-out forwards;
    z-index: 20;
}

@keyframes floatHeart {

    0% {
        opacity: 0;
        transform: translateY(10px) scale(.5) rotate(0deg);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-130px)
            translateX(var(--x))
            scale(1.3)
            rotate(25deg);
    }
}

/* ---------------- SPARKLES ---------------- */

.sparkle {
    position: fixed;
    width: 6px;
    height: 6px;
    background: white;
    transform: rotate(45deg);
    pointer-events: none;
    animation: sparkle .8s ease-out forwards;
}

@keyframes sparkle {

    0% {
        opacity: 1;
        transform: rotate(45deg) scale(.4);
    }

    100% {
        opacity: 0;
        transform: rotate(45deg) scale(1.8)
                   translateY(-30px);
    }
}

/* ---------------- LOVE POP ---------------- */

.love {
    position: fixed;
    font-size: 45px;
    pointer-events: none;
    animation: lovePop 1s ease-out forwards;
    z-index: 50;
}

@keyframes lovePop {

    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.2);
    }

    40% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.3);
    }

    100% {
        opacity: 0;
        transform: translate(-50%,-100px) scale(.8);
    }
}

/* ---------------- LABEL ---------------- */

.label {
    position: fixed;
    bottom: 32px;
    color: rgba(255,255,255,.35);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: opacity .3s;
}

.panda:hover ~ .label {
    opacity: .7;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="panda" id="panda">

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="face">

        <div class="eye-patch left">
            <div class="eye">
                <div class="pupil"></div>
            </div>
        </div>

        <div class="eye-patch right">
            <div class="eye">
                <div class="pupil"></div>
            </div>
        </div>

        <div class="cheek left"></div>
        <div class="cheek right"></div>

        <div class="nose"></div>
        <div class="mouth"></div>

    </div>
</div>

<div class="label">Move your cursor • click the panda</div>

<script>

const panda = document.getElementById("panda");
const pupils = document.querySelectorAll(".pupil");
const glow = document.querySelector(".glow");

let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;

/* ---------------- STARS ---------------- */

for(let i = 0; i < 45; i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    document.body.appendChild(star);
}

/* ---------------- MOUSE ---------------- */

document.addEventListener("mousemove", e => {

    mouseX = e.clientX;
    mouseY = e.clientY;

    glow.style.left = mouseX + "px";
    glow.style.top = mouseY + "px";

    /* random sparkle */

    if(Math.random() < .08){
        createSparkle(mouseX, mouseY);
    }
});

/* ---------------- EYE TRACKING ---------------- */

function animate(){

    const rect = panda.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let dx = mouseX - centerX;
    let dy = mouseY - centerY;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    const maxMove = 9;

    if(distance > maxMove){

        dx = dx / distance * maxMove;
        dy = dy / distance * maxMove;
    }

    pupils.forEach(pupil => {

        pupil.style.transform =
            `translate(${dx}px, ${dy}px)`;

    });

    /* subtle head movement */

    const rx = dy * -.015;
    const ry = dx * .015;

    panda.style.transform =
        `perspective(700px)
         rotateX(${rx}deg)
         rotateY(${ry}deg)`;

    /* Happy mode when cursor is close */

    const pandaCenterX =
        rect.left + rect.width / 2;

    const pandaCenterY =
        rect.top + rect.height / 2;

    const distanceFromPanda =
        Math.hypot(
            mouseX - pandaCenterX,
            mouseY - pandaCenterY
        );

    if(distanceFromPanda < 230){
        panda.classList.add("happy");
    } else {
        panda.classList.remove("happy");
    }

    requestAnimationFrame(animate);
}

animate();

/* ---------------- BLINKING ---------------- */

function blink(){

    const eyes =
        document.querySelectorAll(".eye");

    eyes.forEach(eye =>
        eye.classList.add("closed")
    );

    setTimeout(() => {

        eyes.forEach(eye =>
            eye.classList.remove("closed")
        );

    }, 130);

    setTimeout(
        blink,
        2200 + Math.random() * 3500
    );
}

setTimeout(blink, 2000);

/* ---------------- HEARTS ---------------- */

let heartTimer = 0;

document.addEventListener("mousemove", e => {

    heartTimer++;

    if(heartTimer % 35 !== 0) return;

    const rect =
        panda.getBoundingClientRect();

    const distance =
        Math.hypot(
            e.clientX -
            (rect.left + rect.width/2),

            e.clientY -
            (rect.top + rect.height/2)
        );

    if(distance < 230){

        createHeart(
            e.clientX,
            e.clientY
        );
    }
});

function createHeart(x,y){

    const heart =
        document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        Math.random() > .5 ? "♡" : "♥";

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    heart.style.setProperty(
        "--x",
        (Math.random()*80 - 40) + "px"
    );

    document.body.appendChild(heart);

    setTimeout(() =>
        heart.remove(),
        1800
    );
}

/* ---------------- SPARKLES ---------------- */

function createSparkle(x,y){

    const s =
        document.createElement("div");

    s.className = "sparkle";

    s.style.left = x + "px";
    s.style.top = y + "px";

    document.body.appendChild(s);

    setTimeout(() =>
        s.remove(),
        800
    );
}

/* ---------------- CLICK ---------------- */

panda.addEventListener("click", e => {

    /* big heart */

    const love =
        document.createElement("div");

    love.className = "love";
    love.innerHTML = "♡";

    love.style.left =
        e.clientX + "px";

    love.style.top =
        e.clientY + "px";

    document.body.appendChild(love);

    setTimeout(() =>
        love.remove(),
        1000
    );

    /* burst of small hearts */

    for(let i = 0; i < 6; i++){

        setTimeout(() => {

            createHeart(
                e.clientX +
                Math.random()*80 - 40,

                e.clientY +
                Math.random()*30
            );

        }, i * 80);
    }

    /* cute bounce */

    panda.animate(
        [
            { transform: "scale(1)" },
            { transform: "scale(1.08)" },
            { transform: "scale(.97)" },
            { transform: "scale(1)" }
        ],
        {
            duration: 450,
            easing: "ease-out"
        }
    );
});

</script>

</body>
</html>
