<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben 10 - 3D Diamondhead Animation</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #03140e 0%, #010805 60%, #000201 100%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #e2fef1;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Omnitrix Themed UI Overlay */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .omnitrix-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #111;
      border: 3px solid #00ff73;
      box-shadow: 0 0 16px #00ff73, inset 0 0 10px #00ff73;
      position: relative;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .omnitrix-badge:hover {
      transform: scale(1.1) rotate(15deg);
    }
    .omnitrix-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .omnitrix-core::before, .omnitrix-core::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
    }
    .omnitrix-core::before {
      top: 2px;
      left: 4px;
      border-top: 14px solid #00ff73;
    }
    .omnitrix-core::after {
      bottom: 2px;
      left: 4px;
      border-bottom: 14px solid #00ff73;
    }

    .title-box {
      display: flex;
      flex-direction: column;
    }
    .title-box h1 {
      font-size: 26px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 900;
      color: #92ffd4;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
    }
    .title-box span {
      font-size: 11px;
      letter-spacing: 2px;
      color: #55cca2;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Attack & Control Dock */
    .controls-dock {
      align-self: center;
      display: flex;
      gap: 12px;
      background: rgba(3, 16, 12, 0.85);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(0, 255, 115, 0.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      background: rgba(8, 28, 21, 0.9);
      border: 1.5px solid #00dd77;
      color: #b7ffdf;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background: #00dd77;
      color: #02120a;
      box-shadow: 0 0 20px rgba(0, 255, 115, 0.6);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .action-btn.active {
      background: #00e676;
      color: #011108;
      box-shadow: 0 0 18px #00ff88;
    }

    /* Camera & Lighting Dock */
    .cam-dock {
      position: absolute;
      right: 24px;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .cam-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(4, 24, 18, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: #8cffcf;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cam-btn:hover {
      background: rgba(0, 255, 136, 0.3);
      color: #ffffff;
      border-color: #00ff88;
    }

    /* Bottom Toolbar */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }

    .audio-toggle {
      cursor: pointer;
      color: #43c593;
      font-size: 12px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      background: rgba(4, 20, 15, 0.7);
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid rgba(0, 255, 115, 0.25);
    }
    .audio-toggle:hover {
      color: #00ff88;
      border-color: #00ff88;
    }

    /* Real-Time Brightness Slider HUD */
    .brightness-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(4, 20, 15, 0.7);
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid rgba(0, 255, 115, 0.25);
      font-size: 11px;
      color: #79e9bc;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .brightness-control input[type="range"] {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: #144432;
      outline: none;
      cursor: pointer;
    }
    .brightness-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
      cursor: pointer;
    }

    .instructions-hint {
      font-size: 11px;
      color: rgba(146, 255, 212, 0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Screen Flash */
    #impact-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(70, 220, 160, 0.45);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.08s ease-out;
    }

    @media (max-width: 768px) {
      .title-box h1 { font-size: 20px; }
      .controls-dock { gap: 6px; padding: 8px 12px; }
      .action-btn { padding: 8px 12px; font-size: 11px; }
      .instructions-hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="impact-flash"></div>
  <canvas id="webgl-canvas"></canvas>

  <div class="hud-layer">
    <div class="header">
      <div class="omnitrix-badge" id="omnitrixLogo" title="Petrosapien Alien DNA">
        <div class="omnitrix-core"></div>
      </div>
      <div class="title-box">
        <h1>Diamondhead</h1>
        <span>Species: Petrosapien | Planet: Petropia</span>
      </div>
    </div>

    <div class="cam-dock">
      <button class="cam-btn" id="camFront" title="Front View">F</button>
      <button class="cam-btn" id="camBack" title="Back View">B</button>
      <button class="cam-btn" id="camAction" title="Action Dynamic View">A</button>
      <button class="cam-btn" id="camClose" title="Close Up Head">C</button>
      <button class="cam-btn" id="camTop" title="Top-Down View">T</button>
    </div>

    <div class="controls-dock">
      <button class="action-btn active" id="btnIdle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        Combat Stance
      </button>
      <button class="action-btn" id="btnEruption">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        Crystal Eruption
      </button>
      <button class="action-btn" id="btnBlades">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 4.5l-3 3L7 3 3 7l4.5 4.5-3 3 1.4 1.4 3-3L13 17l4-4-4.5-4.5 3-3z"/></svg>
        Diamond Blades
      </button>
      <button class="action-btn" id="btnBarrage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05c-5.06.5-9 4.76-9 9.95 0 5.52 4.47 10 9.99 10 3.31 0 6.24-1.61 8.01-4.09l-2.49-1.46C16.14 18.04 14.21 19 12 19z"/></svg>
        Shard Barrage
      </button>
      <button class="action-btn" id="btnShield">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Crystal Barrier
      </button>
    </div>

    <div class="bottom-bar">
      <div class="tool-group">
        <div class="audio-toggle" id="audioToggle">
          <span id="audioIcon">🔊</span> SOUND ON
        </div>
        <div class="brightness-control">
          <span>🔆 BRIGHTNESS</span>
          <input type="range" id="brightnessSlider" min="0.3" max="1.5" step="0.05" value="0.85">
        </div>
      </div>
      <div class="instructions-hint">
        Drag to rotate • Scroll to zoom • Right-click pan
      </div>
    </div>
  </div>

  <!-- CDN Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    /* =========================================================================
       AUDIO SYNTHESIZER (Pure Web Audio API - Zero External Audio Files)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playOmnitrixChirp() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
        osc.frequency.exponentialRampToValueAtTime(1760, t + 0.18);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      }
      playCrystalChime() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        [1046.5, 1318.5, 1567.98, 2093.0].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + i * 0.04);
          gain.gain.setValueAtTime(0.1, t + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.04 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.04);
          osc.stop(t + i * 0.04 + 0.55);
        });
      }
      playSlamImpact() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        // Sub-bass drop
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(25, t + 0.45);
        gain.gain.setValueAtTime(0.65, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.7);

        // Noise crack
        const bufferSize = this.ctx.sampleRate * 0.2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 900;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.25, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(t);
      }
      playBladeSheath() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(700, t);
        osc.frequency.exponentialRampToValueAtTime(2000, t + 0.15);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.26);
      }
      playShardShot() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }
      playShieldHum() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.linearRampToValueAtTime(320, t + 0.25);
        osc.frequency.linearRampToValueAtTime(220, t + 0.7);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.85);
      }
    }
    const sounds = new SoundEngine();

    /* =========================================================================
       SCENE SETUP & THREE.JS RENDERER (Balanced Lighting & Exposure)
       ========================================================================= */
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010805, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 11);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85; // Clean balanced exposure
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 25;
    controls.target.set(0, 2.5, 0);

    // Controlled Bloom Pass (Prevents blown-out white glare)
    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.32,  // Bloom strength dialed down to crisp level
      0.28,  // Bloom radius
      0.88   // High threshold: ONLY glowing Omnitrix/eyes bloom!
    );
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    /* =========================================================================
       BALANCED LIGHTING (No Overexposure)
       ========================================================================= */
    const ambientLight = new THREE.AmbientLight(0x081510, 0.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xf5fffa, 1.15);
    mainLight.position.set(6, 12, 8);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.bias = -0.0005;
    mainLight.shadow.camera.near = 1;
    mainLight.shadow.camera.far = 30;
    mainLight.shadow.camera.left = -6;
    mainLight.shadow.camera.right = 6;
    mainLight.shadow.camera.top = 8;
    mainLight.shadow.camera.bottom = -2;
    scene.add(mainLight);

    const rimLight1 = new THREE.DirectionalLight(0x00e676, 0.85);
    rimLight1.position.set(-8, 6, -8);
    scene.add(rimLight1);

    const rimLight2 = new THREE.PointLight(0x40e0d0, 0.6, 15);
    rimLight2.position.set(0, 5, -5);
    scene.add(rimLight2);

    const groundGlow = new THREE.PointLight(0x00ff88, 0.35, 8);
    groundGlow.position.set(0, 0.4, 0);
    scene.add(groundGlow);

    /* =========================================================================
       PETROPIA ENVIRONMENT PLATFORM
       ========================================================================= */
    const floorGeo = new THREE.CylinderGeometry(14, 15, 0.8, 32);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x050f0b,
      roughness: 0.8,
      metalness: 0.2
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.4;
    floor.receiveShadow = true;
    scene.add(floor);

    // Subtle Alien Circuit Rings
    const ringGeo = new THREE.RingGeometry(3.5, 4.2, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x00ff88,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.25
    });
    const glyphRing = new THREE.Mesh(ringGeo, ringMat);
    glyphRing.rotation.x = -Math.PI / 2;
    glyphRing.position.y = 0.02;
    scene.add(glyphRing);

    const outerRingGeo = new THREE.RingGeometry(8.5, 8.8, 64);
    const outerRing = new THREE.Mesh(outerRingGeo, ringMat);
    outerRing.rotation.x = -Math.PI / 2;
    outerRing.position.y = 0.02;
    scene.add(outerRing);

    // Floating crystal ambient particles (Soft, subtle motes)
    const particleCount = 70;
    const particleGeo = new THREE.TetrahedronGeometry(0.045, 0);
    const particleMat = new THREE.MeshStandardMaterial({
      color: 0x2ec287,
      roughness: 0.4,
      metalness: 0.2,
      transparent: true,
      opacity: 0.55
    });
    const particleGroup = new THREE.Group();
    const particleData = [];
    for (let i = 0; i < particleCount; i++) {
      const p = new THREE.Mesh(particleGeo, particleMat);
      p.position.set(
        (Math.random() - 0.5) * 16,
        Math.random() * 8 + 0.2,
        (Math.random() - 0.5) * 16
      );
      p.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      particleGroup.add(p);
      particleData.push({
        baseY: p.position.y,
        speed: 0.4 + Math.random() * 0.8,
        rotSpeed: (Math.random() - 0.5) * 2,
        angle: Math.random() * Math.PI * 2
      });
    }
    scene.add(particleGroup);

    /* =========================================================================
       DIAMONDHEAD 3D MODEL - SHOW-ACCURATE PETROSAPIEN ANATOMY
       Engineered to precisely match the original Ben 10 character art:
       - Chiseled Hexagonal Jaw/Goatee, Stern Visor Brow, Slanted Glowing Eyes
       - Triple-Horn Crown: Center Back-Swept Blade, Dorsal Fin & Lateral Ear Horns
       - Massive Scapular Back Blades towering high above Head & Shoulders
       - 100% Mint Crystal Arms: Huge Blocky Shoulder Boulders & Heavy Gauntlets
       - Long Alien Ape-Index Reach with 4 Articulated Beveled Crystal Fingers
       - Classic Sleeveless 50/50 Suit (Right Black / Left White) with Pectoral Shelves
       - Stylized Cartoon Legs with Flared Muscular Calves & Pointed Comic Boots
       - Crisp Hand-Drawn Comic Facet Ink Lines (EdgesGeometry)
       ========================================================================= */

    // Authentic Mint Celadon Crystal Material (True Petrosapien gem shade)
    const crystalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x7ce2b8,
      emissive: 0x032014,
      roughness: 0.16,
      metalness: 0.04,
      clearcoat: 0.95,

      const freeShard = shards.find(s => !s.active);

      freeShard.active = true;
      freeShard.life = 1.0;
      freeShard.mesh.position.copy(origin);
      freeShard.mesh.visible = true;
      
      const dir = new THREE.Vector3().subVectors(target, origin).normalize();
      dir.x += (Math.random() - 0.5) * 0.15;
      dir.y += (Math.random() - 0.5) * 0.15;
      freeShard.vel.copy(dir).multiplyScalar(18 + Math.random() * 6);
      freeShard.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);

    function resetLimbRotations() {
      torsoGroup.position.set(0, 2.7, 0);
      torsoGroup.rotation.set(0, 0, 0);
      headGroup.rotation.set(0, 0, 0);
      diamondhead.position.set(0, 0, 0);
      diamondhead.rotation.set(0, 0, 0);

      rightArm.armGroup.rotation.set(0.1, 0, 0.2);
      rightArm.upperArmGroup.rotation.set(0, 0, 0);
      rightArm.forearmGroup.rotation.set(0.2, 0, 0);
      
      leftArm.armGroup.rotation.set(0.1, 0, -0.2);
      leftArm.upperArmGroup.rotation.set(0, 0, 0);
      leftArm.forearmGroup.rotation.set(0.2, 0, 0);

      rightLeg.legGroup.rotation.set(-0.1, 0, 0.1);
      rightLeg.shinGroup.rotation.set(0.1, 0, 0);
      leftLeg.legGroup.rotation.set(-0.1, 0, -0.1);
      leftLeg.shinGroup.rotation.set(0.1, 0, 0);
    }
    resetLimbRotations();

    const flashEl = document.getElementById('impact-flash');
    function triggerFlash(intensity = 0.4) {
      flashEl.style.opacity = intensity;
      setTimeout(() => {
        flashEl.style.opacity = 0;
      }, 90);
    }

    let shakeDuration = 0;
    let shakeIntensity = 0;
    function triggerShake(duration = 0.4, intensity = 0.25) {
      shakeDuration = duration;
      shakeIntensity = intensity;
    }

    function setState(newState) {
      currentState = newState;
      stateTime = 0;

      document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
      if (newState === STATES.IDLE) document.getElementById('btnIdle').classList.add('active');
      if (newState === STATES.ERUPTION) document.getElementById('btnEruption').classList.add('active');
      if (newState === STATES.BLADES) document.getElementById('btnBlades').classList.add('active');
      if (newState === STATES.BARRAGE) document.getElementById('btnBarrage').classList.add('active');
      if (newState === STATES.SHIELD) document.getElementById('btnShield').classList.add('active');

      if (newState === STATES.ERUPTION) {
        sounds.playCrystalChime();
        eruptionSpikes.forEach(s => {
          s.growTimer = 0;
          s.active = false;
          s.mesh.visible = false;
          s.mesh.scale.set(0.001, 0.001, 0.001);
        });
      }

      if (newState === STATES.BLADES) {
        sounds.playBladeSheath();
      }

      if (newState === STATES.BARRAGE) {
        sounds.playCrystalChime();
      }

      if (newState === STATES.SHIELD) {
        shieldDome.visible = true;
        sounds.playShieldHum();
      }
    }

    /* =========================================================================
       MAIN RENDER & ANIMATION LOOP
       ========================================================================= */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      stateTime += delta;

      // Animate ambient particles
      particleGroup.children.forEach((p, idx) => {
        const d = particleData[idx];
        p.position.y = d.baseY + Math.sin(elapsed * d.speed + d.angle) * 0.4;
        p.rotation.x += d.rotSpeed * delta;
        p.rotation.y += d.rotSpeed * delta * 0.8;
      });

      // Animate Omnitrix subtle pulsing glow
      const pulse = 0.5 + 0.2 * Math.sin(elapsed * 4.5);
      omnitrixLight.intensity = pulse;

      // Handle Blade Morphing Animation Interpolation
      const targetBladeT = (currentState === STATES.BLADES) ? 1 : 0;
      bladeMorphT += (targetBladeT - bladeMorphT) * Math.min(delta * 8, 1);

      [rightArm, leftArm].forEach(arm => {
        if (bladeMorphT > 0.01) {
          arm.bladeGroup.visible = true;
          arm.bladeGroup.scale.set(bladeMorphT, bladeMorphT, bladeMorphT);
          arm.fingers.forEach(f => f.scale.set(1 - bladeMorphT, 1 - bladeMorphT, 1 - bladeMorphT));
        } else {
          arm.bladeGroup.visible = false;
          arm.fingers.forEach(f => f.scale.set(1, 1, 1));
        }
      });

      // Handle Shield Dome Animation Interpolation
      const targetShieldT = (currentState === STATES.SHIELD) ? 1 : 0;
      shieldT += (targetShieldT - shieldT) * Math.min(delta * 7, 1);
      if (shieldT > 0.01) {
        shieldDome.visible = true;
        shieldDome.scale.set(shieldT, shieldT * 1.1, shieldT);
        shieldDome.rotation.y += delta * 0.4;
        shieldMat.opacity = shieldT * 0.8;
      } else {
        shieldDome.visible = false;
      }

      /* -----------------------------------------------------------------------
         STATE BEHAVIORS
         ----------------------------------------------------------------------- */
      if (currentState === STATES.IDLE) {
        const breath = Math.sin(elapsed * 1.8);
        torsoGroup.position.y = 2.7 + breath * 0.035;
        headGroup.rotation.y = Math.sin(elapsed * 0.9) * 0.08;
        headGroup.rotation.x = Math.sin(elapsed * 1.4) * 0.04 - 0.05;

        rightArm.armGroup.rotation.z = 0.25 + breath * 0.02;
        rightArm.upperArmGroup.rotation.x = Math.sin(elapsed * 1.8) * 0.05;
        leftArm.armGroup.rotation.z = -0.25 - breath * 0.02;
        leftArm.upperArmGroup.rotation.x = Math.sin(elapsed * 1.8) * 0.05;

        backSpikesGroup.rotation.x = breath * 0.03;
      }
      else if (currentState === STATES.ERUPTION) {
        if (stateTime < 0.45) {
          const windup = stateTime / 0.45;
          torsoGroup.position.y = 2.7 - windup * 0.65;
          torsoGroup.rotation.x = windup * 0.45;
          headGroup.rotation.x = -windup * 0.35;

          rightArm.armGroup.rotation.set(-windup * 0.8, 0, 0.4);
          rightArm.upperArmGroup.rotation.set(-windup * 0.9, 0, 0);
          leftArm.armGroup.rotation.set(windup * 0.3, 0, -0.4);

          rightLeg.legGroup.rotation.set(-windup * 0.5, 0, 0.2);
          rightLeg.shinGroup.rotation.set(windup * 0.8, 0, 0);
          leftLeg.legGroup.rotation.set(-windup * 0.5, 0, -0.2);
          leftLeg.shinGroup.rotation.set(windup * 0.8, 0, 0);
        }
        else if (stateTime < 0.55) {
          torsoGroup.position.y = 1.85;
          torsoGroup.rotation.x = 0.65;
          rightArm.armGroup.rotation.set(1.1, 0, 0.15);
          rightArm.upperArmGroup.rotation.set(0.4, 0, 0);

          if (stateTime - delta < 0.45) {
            sounds.playSlamImpact();
            triggerFlash(0.5);
            triggerShake(0.5, 0.35);
          }
        }
        else if (stateTime < 3.2) {
          const eruptionTime = stateTime - 0.55;

          eruptionSpikes.forEach(s => {
            if (eruptionTime > s.delay) {
              s.mesh.visible = true;
              s.growTimer += delta * 5.5;
              const progress = Math.min(s.growTimer, 1);
              const scaleY = Math.sin(progress * Math.PI * 0.5) * s.maxHeight;
              const scaleXZ = Math.sin(progress * Math.PI * 0.5);
              s.mesh.scale.set(scaleXZ, scaleY, scaleXZ);
            }
          });

          headGroup.rotation.x = -0.4;
        }
        else if (stateTime < 4.2) {
          const returnT = (stateTime - 3.2) / 1.0;
          torsoGroup.position.y = 1.85 + returnT * 0.85;
          torsoGroup.rotation.x = 0.65 * (1 - returnT);
          rightArm.armGroup.rotation.x = 1.1 * (1 - returnT) + returnT * 0.1;
          rightLeg.legGroup.rotation.x = -0.5 * (1 - returnT) - 0.1 * returnT;
          rightLeg.shinGroup.rotation.x = 0.8 * (1 - returnT) + 0.1 * returnT;

          eruptionSpikes.forEach(s => {
            const shrink = Math.max(1 - returnT * 1.5, 0);
            s.mesh.scale.multiplyScalar(shrink);
            if (shrink <= 0.05) s.mesh.visible = false;
          });
        } else {
          setState(STATES.IDLE);
        }
      }
      else if (currentState === STATES.BLADES) {
        const cycle = (stateTime * 2.8) % (Math.PI * 2);

        torsoGroup.rotation.y = Math.sin(cycle) * 0.4;
        torsoGroup.position.y = 2.7 + Math.abs(Math.sin(cycle)) * 0.1;

        rightArm.armGroup.rotation.set(
          Math.sin(cycle) * 0.9 + 0.2,
          0.3,
          0.3
        );
        rightArm.upperArmGroup.rotation.set(0.3, 0, Math.cos(cycle) * 0.5);

        leftArm.armGroup.rotation.set(
          -Math.sin(cycle) * 0.9 + 0.2,
          -0.3,
          -0.3
        );
        leftArm.upperArmGroup.rotation.set(0.3, 0, -Math.cos(cycle) * 0.5);

        rightLeg.legGroup.rotation.x = -Math.sin(cycle) * 0.3 - 0.1;
        leftLeg.legGroup.rotation.x = Math.sin(cycle) * 0.3 - 0.1;
      }
      else if (currentState === STATES.BARRAGE) {
        torsoGroup.rotation.set(0.1, 0, 0);
        rightArm.armGroup.rotation.set(1.45, 0, 0.15);
        leftArm.armGroup.rotation.set(1.45, 0, -0.15);

        const recoil = Math.sin(stateTime * 24);
        rightArm.upperArmGroup.position.z = recoil * 0.08;
        leftArm.upperArmGroup.position.z = -recoil * 0.08;

        if (Math.random() < 0.32) {
          const isR = Math.random() > 0.5;
          const handPos = new THREE.Vector3();
          (isR ? rightArm.handGroup : leftArm.handGroup).getWorldPosition(handPos);
          
          const target = new THREE.Vector3(
            (Math.random() - 0.5) * 4,
            2.0 + (Math.random() - 0.5) * 2,
            12
          );
          fireShard(handPos, target);
          sounds.playShardShot();
        }

        if (stateTime > 3.8) {
          setState(STATES.IDLE);
        }
      }
      else if (currentState === STATES.SHIELD) {
        rightArm.armGroup.rotation.set(1.1, -0.4, 0.6);
        leftArm.armGroup.rotation.set(1.1, 0.4, -0.6);
        torsoGroup.position.y = 2.55;
        headGroup.rotation.x = 0.1;

        if (stateTime > 4.2) {
          setState(STATES.IDLE);
        }
      }

      // Update Active Shard Projectiles
      shards.forEach(s => {
        if (s.active) {
          s.mesh.position.addScaledVector(s.vel, delta);
          s.life -= delta * 1.5;
          if (s.life <= 0 || s.mesh.position.z > 20) {
            s.active = false;
            s.mesh.visible = false;
          }
        }
      });

      // Camera Shake computation
      if (shakeDuration > 0) {
        shakeDuration -= delta;
        const currentIntensity = (shakeDuration > 0) ? shakeIntensity * (shakeDuration / 0.5) : 0;
        camera.position.x += (Math.random() - 0.5) * currentIntensity;
        camera.position.y += (Math.random() - 0.5) * currentIntensity;
      }

      // Camera modes
      if (cameraMode === 'front') {
        camera.position.lerp(new THREE.Vector3(0, 3.2, 8.5), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 2.3, 0), 0.05);
      } else if (cameraMode === 'back') {
        camera.position.lerp(new THREE.Vector3(0, 3.2, -8.5), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 2.3, 0), 0.05);
      } else if (cameraMode === 'action') {
        camera.position.lerp(new THREE.Vector3(-4.5, 2.2, 5.5), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 2.2, 1.5), 0.05);
      } else if (cameraMode === 'close') {
        camera.position.lerp(new THREE.Vector3(0.2, 3.85, 2.2), 0.05);
        controls.target.lerp(new THREE.Vector3(0, 3.85, 0.1), 0.05);
      } else if (cameraMode === 'top') {
        camera.position.lerp(new THREE.Vector3(0, 11, 3), 0.04);
        controls.target.lerp(new THREE.Vector3(0, 1.5, 0), 0.05);
      }

      controls.update();
      composer.render();
    }

    animate();

    /* =========================================================================
       EVENT LISTENERS & UI BINDINGS
       ========================================================================= */
    document.getElementById('btnIdle').addEventListener('click', () => setState(STATES.IDLE));
    document.getElementById('btnEruption').addEventListener('click', () => setState(STATES.ERUPTION));
    document.getElementById('btnBlades').addEventListener('click', () => setState(STATES.BLADES));
    document.getElementById('btnBarrage').addEventListener('click', () => setState(STATES.BARRAGE));
    document.getElementById('btnShield').addEventListener('click', () => setState(STATES.SHIELD));

    // Omnitrix Badge interaction
    document.getElementById('omnitrixLogo').addEventListener('click', () => {
      sounds.playOmnitrixChirp();
      triggerFlash(0.3);
      const sequence = [STATES.IDLE, STATES.ERUPTION, STATES.BLADES, STATES.BARRAGE, STATES.SHIELD];
      const next = sequence[(sequence.indexOf(currentState) + 1) % sequence.length];
      setState(next);
    });

    // Camera preset buttons
    document.getElementById('camFront').addEventListener('click', () => cameraMode = 'front');
    document.getElementById('camBack').addEventListener('click', () => cameraMode = 'back');
    document.getElementById('camAction').addEventListener('click', () => cameraMode = 'action');
    document.getElementById('camClose').addEventListener('click', () => cameraMode = 'close');
    document.getElementById('camTop').addEventListener('click', () => cameraMode = 'top');

    // Audio Toggle
    const audioToggle = document.getElementById('audioToggle');
    audioToggle.addEventListener('click', () => {
      sounds.enabled = !sounds.enabled;
      audioToggle.innerHTML = sounds.enabled 
        ? '<span id="audioIcon">🔊</span> SOUND ON' 
        : '<span id="audioIcon">🔇</span> SOUND MUTED';
      if (sounds.enabled) sounds.playOmnitrixChirp();
    });

    // Real-Time Brightness Slider
    const brightnessSlider = document.getElementById('brightnessSlider');
    brightnessSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      renderer.toneMappingExposure = val;
    });

    // Handle Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('pointerdown', () => sounds.init(), { once: true });
  </script>
</body>
</html>
