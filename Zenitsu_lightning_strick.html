<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder Breathing: First Form - Micro-Voxel Zenitsu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%);
        }
        #speed-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 11;
            opacity: 0;
        }
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }
        #ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            z-index: 20;
        }
        button {
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #fa8f15;
            padding: 16px 36px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.2), transparent);
            transition: left 0.5s ease;
        }
        button:hover:not(:disabled) {
            border-color: #faa215;
            box-shadow: 0 0 45px rgba(250, 204, 21, 0.5), inset 0 0 20px rgba(250, 204, 21, 0.2);
            transform: translateY(-2px);
            color: #fff;
            text-shadow: 0 0 10px #fa9715;
        }
        button:hover:not(:disabled)::before {
            left: 100%;
        }
        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(250, 204, 21, 0.1);
        }
        
        #text-overlay, #text-overlay-2, #text-overlay-3 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5vw;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1.5vw;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            font-style: italic;
            text-shadow: 0 0 20px #fac415, 0 0 40px #faae15, 0 0 80px #ea580c;
            white-space: nowrap;
        }
        #text-overlay-3 {
            font-size: 6vw;
            color: #fa9715;
            text-shadow: 0 0 30px #fff, 0 0 60px #fa9715, 0 0 100px #ea580c;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="vignette"></div>
    <canvas id="speed-lines"></canvas>
    <div id="flash-overlay"></div>
    
    <div id="text-overlay">THUNDER BREATHING...</div>
    <div id="text-overlay-2">FIRST FORM</div>
    <div id="text-overlay-3">THUNDERCLAP AND FLASH!</div>

    <div id="ui-container">
        <button id="trigger-btn">EXECUTE STRIKE</button>
        <button id="trigger-btn-six">SIXFOLD &middot; RENGOKU BURST</button>
    </div>

    <script>
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.03);

        const cameraContainer = new THREE.Group();
        scene.add(cameraContainer);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 1.5, 7);
        cameraContainer.add(camera);
        
        const cameraTarget = new THREE.Vector3(0, 1, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; // Lowered to prevent washing out colors
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        // --- POST-PROCESSING (BLOOM) ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.2, 0.5, 0.85 // Much higher threshold so only ACTUAL glowing effects (particles/sword/eyes) bloom, not the character models
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- LIGHTING ---
        scene.add(new THREE.AmbientLight(0x2a1f1a, 1.5)); // Warmer ambient light to match anime tones
        
        const moonLight = new THREE.DirectionalLight(0xffedd5, 1.8); // Warm, pale orange moonlight
        moonLight.position.set(-10, 15, -10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.set(2048, 2048);
        moonLight.shadow.camera.left = -10;
        moonLight.shadow.camera.right = 10;
        moonLight.shadow.camera.top = 10;
        moonLight.shadow.camera.bottom = -10;
        scene.add(moonLight);

        const rimLight = new THREE.DirectionalLight(0xfcd34d, 2.5);
        rimLight.position.set(10, 5, 10);
        scene.add(rimLight);

        const underLight = new THREE.PointLight(0xffea00, 0, 8, 2);
        underLight.position.set(0, 0.3, 3.5);
        scene.add(underLight);

        // --- ENVIRONMENT ---
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(100, 100, 0x1e293b, 0x0a101f);
        gridHelper.position.y = 0.001;
        scene.add(gridHelper);

        // --- MICRO-VOXEL SYSTEM ---
        const CS = 0.03; 
        const microCubeGeo = new THREE.BoxGeometry(CS, CS, CS);
        microCubeGeo.scale(0.94, 0.94, 0.94); 

        const palette = {
            yellow: new THREE.MeshStandardMaterial({ color: 0xffb703, roughness: 0.7, metalness: 0.1 }), // Rich, deep anime yellow
            orange: new THREE.MeshStandardMaterial({ color: 0xe85d04, roughness: 0.7 }), // Intense orange
            white:  new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.9 }), 
            black:  new THREE.MeshStandardMaterial({ color: 0x1f1715, roughness: 0.9 }), // Dark warm brown/black for the uniform
            skin:   new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.5 }), // Warmer skin tone
            brown:  new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.9 }), 
            gold:   new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 1.0, roughness: 0.2 }),
            steel:  new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 1.0, roughness: 0.3 }),
            bladeOrange: new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xff7700, emissiveIntensity: 3.5 }),
            hairShade: new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.7 }), // subtle warm orange shading for hair
            capeShade: new THREE.MeshStandardMaterial({ color: 0xfb923c, roughness: 0.7 }) // subtle warm orange shading for the haori/cape
        };

        function createVoxelPart(group, w, h, d, colorFunc) {
            for(let x=0; x<w; x++) {
                for(let y=0; y<h; y++) {
                    for(let z=0; z<d; z++) {
                        if(x===0 || x===w-1 || y===0 || y===h-1 || z===0 || z===d-1) {
                            const mat = colorFunc(x, y, z, w, h, d);
                            if (mat) {
                                const mesh = new THREE.Mesh(microCubeGeo, mat);
                                mesh.castShadow = true;
                                mesh.receiveShadow = true;
                                mesh.position.set((x - w/2 + 0.5)*CS, (y - h/2 + 0.5)*CS, (z - d/2 + 0.5)*CS);
                                mesh.matrixAutoUpdate = false;
                                mesh.updateMatrix();
                                group.add(mesh);
                            }
                        }
                    }
                }
            }
        }

        // --- ZENITSU PERFECTED MINECRAFT PROPORTIONS ---
        const zenitsu = new THREE.Group();
        scene.add(zenitsu);

        // Body
        const body = new THREE.Group();
        zenitsu.add(body);
        const bodyMesh = new THREE.Group();
        bodyMesh.position.y = (12/2)*CS; 
        body.add(bodyMesh);
        createVoxelPart(bodyMesh, 8, 12, 4, (x, y, z) => {
            if (y < 2) return palette.white;
            if (z === 3 && x === 3 && (y===4 || y===7 || y===10)) return palette.gold;
            return palette.black;
        });

        // Haori Cape
        const haoriMesh = new THREE.Group();
        haoriMesh.position.y = (14/2 - 1)*CS; 
        body.add(haoriMesh);
        createVoxelPart(haoriMesh, 10, 14, 6, (x, y, z, w, h, d) => {
            if (z === d-1 && x >= 2 && x <= 7) return null;
            if (y === h-1 && x >= 3 && x <= 6 && z >= 1 && z <= 4) return null;
            if (y < 2) return (x + z) % 2 === 0 ? palette.white : palette.orange;
            if (y < 5) return palette.orange;
            // Warm-orange shading worked into the yellow field of the cape:
            // a solid transition band right above the orange base, plus
            // streaks running up the cape and heavier shading along the edges/back.
            if (y < 7) return palette.capeShade;
            if (x === 0 || x === w-1 || z === 0) return (y % 2 === 0) ? palette.capeShade : palette.yellow;
            if ((x + z) % 3 === 0) return palette.capeShade;
            return palette.yellow;
        });

        // Head
        const head = new THREE.Group();
        head.position.y = 12*CS; 
        body.add(head);
        const headMesh = new THREE.Group();
        headMesh.position.y = (8/2)*CS;
        head.add(headMesh);
        createVoxelPart(headMesh, 8, 8, 8, (x, y, z, w, h, d) => {
            if (z === d-1) {
                if (y >= 1 && y <= 6 && x >= 1 && x <= 6) {
                    if (y === 4 && (x === 2 || x === 5)) return palette.black;
                    if (y === 5 && (x === 2 || x === 5)) return palette.orange;
                    return palette.skin;
                }
                if (y > 6) return (x + z) % 2 === 0 ? palette.hairShade : palette.yellow;
            }
            if (y === h-1) return (x + z) % 2 === 0 ? palette.yellow : palette.hairShade;
            if (z === 0) return palette.orange;
            if (x === 0 || x === w-1) return y < 4 ? palette.orange : palette.yellow;
            return palette.skin;
        });

        // Spiky Hair
        for(let i=0; i<28; i++) {
            const px = (Math.random() - 0.5) * 10;
            const py = 4 + Math.random() * 6;
            const pz = (Math.random() - 0.5) * 10;
            if (py > 6 || pz < -3 || Math.abs(px) > 3.5) {
                // Blend a clearly visible amount of orange shading among the yellow spikes
                let spikeColor;
                if (py < 6 || pz < -3) {
                    spikeColor = palette.orange;
                } else {
                    spikeColor = (i % 2 === 0) ? palette.hairShade : palette.yellow;
                }
                const spike = new THREE.Mesh(microCubeGeo, spikeColor);
                spike.castShadow = true;
                spike.position.set(px*CS, py*CS, pz*CS);
                spike.matrixAutoUpdate = false; spike.updateMatrix();
                headMesh.add(spike);
            }
        }

        // Legs
        const legColor = (x, y, z, w, h, d) => {
            if (y === 0) return palette.brown;
            if (y === 1 || y === 2) {
                if (z === d-1 || z === 0) return palette.brown;
                return palette.white;
            }
            if (y < 6) return palette.white;
            return palette.black;
        };

        const leftLeg = new THREE.Group();
        leftLeg.position.set(2*CS, 0, 0); 
        zenitsu.add(leftLeg);
        const leftLegMesh = new THREE.Group();
        leftLegMesh.position.y = -(12/2)*CS;
        leftLeg.add(leftLegMesh);
        createVoxelPart(leftLegMesh, 4, 12, 4, legColor);

        const rightLeg = new THREE.Group();
        rightLeg.position.set(-2*CS, 0, 0); 
        zenitsu.add(rightLeg);
        const rightLegMesh = new THREE.Group();
        rightLegMesh.position.y = -(12/2)*CS;
        rightLeg.add(rightLegMesh);
        createVoxelPart(rightLegMesh, 4, 12, 4, legColor);

        // Arms
        const sleeveColor = (x, y, z, w, h, d) => {
            if (y === 0 && x >= 1 && x <= 4 && z >= 1 && z <= 4) return null;
            if (y < 2) return (x + z) % 2 === 0 ? palette.white : palette.orange;
            if (y < 4) return palette.orange;
            return palette.yellow;
        };

        const leftArm = new THREE.Group();
        leftArm.position.set(5*CS, 10*CS, 0); 
        body.add(leftArm);
        const leftSleeveMesh = new THREE.Group();
        leftSleeveMesh.position.y = -(10/2)*CS;
        leftArm.add(leftSleeveMesh);
        createVoxelPart(leftSleeveMesh, 6, 10, 6, sleeveColor);
        const leftHand = new THREE.Mesh(microCubeGeo, palette.skin);
        leftHand.scale.set(2, 3, 2); leftHand.castShadow = true;
        leftHand.position.y = -11.5*CS;
        leftArm.add(leftHand);

        const rightArm = new THREE.Group();
        rightArm.position.set(-5*CS, 10*CS, 0); 
        body.add(rightArm);
        const rightSleeveMesh = new THREE.Group();
        rightSleeveMesh.position.y = -(10/2)*CS;
        rightArm.add(rightSleeveMesh);
        createVoxelPart(rightSleeveMesh, 6, 10, 6, sleeveColor);
        const rightHand = new THREE.Mesh(microCubeGeo, palette.skin);
        rightHand.scale.set(2, 3, 2); rightHand.castShadow = true;
        rightHand.position.y = -11.5*CS;
        rightArm.add(rightHand);

        // Scabbard
        const scabbard = new THREE.Group();
        scabbard.position.set(4.5*CS, 2*CS, 0); 
        body.add(scabbard);
        const scabbardMesh = new THREE.Group();
        scabbardMesh.position.y = -4*CS;
        scabbardMesh.position.z = -2*CS;
        scabbard.add(scabbardMesh);
        createVoxelPart(scabbardMesh, 2, 16, 3, () => palette.black);
        
        const scabbardRing = new THREE.Mesh(microCubeGeo, palette.gold);
        scabbardRing.scale.set(3, 1, 4);
        scabbardRing.position.set(0, 4*CS, -2*CS); 
        scabbard.add(scabbardRing);

        // Katana (Curved structure based on user's reference)
        const katana = new THREE.Group();
        katana.position.set(0, 4.5*CS, -2*CS); 
        scabbard.add(katana);

        const blade = new THREE.Group();
        blade.position.y = -7*CS;
        katana.add(blade);
        
        const bladeSegments = 16;
        for (let i = 0; i < bladeSegments; i++) {
            const segY = (i - bladeSegments/2 + 0.5) * CS;
            const zOff = Math.pow(i / bladeSegments, 2) * CS * 1.5; // Curved backward
            
            const m1 = new THREE.Mesh(microCubeGeo, palette.steel);
            m1.position.set(0, segY, zOff);
            m1.castShadow = true; m1.receiveShadow = true;
            m1.matrixAutoUpdate = false; m1.updateMatrix();
            blade.add(m1);

            const m2 = new THREE.Mesh(microCubeGeo, palette.bladeOrange);
            m2.position.set(0, segY, zOff - CS); // glowing sharp edge
            m2.castShadow = true; m2.receiveShadow = true;
            m2.matrixAutoUpdate = false; m2.updateMatrix();
            blade.add(m2);
        }

        const tsuba = new THREE.Mesh(microCubeGeo, palette.gold);
        tsuba.scale.set(4, 1, 4);
        tsuba.castShadow = true;
        katana.add(tsuba);

        const handle = new THREE.Group();
        handle.position.y = 3.5*CS;
        katana.add(handle);
        createVoxelPart(handle, 1, 6, 2, () => palette.white);

        // --- DEMON ENEMY SETUP ---
        const demonPalette = {
            skin: new THREE.MeshStandardMaterial({ color: 0xbe123c, roughness: 0.6 }), 
            pants: new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.9 }),
            eye: new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 6 }), // Only eyes glow
            horn: new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.8 })
        };

        const enemyCenter = new THREE.Vector3(0, 14*CS*1.5, -8);
        const demon = new THREE.Group();
        demon.position.copy(enemyCenter);
        demon.scale.set(1.5, 1.5, 1.5);
        scene.add(demon);

        const demonLower = new THREE.Group();
        demon.add(demonLower);
        const demonUpper = new THREE.Group();
        demon.add(demonUpper);

        const dLeftLeg = new THREE.Group();
        dLeftLeg.position.set(3*CS, -(14/2)*CS, 0);
        demonLower.add(dLeftLeg);
        createVoxelPart(dLeftLeg, 5, 14, 5, () => demonPalette.pants);

        const dRightLeg = new THREE.Group();
        dRightLeg.position.set(-3*CS, -(14/2)*CS, 0);
        demonLower.add(dRightLeg);
        createVoxelPart(dRightLeg, 5, 14, 5, () => demonPalette.pants);

        const dBody = new THREE.Group();
        dBody.position.y = (14/2)*CS;
        demonUpper.add(dBody);
        createVoxelPart(dBody, 12, 14, 6, (x, y) => y < 4 ? demonPalette.pants : demonPalette.skin);

        const dHead = new THREE.Group();
        dHead.position.y = 14*CS + 4*CS;
        demonUpper.add(dHead);
        createVoxelPart(dHead, 8, 8, 8, (x, y, z, w, h, d) => {
            if (z === d-1 && y === 4 && (x === 2 || x === 5)) return demonPalette.eye;
            return demonPalette.skin;
        });

        const lHorn = new THREE.Mesh(microCubeGeo, demonPalette.horn);
        lHorn.scale.set(2, 4, 2); lHorn.position.set(3*CS, 6*CS, 0); dHead.add(lHorn);
        const rHorn = new THREE.Mesh(microCubeGeo, demonPalette.horn);
        rHorn.scale.set(2, 4, 2); rHorn.position.set(-3*CS, 6*CS, 0); dHead.add(rHorn);

        const dLeftArm = new THREE.Group(); dLeftArm.position.set(8*CS, 12*CS, 0); demonUpper.add(dLeftArm);
        const dLeftArmMesh = new THREE.Group(); dLeftArmMesh.position.y = -8*CS; dLeftArm.add(dLeftArmMesh);
        createVoxelPart(dLeftArmMesh, 4, 16, 4, () => demonPalette.skin);

        const dRightArm = new THREE.Group(); dRightArm.position.set(-8*CS, 12*CS, 0); demonUpper.add(dRightArm);
        const dRightArmMesh = new THREE.Group(); dRightArmMesh.position.y = -8*CS; dRightArm.add(dRightArmMesh);
        createVoxelPart(dRightArmMesh, 4, 16, 4, () => demonPalette.skin);

        dLeftArm.rotation.set(-0.4, 0, 0.2);
        dRightArm.rotation.set(-0.4, 0, -0.2);
        demonUpper.rotation.x = 0.2;

        // --- VISUAL EFFECTS SETUP ---
        const chargeGeo = new THREE.BufferGeometry();
        const chargeCount = 800;
        const chargePos = new Float32Array(chargeCount * 3);
        for(let i=0; i<chargeCount; i++) {
            chargePos[i*3] = (Math.random()-0.5)*5;
            chargePos[i*3+1] = (Math.random()-0.5)*5;
            chargePos[i*3+2] = (Math.random()-0.5)*5;
        }
        chargeGeo.setAttribute('position', new THREE.BufferAttribute(chargePos, 3));
        const chargeMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffea00, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        const chargePoints = new THREE.Points(chargeGeo, chargeMat);
        scene.add(chargePoints);

        // --- DYNAMIC LIGHTNING SYSTEM ---
        function spawnLightningTrail(startVec, endVec, colorHex, duration=0.4, thickness=0.04, jitterAmount=0.15) {
            const points = [];
            const segments = 12 + Math.floor(Math.random() * 8);
            const dir = new THREE.Vector3().subVectors(endVec, startVec);
            const len = dir.length();
            const step = dir.clone().divideScalar(segments);
            
            points.push(startVec);
            for (let i = 1; i < segments; i++) {
                const basePoint = startVec.clone().add(step.clone().multiplyScalar(i));
                const jitter = len * jitterAmount; 
                basePoint.x += (Math.random() - 0.5) * jitter;
                basePoint.y += (Math.random() - 0.5) * jitter;
                basePoint.z += (Math.random() - 0.5) * jitter;
                points.push(basePoint);
            }
            points.push(endVec);

            const curve = new THREE.CatmullRomCurve3(points, false, "catmullrom", 0); // 0 tension = sharp jagged lines
            const geo = new THREE.TubeGeometry(curve, segments, thickness, 4, false);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1, blending: THREE.AdditiveBlending });
            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
            
            gsap.to(mat, { opacity: 0, duration: duration, ease: "power2.out", onComplete: () => {
                scene.remove(mesh);
                geo.dispose();
                mat.dispose();
            }});
        }

        // Jagged electricity aura around Zenitsu
        const arcs = new THREE.Group();
        zenitsu.add(arcs);
        const arcMats = [];
        for(let i=0; i<8; i++) {
            const points = [];
            const segments = 12;
            const radius = 0.6 + Math.random()*1.0;
            for(let j=0; j<=segments; j++) {
                const ang = (j/segments) * Math.PI * 2;
                const r = radius + (Math.random()-0.5)*0.5; // jagged radius
                points.push(new THREE.Vector3(Math.cos(ang)*r, (Math.random()-0.5)*0.8, Math.sin(ang)*r));
            }
            const curve = new THREE.CatmullRomCurve3(points, true, "catmullrom", 0);
            const geo = new THREE.TubeGeometry(curve, segments, 0.015, 3, true);
            const mat = new THREE.MeshBasicMaterial({ color: i%2===0 ? 0xffea00 : 0x38bdf8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            arcs.add(mesh);
            arcMats.push({ mesh, mat });
        }

        const ringGeo = new THREE.RingGeometry(0.1, 1.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffea00, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
        const shockwave = new THREE.Mesh(ringGeo, ringMat);
        const shockwaveMat = ringMat;
        shockwave.rotation.x = -Math.PI / 2;
        scene.add(shockwave);

        const slashGeo = new THREE.CylinderGeometry(0.1, 0.1, 14, 16);
        const slashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        const slashCore = new THREE.Mesh(slashGeo, slashMat);
        slashCore.rotation.x = Math.PI / 2;
        scene.add(slashCore);

        const crackGroup = new THREE.Group();
        const crackMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
        for (let i = 0; i < 10; i++) {
            const len = 0.5 + Math.random() * 1.1;
            const crackGeo = new THREE.PlaneGeometry(0.025, len);
            const crack = new THREE.Mesh(crackGeo, crackMat);
            const ang = (i / 10) * Math.PI * 2 + Math.random() * 0.3;
            crack.rotation.x = -Math.PI / 2;
            crack.rotation.z = ang;
            crack.position.set(Math.cos(ang) * len * 0.4, 0.02, Math.sin(ang) * len * 0.4);
            crackGroup.add(crack);
        }
        crackGroup.position.copy(enemyCenter);
        crackGroup.position.y = 0;
        scene.add(crackGroup);

        const sparkCount = 2400;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPos = new Float32Array(sparkCount * 3);
        const sparkVel = new Float32Array(sparkCount * 3);
        for (let i = 0; i < sparkCount; i++) {
            sparkPos[i * 3] = (Math.random() - 0.5) * 10;
            sparkPos[i * 3 + 1] = Math.random() * 5;
            sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
        }
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
        const sparkMat = new THREE.PointsMaterial({ size: 0.05, color: 0xffea00, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        const sparkSystem = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparkSystem);

        const emberCount = 300;
        const emberGeo = new THREE.BufferGeometry();
        const emberPos = new Float32Array(emberCount * 3);
        for (let i = 0; i < emberCount; i++) {
            emberPos[i * 3] = enemyCenter.x + (Math.random() - 0.5) * 2;
            emberPos[i * 3 + 1] = 0;
            emberPos[i * 3 + 2] = enemyCenter.z + (Math.random() - 0.5) * 2;
        }
        emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
        const emberMat = new THREE.PointsMaterial({ size: 0.03, color: 0xf97316, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        const emberSystem = new THREE.Points(emberGeo, emberMat);
        scene.add(emberSystem);

        const ashGeo = new THREE.BufferGeometry();
        const ashCount = 1200;
        const ashPos = new Float32Array(ashCount * 3);
        const ashVel = [];
        const ashMat = new THREE.PointsMaterial({ size: 0.04, color: 0xf97316, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        const ashPoints = new THREE.Points(ashGeo, ashMat);
        scene.add(ashPoints);
        
        // --- 2D CANVAS SPEED LINES ---
        const speedCanvas = document.getElementById('speed-lines');
        const speedCtx = speedCanvas.getContext('2d');
        function resizeSpeedCanvas() {
            speedCanvas.width = window.innerWidth;
            speedCanvas.height = window.innerHeight;
        }
        resizeSpeedCanvas();
        function drawSpeedLines(alpha) {
            const w = speedCanvas.width, h = speedCanvas.height;
            speedCtx.clearRect(0, 0, w, h);
            if (alpha <= 0) return;
            const cx = w / 2, cy = h / 2;
            speedCtx.strokeStyle = `rgba(230,240,255,${alpha})`;
            speedCtx.lineWidth = 2;
            for (let i = 0; i < 50; i++) {
                const ang = Math.random() * Math.PI * 2;
                const rInner = 80 + Math.random() * 60;
                const rOuter = rInner + 300 + Math.random() * 300;
                speedCtx.beginPath();
                speedCtx.moveTo(cx + Math.cos(ang) * rInner, cy + Math.sin(ang) * rInner);
                speedCtx.lineTo(cx + Math.cos(ang) * rOuter, cy + Math.sin(ang) * rOuter);
                speedCtx.stroke();
            }
        }

        // --- HELPERS ---
        function resetAsh() {
            for(let i=0; i<ashCount; i++) {
                ashPos[i*3] = (Math.random()-0.5)*2.5;
                ashPos[i*3+1] = Math.random()*2.5 + 0.5;
                ashPos[i*3+2] = (Math.random()-0.5)*2.0 - 8;
                ashVel[i] = { x: (Math.random()-0.5)*4, y: Math.random()*5, z: (Math.random()-0.5)*4 };
            }
            ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos, 3));
        }

        function burstSparksAt(target, speedMin = 5, speedMax = 21) {
            const positions = sparkGeo.attributes.position.array;
            for (let i = 0; i < sparkCount; i++) {
                positions[i * 3] = target.x;
                positions[i * 3 + 1] = target.y;
                positions[i * 3 + 2] = target.z;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = Math.random() * (speedMax - speedMin) + speedMin;
                sparkVel[i * 3] = Math.sin(phi) * Math.cos(theta) * speed;
                sparkVel[i * 3 + 1] = Math.cos(phi) * speed;
                sparkVel[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;
            }
            sparkGeo.attributes.position.needsUpdate = true;
            sparkMat.opacity = 0.8;
            gsap.to(sparkMat, { opacity: 0, duration: 1.5 });
        }

        function resetScene() {
            zenitsu.position.set(0, 8*CS, 3.5);
            zenitsu.rotation.set(0,0,0);
            leftLeg.rotation.x = -0.3; leftLeg.position.z = 3*CS; 
            rightLeg.rotation.x = 0.4; rightLeg.position.z = -3*CS; 
            body.rotation.x = 0.5;
            head.rotation.x = -0.3; 
            leftArm.rotation.set(-0.2, 0, 0.2); 
            rightArm.rotation.set(0.7, 0, 0.6); 
            scabbard.rotation.x = -0.8;
            katana.position.y = 0; 
            
            demonUpper.visible = true;
            demonLower.visible = true;
            demonUpper.position.set(0, 0, 0);
            demonUpper.rotation.set(0, 0, 0);
            
            crackMat.opacity = 0;
            emberMat.opacity = 0;
            underLight.intensity = 0;
            speedCtx.clearRect(0, 0, speedCanvas.width, speedCanvas.height);
            
            resetAsh();
        }

        let isAnimating = false;
        let ashActive = false;
        resetScene(); // Set initial pose perfectly

        const btn1 = document.getElementById('trigger-btn');
        const btn2 = document.getElementById('trigger-btn-six');

        function setBusy(busy) {
            isAnimating = busy;
            btn1.disabled = busy;
            btn2.disabled = busy;
        }

        // --- ATTACK SEQUENCES ---
        function executeStraightAttack() {
            if(isAnimating) return;
            setBusy(true);
            resetScene();

            document.getElementById('text-overlay-2').textContent = 'FIRST FORM';
            document.getElementById('text-overlay-3').textContent = 'THUNDERCLAP AND FLASH!';

            const tl = gsap.timeline();
            const shakeObj = { val: 0 };

            // Charge
            tl.to(cameraTarget, { x: 0, y: 1.5, z: 3.5, duration: 1.5, ease: "power2.inOut" }, 0);
            tl.to(cameraContainer.position, { x: 1.5, y: -0.5, z: 1.5, duration: 1.5, ease: "power2.inOut" }, 0);
            tl.to(cameraContainer.rotation, { z: -0.05, duration: 1.5, ease: "power2.inOut" }, 0);
            
            tl.to(zenitsu.position, { y: 6*CS, duration: 1.5, ease: "power1.inOut" }, 0);
            tl.to(body.rotation, { x: 0.7, duration: 1.5, ease: "power1.inOut" }, 0);
            tl.to(head.rotation, { x: -0.5, duration: 1.5, ease: "power1.inOut" }, 0);
            tl.to(scabbard.rotation, { x: -1.0, duration: 1.5, ease: "power1.inOut" }, 0);

            tl.to(underLight, { intensity: 5, duration: 1.5 }, 0);
            tl.to(chargeMat, { opacity: 0.8, duration: 0.5 }, 0);
            tl.to(palette.bladeOrange, { emissiveIntensity: 15, duration: 1.5 }, 0);
            
            tl.to('#text-overlay', { opacity: 1, scale: 1.2, duration: 0.5, ease: "power2.out" }, 0.2);
            tl.to('#text-overlay', { opacity: 0, duration: 0.2 }, 0.8);
            tl.to('#text-overlay-2', { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" }, 0.8);
            tl.to('#text-overlay-2', { opacity: 0, duration: 0.2 }, 1.3);

            tl.to(shakeObj, { val: 1, duration: 1.5, onUpdate: () => {
                const shake = 0.03 * shakeObj.val;
                camera.position.x = 3 + (Math.random()-0.5)*shake; 
                camera.position.y = 1.5 + (Math.random()-0.5)*shake;
            }}, 0);

            arcMats.forEach((a, idx) => {
                tl.to(a.mat, { opacity: 0.8, duration: 0.15, yoyo: true, repeat: 9, delay: idx*0.05 }, 0);
                tl.to(a.mesh.rotation, { x: "+=2", y: "+=2", duration: 1.5 }, 0);
            });
            
            tl.to(bloomPass, { strength: 1.8, threshold: 0.4, duration: 1.5 }, 0); // Modest bloom increase so it doesn't wash out the characters

            // Dash
            const dashTime = 1.5;
            const dashDuration = 0.22; // fast, punchy dash instead of a slow drift
            const arriveTime = dashTime + dashDuration;

            // Launch beat: the physical lunge itself, plus a lightning trail that
            // stretches ahead of him so the eye already knows where he's going
            tl.to(zenitsu.position, { z: -10, duration: dashDuration, ease: "power4.in" }, dashTime);
            tl.to(bloomPass, { strength: 2.2, threshold: 0.3, duration: dashDuration, ease: "power2.in" }, dashTime);

            tl.add(() => {
                gsap.to('#flash-overlay', { opacity: 0.25, duration: 0.06, yoyo: true, repeat: 1 });

                const startP = new THREE.Vector3(0, 0.5, 3.5);
                const endP = new THREE.Vector3(0, 0.5, -10);
                for(let i=0; i<6; i++) {
                    const c = i % 2 === 0 ? 0xffea00 : 0x38bdf8; // Yellow and Cyan mix
                    const s = startP.clone().add(new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, 0));
                    const e = endP.clone().add(new THREE.Vector3((Math.random()-0.5)*4, (Math.random()-0.5)*2, 0));
                    spawnLightningTrail(s, e, c, dashDuration + 0.15, 0.03 + Math.random()*0.06);
                }

                shockwave.position.set(0, 0.1, 3.5);
                shockwave.scale.set(0.1, 0.1, 0.1);
                shockwaveMat.opacity = 1;
                gsap.to(shockwave.scale, { x: 8, y: 8, duration: 0.3, ease: "power2.out" });
                gsap.to(shockwaveMat, { opacity: 0, duration: 0.3, ease: "power2.in" });

                drawSpeedLines(0.95);
                gsap.to(speedCanvas, { opacity: 1, duration: 0.04 });
            }, dashTime);

            // Camera eases (not snaps) into the follow position across the same
            // window as the dash, so it never gets ahead of the character
            tl.to(cameraContainer.position, { x: -2.5, y: 0, z: -14, duration: dashDuration, ease: "power4.in" }, dashTime);
            tl.to(cameraContainer.rotation, { z: 0.08, duration: dashDuration, ease: "power2.in" }, dashTime);
            tl.to(cameraTarget, { x: 0, y: 1, z: -8, duration: dashDuration, ease: "power4.in" }, dashTime);

            // Arrival beat: fires exactly when he lands the strike, so the slash,
            // shockwave, camera, and demon reaction all read as one clean impact
            tl.add(() => {
                camera.position.set(3, 1.5, 7); // reset local shake

                slashCore.position.set(0, 0.5, -3.5);
                slashMat.opacity = 1;
                gsap.to(slashMat, { opacity: 0, duration: 0.4, ease: "power4.out" });
                slashCore.scale.set(0.1, 1, 0.1);
                gsap.to(slashCore.scale, { x: 4, z: 4, duration: 0.2, ease: "power2.out" });

                gsap.to(speedCanvas, { opacity: 0, duration: 0.3, delay: 0.05 });

                burstSparksAt(enemyCenter, 5, 21);
                crackMat.opacity = 1;
                gsap.to(crackMat, { opacity: 0, duration: 2.2, delay: 0.4 });
                emberMat.opacity = 0.9;
                gsap.to(emberMat, { opacity: 0, duration: 2.5, delay: 0.5 });
            }, arriveTime);

            tl.to('#text-overlay-3', { opacity: 1, scale: 1.5, duration: 0.1, ease: "power4.out" }, arriveTime);
            tl.to('#text-overlay-3', { opacity: 0, duration: 0.8 }, arriveTime + 0.5);

            tl.to(chargeMat, { opacity: 0, duration: 0.1 }, dashTime);
            tl.to(underLight, { intensity: 0, duration: 0.1 }, dashTime);
            tl.to(bloomPass, { strength: 1.2, threshold: 0.85, duration: 0.5 }, arriveTime); // Restore normal bloom
            tl.to(palette.bladeOrange, { emissiveIntensity: 2.5, duration: 0.5 }, arriveTime);
            
            // Hold
            tl.to(zenitsu.position, { y: 10*CS, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(body.rotation, { x: 0.2, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(head.rotation, { x: 0, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(leftLeg.rotation, { x: 0, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(rightLeg.rotation, { x: 0, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(leftLeg.position, { z: 0, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(rightLeg.position, { z: 0, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            
            tl.to(rightArm.rotation, { x: 0, z: -0.8, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);
            tl.to(katana.position, { y: 14*CS, duration: 0.5, ease: "power2.out" }, arriveTime + 0.1); 
            tl.to(scabbard.rotation, { x: -0.2, duration: 1.5, ease: "power1.out" }, arriveTime + 0.1);

            // Sheathe
            const sheatheTime = arriveTime + 2.0;
            tl.add(() => {
                katana.position.y = 0;
                rightArm.rotation.set(0.7, 0, 0.6); 
                scabbard.rotation.x = -0.8;
                body.rotation.x = 0.5;
                zenitsu.position.y = 8*CS;
                leftLeg.rotation.x = -0.3; leftLeg.position.z = 3*CS; 
                rightLeg.rotation.x = 0.4; rightLeg.position.z = -3*CS; 
                
                gsap.to('#flash-overlay', { opacity: 0.8, duration: 0.05, yoyo: true, repeat: 1 });
                
                gsap.to(demonUpper.position, { x: 2, y: -1, z: -2, duration: 0.6, ease: "power2.in" });
                gsap.to(demonUpper.rotation, { z: -0.6, x: 0.4, duration: 0.6, ease: "power2.in" });
            }, sheatheTime);

            // Ash
            tl.add(() => {
                ashActive = true;
                ashMat.opacity = 1;
                demonUpper.visible = false;
                demonLower.visible = false;
                gsap.to(ashMat, { opacity: 0, duration: 1.5, ease: "power2.in", onComplete: () => { ashActive = false; } });
            }, sheatheTime + 0.6);

            // Return
            tl.to(cameraContainer.position, { x: 0, y: 0, z: 0, duration: 2.0, ease: "power2.inOut" }, sheatheTime + 1.5);
            tl.to(cameraContainer.rotation, { z: 0, duration: 2.0, ease: "power2.inOut" }, sheatheTime + 1.5);
            tl.to(cameraTarget, { x: 0, y: 1, z: 3.5, duration: 2.0, ease: "power2.inOut" }, sheatheTime + 1.5);
            
            tl.add(() => {
                setBusy(false);
                resetScene();
            }, sheatheTime + 3.5);
        }

        function executeSixfoldAttack() {
            if(isAnimating) return;
            setBusy(true);
            resetScene();

            document.getElementById('text-overlay-2').textContent = 'SIXFOLD';
            document.getElementById('text-overlay-3').textContent = 'RENGOKU BURST!';

            const tl = gsap.timeline();
            const shakeObj = { val: 0 };

            // Charge
            tl.to(cameraTarget, { x: 0, y: 1.5, z: 3.5, duration: 1.5, ease: "power2.inOut" }, 0);
            tl.to(cameraContainer.position, { x: 1.5, y: -0.5, z: 1.5, duration: 1.5, ease: "power2.inOut" }, 0);
            tl.to(cameraContainer.rotation, { z: -0.05, duration: 1.5, ease: "power2.inOut" }, 0);
            
            tl.to(zenitsu.position, { y: 6*CS, duration: 1.5, ease: "power1.inOut" }, 0);
            tl.to(body.rotation, { x: 0.7, duration: 1.5, ease: "power1.inOut" }, 0);
            tl.to(head.rotation, { x: -0.5, duration: 1.5, ease: "power1.inOut" }, 0);
            tl.to(scabbard.rotation, { x: -1.0, duration: 1.5, ease: "power1.inOut" }, 0);

            tl.to(underLight, { intensity: 5, duration: 1.5 }, 0);
            tl.to(chargeMat, { opacity: 0.8, duration: 0.5 }, 0);
            tl.to(palette.bladeOrange, { emissiveIntensity: 15, duration: 1.5 }, 0);
            
            tl.to('#text-overlay', { opacity: 1, scale: 1.2, duration: 0.5, ease: "power2.out" }, 0.2);
            tl.to('#text-overlay', { opacity: 0, duration: 0.2 }, 0.8);
            tl.to('#text-overlay-2', { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" }, 0.8);
            tl.to('#text-overlay-2', { opacity: 0, duration: 0.2 }, 1.3);

            tl.to(shakeObj, { val: 1, duration: 1.5, onUpdate: () => {
                const shake = 0.03 * shakeObj.val;
                camera.position.x = 3 + (Math.random()-0.5)*shake; 
                camera.position.y = 1.5 + (Math.random()-0.5)*shake;
            }}, 0);

            arcMats.forEach((a, idx) => {
                tl.to(a.mat, { opacity: 0.8, duration: 0.15, yoyo: true, repeat: 9, delay: idx*0.05 }, 0);
                tl.to(a.mesh.rotation, { x: "+=2", y: "+=2", duration: 1.5 }, 0);
            });
            
            tl.to(bloomPass, { strength: 1.8, threshold: 0.4, duration: 1.5 }, 0); // Modest bloom increase so it doesn't wash out the characters

            // Burst
            const dashTime = 1.5;
            const hitCount = 6;
            
            let prevPos = new THREE.Vector3(0, 6*CS, 3.5);

            tl.add(() => {
                cameraContainer.position.set(0, 1.5, -3);
                cameraContainer.rotation.z = 0;
                cameraTarget.set(0, 1, -8); 
                camera.position.set(3, 1.5, 7);
                
                // Keep speed lines intense during the whole burst
                drawSpeedLines(0.9);
            }, dashTime);

            for (let i = 0; i < hitCount; i++) {
                const ang = (i / hitCount) * Math.PI * 2;
                const radius = 4.0;
                const hx = Math.cos(ang) * radius;
                const hz = -8 + Math.sin(ang) * radius;

                // Slower animation slide so the user can easily track him jumping around the demon
                tl.to(zenitsu.position, { x: hx, z: hz, duration: 0.15, ease: "power2.out" }, dashTime + (i * 0.2));

                tl.add(() => {
                    const nextPos = new THREE.Vector3(hx, 6*CS, hz);
                    // Spawn jagged lightning between his previous position and current strike position
                    spawnLightningTrail(prevPos, nextPos, 0xffea00, 0.35, 0.06, 0.2);
                    spawnLightningTrail(prevPos, nextPos, 0x38bdf8, 0.4, 0.03, 0.15); // Thin cyan core
                    prevPos.copy(nextPos);

                    gsap.to('#flash-overlay', { opacity: 0.3, duration: 0.05, yoyo: true, repeat: 1 });
                    const shake = 0.15;
                    camera.position.x = 3 + (Math.random()-0.5)*shake;
                    camera.position.y = 1.5 + (Math.random()-0.5)*shake;
                    
                    underLight.position.set(0, 1, -8); 
                    underLight.intensity = 5;
                    gsap.to(underLight, { intensity: 0, duration: 0.2 });
                    
                    zenitsu.lookAt(0, 6*CS, -8);
                    
                    // Draw sword mid-slash
                    katana.position.y = 14*CS;
                    rightArm.rotation.set(0, 0, -0.8);
                    
                    const hitPoint = new THREE.Vector3(hx*0.3, 1, -8 + Math.sin(ang)*0.5);
                    burstSparksAt(hitPoint, 6, 20);
                    
                    gsap.to(speedCanvas, { opacity: 0.8, duration: 0.03, yoyo: true, repeat: 1 });
                    gsap.to(demonUpper.rotation, { z: (Math.random() - 0.5) * 0.5, x: (Math.random() - 0.5) * 0.5, duration: 0.2 });
                }, dashTime + (i * 0.2));
            }
            
            const finishTime = dashTime + (hitCount * 0.2);
            
            tl.add(() => {
                const finalPos = new THREE.Vector3(0, 6*CS, -12);
                spawnLightningTrail(prevPos, finalPos, 0xffea00, 0.5, 0.08, 0.25);
                spawnLightningTrail(prevPos, finalPos, 0x38bdf8, 0.5, 0.04, 0.2);

                gsap.to('#flash-overlay', { opacity: 0.9, duration: 0.05, yoyo: true, repeat: 1 });
                camera.position.set(3, 1.5, 7); 
                cameraContainer.position.set(-2.5, 0, -14); 
                cameraContainer.rotation.z = 0.08; 
                cameraTarget.set(0, 1, -8);
                
                burstSparksAt(enemyCenter, 10, 30);
                crackMat.opacity = 1;
                gsap.to(crackMat, { opacity: 0, duration: 2.2, delay: 0.4 });
                emberMat.opacity = 1;
                gsap.to(emberMat, { opacity: 0, duration: 2.5, delay: 0.5 });
                gsap.to(speedCanvas, { opacity: 0, duration: 0.3 });
                
                zenitsu.position.copy(finalPos);
                zenitsu.rotation.set(0, Math.PI, 0); 
                
                // Shockwave on final landing
                shockwave.position.set(0, 0.1, -12);
                shockwave.scale.set(0.1, 0.1, 0.1);
                shockwaveMat.opacity = 1;
                gsap.to(shockwave.scale, { x: 10, y: 10, duration: 0.3, ease: "power2.out" });
                gsap.to(shockwaveMat, { opacity: 0, duration: 0.3, ease: "power2.in" });
            }, finishTime);

            tl.to('#text-overlay-3', { opacity: 1, scale: 1.5, duration: 0.1, ease: "power4.out" }, finishTime);
            tl.to('#text-overlay-3', { opacity: 0, duration: 0.8 }, finishTime + 0.5);

            tl.to(chargeMat, { opacity: 0, duration: 0.1 }, finishTime);
            tl.to(bloomPass, { strength: 1.2, threshold: 0.85, duration: 0.5 }, finishTime); // Restore normal bloom
            tl.to(palette.bladeOrange, { emissiveIntensity: 2.5, duration: 0.5 }, finishTime);
            
            // Hold
            tl.to(zenitsu.position, { y: 10*CS, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(body.rotation, { x: 0.2, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(head.rotation, { x: 0, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(leftLeg.rotation, { x: 0, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(rightLeg.rotation, { x: 0, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(leftLeg.position, { z: 0, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(rightLeg.position, { z: 0, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            
            tl.to(rightArm.rotation, { x: 0, z: -0.8, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);
            tl.to(katana.position, { y: 14*CS, duration: 0.5, ease: "power2.out" }, finishTime + 0.1); 
            tl.to(scabbard.rotation, { x: -0.2, duration: 1.5, ease: "power1.out" }, finishTime + 0.1);

            // Sheathe
            const sheatheTime = finishTime + 2.0;
            tl.add(() => {
                katana.position.y = 0;
                rightArm.rotation.set(0.7, 0, 0.6); 
                scabbard.rotation.x = -0.8;
                body.rotation.x = 0.5;
                zenitsu.position.y = 8*CS;
                leftLeg.rotation.x = -0.3; leftLeg.position.z = 3*CS; 
                rightLeg.rotation.x = 0.4; rightLeg.position.z = -3*CS; 
                
                gsap.to('#flash-overlay', { opacity: 0.8, duration: 0.05, yoyo: true, repeat: 1 });
                
                gsap.to(demonUpper.position, { x: 2, y: -1, z: -2, duration: 0.6, ease: "power2.in" });
                gsap.to(demonUpper.rotation, { z: -0.6, x: 0.4, duration: 0.6, ease: "power2.in" });
            }, sheatheTime);

            // Ash
            tl.add(() => {
                ashActive = true;
                ashMat.opacity = 1;
                demonUpper.visible = false;
                demonLower.visible = false;
                gsap.to(ashMat, { opacity: 0, duration: 1.5, ease: "power2.in", onComplete: () => { ashActive = false; } });
            }, sheatheTime + 0.6);

            // Return
            tl.to(cameraContainer.position, { x: 0, y: 0, z: 0, duration: 2.0, ease: "power2.inOut" }, sheatheTime + 1.5);
            tl.to(cameraContainer.rotation, { z: 0, duration: 2.0, ease: "power2.inOut" }, sheatheTime + 1.5);
            tl.to(cameraTarget, { x: 0, y: 1, z: 3.5, duration: 2.0, ease: "power2.inOut" }, sheatheTime + 1.5);
            
            tl.add(() => {
                setBusy(false);
                resetScene();
            }, sheatheTime + 3.5);
        }

        btn1.addEventListener('click', executeStraightAttack);
        btn2.addEventListener('click', executeSixfoldAttack);

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            camera.lookAt(cameraTarget);

            if (!isAnimating) {
                haoriMesh.rotation.z = Math.sin(time * 1.6) * 0.025;
                zenitsu.position.y = 8*CS + Math.sin(time * 2.2) * 0.006;
                chargePoints.position.set(0, 0, 3.5); // stick to origin
            } else {
                haoriMesh.rotation.z = Math.sin(time * 8) * 0.05;
                chargePoints.position.copy(zenitsu.position); // follow zenitsu
            }

            if (chargeMat.opacity > 0) {
                const pos = chargeGeo.attributes.position.array;
                for (let i = 0; i < chargeCount; i++) {
                    pos[i*3+1] += delta * 3;
                    if (pos[i*3+1] > 2) pos[i*3+1] = -1;
                    pos[i*3] += (Math.random()-0.5)*0.08;
                    pos[i*3+2] += (Math.random()-0.5)*0.08;
                }
                chargeGeo.attributes.position.needsUpdate = true;
            }

            if (ashActive) {
                const pos = ashGeo.attributes.position.array;
                for (let i = 0; i < ashCount; i++) {
                    pos[i*3] += ashVel[i].x * delta;
                    pos[i*3+1] += ashVel[i].y * delta;
                    pos[i*3+2] += ashVel[i].z * delta;
                    ashVel[i].x += (Math.random()-0.5)*0.2;
                    ashVel[i].y -= delta * 3; // Gravity
                }
                ashGeo.attributes.position.needsUpdate = true;
            }

            if (emberMat.opacity > 0) {
                const ep = emberGeo.attributes.position.array;
                for (let i = 0; i < emberCount; i++) {
                    ep[i * 3 + 1] += delta * (0.3 + Math.sin(time * 3 + i) * 0.1);
                    ep[i * 3] += Math.sin(time * 2 + i) * 0.001;
                }
                emberGeo.attributes.position.needsUpdate = true;
            }

            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            resizeSpeedCanvas();
        });
    </script>
</body>
</html>
