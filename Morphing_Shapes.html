<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morphing Shapes</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #label {
    position: fixed; top: 24px; left: 0; right: 0; text-align: center;
    font: 600 22px/1 system-ui, sans-serif; color: #f4d9ff; letter-spacing: .04em;
    pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    font: 14px system-ui, sans-serif; color: #9a86b3; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">Sphere</div>
<div id="hint">Click or tap to morph. Drag to rotate.</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const label = document.getElementById('label');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

const N = 2200;
const R = () => Math.min(W, H) * 0.3;

// Shape generators return unit-scale [x, y, z] for index i
const shapes = [
  { name: 'Sphere', f(i) {
      const k = i + 0.5, phi = Math.acos(1 - 2 * k / N), th = Math.PI * (1 + Math.sqrt(5)) * k;
      return [Math.cos(th) * Math.sin(phi), Math.sin(th) * Math.sin(phi), Math.cos(phi)];
  }},
  { name: 'Torus', f(i) {
      const u = (i % 110) / 110 * Math.PI * 2, v = Math.floor(i / 110) / (N / 110) * Math.PI * 2;
      const r = 1 + 0.38 * Math.cos(v);
      return [r * Math.cos(u) * 0.8, 0.38 * Math.sin(v) * 0.8 * 1.6, r * Math.sin(u) * 0.8];
  }},
  { name: 'Cube', f(i) {
      const s = Math.cbrt(N), a = i % s | 0, b = (i / s | 0) % s | 0, c = (i / (s * s)) | 0;
      const face = i % 6, u = ((i * 0.618) % 1) * 2 - 1, w = ((i * 0.414) % 1) * 2 - 1;
      const p = [[1,u,w],[-1,u,w],[u,1,w],[u,-1,w],[u,w,1],[u,w,-1]][face];
      return p.map(n => n * 0.85);
  }},
  { name: 'Helix', f(i) {
      const t = i / N * Math.PI * 12, strand = i % 2 ? 1 : -1;
      return [Math.cos(t) * 0.55 * strand, (i / N) * 2.2 - 1.1, Math.sin(t) * 0.55 * strand];
  }},
  { name: 'Wave', f(i) {
      const s = Math.sqrt(N) | 0, x = (i % s) / s * 2 - 1, z = ((i / s) | 0) / s * 2 - 1;
      return [x * 1.2, Math.sin(x * 5) * Math.cos(z * 5) * 0.35, z * 1.2];
  }},
];

const pts = [];
for (let i = 0; i < N; i++) {
  const p = shapes[0].f(i);
  pts.push({ x: p[0], y: p[1], z: p[2], tx: p[0], ty: p[1], tz: p[2], hue: i / N * 80 + 280 });
}

let current = 0;
function morph() {
  current = (current + 1) % shapes.length;
  label.textContent = shapes[current].name;
  for (let i = 0; i < N; i++) {
    const p = shapes[current].f(i);
    pts[i].tx = p[0]; pts[i].ty = p[1]; pts[i].tz = p[2];
  }
}

let rotY = 0, rotX = 0.4, velY = 0.004, dragging = false, lastX = 0, lastY = 0, moved = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0; });
addEventListener('pointerup', () => { if (dragging && moved < 5) morph(); dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  rotY += dx * 0.006; rotX += dy * 0.006;
  lastX = e.clientX; lastY = e.clientY;
});

setInterval(morph, 5000);

let t = 0;
function frame() {
  ctx.fillStyle = 'rgba(11, 7, 16, 0.25)';
  ctx.fillRect(0, 0, W, H);
  t += 0.016;
  if (!dragging) rotY += velY;

  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  const scale = R(), cxp = W / 2, cyp = H / 2, breathe = 1 + Math.sin(t * 1.5) * 0.03;

  ctx.globalCompositeOperation = 'lighter';
  for (const p of pts) {
    p.x += (p.tx - p.x) * 0.06;
    p.y += (p.ty - p.y) * 0.06;
    p.z += (p.tz - p.z) * 0.06;

    let x = p.x * cy - p.z * sy;
    let z = p.x * sy + p.z * cy;
    let y = p.y * cx - z * sx;
    z = p.y * sx + z * cx;

    const persp = 2.6 / (2.6 + z);
    const sxp = cxp + x * scale * persp * breathe;
    const syp = cyp + y * scale * persp * breathe;
    const size = Math.max(0.6, 2.2 * persp * persp);
    const alpha = Math.min(1, 0.25 + persp * 0.5);

    ctx.fillStyle = `hsla(${(p.hue + t * 20) % 360}, 90%, 62%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(sxp, syp, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  velY = 0;
}
frame();
</script>
</body>
</html>
