

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doraemon Head</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #183d70 0%,
            #08172c 55%,
            #02050a 100%
        );
}


/* =====================================================
   MAIN CHARACTER
===================================================== */

.doraemon{
    position:relative;

    width:520px;
    height:560px;

    animation:
        floating 3.5s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}


/* =====================================================
   HEAD
===================================================== */

.head{

    position:absolute;

    width:410px;
    height:390px;

    left:55px;
    top:45px;

    background:
        radial-gradient(
            circle at 34% 20%,
            #4bcaff 0%,
            #1aa5ee 35%,
            #0876c7 78%,
            #0566ae 100%
        );

    border:7px solid #101010;

    border-radius:50%;

    z-index:1;

    box-shadow:
        inset -15px -20px 30px rgba(0,0,0,.08),
        0 15px 35px rgba(0,0,0,.25);
}


/* =====================================================
   WHITE FACE
===================================================== */

.face{

    position:absolute;

    width:350px;
    height:300px;

    left:23px;
    top:70px;

    background:
        radial-gradient(
            ellipse at 50% 35%,
            #ffffff 0%,
            #ffffff 72%,
            #eeeeee 100%
        );

    border:5px solid #111;

    border-radius:
        49%
        49%
        50%
        50%;

}


/* =====================================================
   EYES
===================================================== */

.eye{

    position:absolute;

    width:78px;
    height:108px;

    top:-52px;

    background:#fff;

    border:5px solid #111;

    border-radius:50%;

    z-index:10;

    transition:
        height .12s ease,
        top .12s ease;
}

.eye.left{
    left:91px;
}

.eye.right{
    right:91px;
}


/* =====================================================
   PUPILS
===================================================== */

.pupil{

    position:absolute;

    width:27px;
    height:49px;

    left:20px;
    top:30px;

    background:#111;

    border-radius:50%;

}

.pupil::after{

    content:"";

    position:absolute;

    width:9px;
    height:13px;

    left:5px;
    top:5px;

    background:white;

    border-radius:50%;
}


/* =====================================================
   NOSE
===================================================== */

.nose{

    position:absolute;

    width:57px;
    height:57px;

    left:141px;
    top:57px;

    background:
        radial-gradient(
            circle at 32% 25%,
            #ff8585 0%,
            #ef2727 45%,
            #c50000 100%
        );

    border:5px solid #111;

    border-radius:50%;

    z-index:20;

    box-shadow:
        0 2px 5px rgba(0,0,0,.2);
}

.nose::after{

    content:"";

    position:absolute;

    width:11px;
    height:14px;

    left:9px;
    top:7px;

    background:#fff;

    border-radius:50%;
}


/* =====================================================
   NOSE TO MOUTH LINE
===================================================== */

.nose-line{

    position:absolute;

    width:4px;
    height:55px;

    left:167px;
    top:108px;

    background:#111;

    border-radius:3px;

    z-index:12;
}


/* =====================================================
   MOUTH
===================================================== */

.mouth{

    position:absolute;

    width:235px;
    height:132px;

    left:55px;
    top:118px;

    background:#e52227;

    border:5px solid #111;

    border-top:none;

    border-radius:
        0
        0
        120px
        120px;

    overflow:hidden;

    z-index:8;
}


/* Dark upper mouth */

.mouth::before{

    content:"";

    position:absolute;

    width:195px;
    height:63px;

    left:15px;
    top:-31px;

    background:#111;

    border-radius:50%;

}


/* Inner red area */

.mouth::after{

    content:"";

    position:absolute;

    width:205px;
    height:105px;

    left:10px;
    top:12px;

    background:
        linear-gradient(
            to bottom,
            #ed3030,
            #d91b20
        );

    border-radius:
        0
        0
        105px
        105px;

    z-index:0;
}


/* Tongue */

.tongue{

    position:absolute;

    width:132px;
    height:64px;

    left:46px;
    bottom:-19px;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #ff9a87 0%,
            #ff7064 55%,
            #ed514d 100%
        );

    border-radius:
        70px
        70px
        0
        0;

    border-top:4px solid #c83d3a;

    z-index:4;
}

.tongue::after{

    content:"";

    position:absolute;

    width:3px;
    height:25px;

    left:64px;
    top:5px;

    background:rgba(180,45,45,.45);

    border-radius:5px;
}


/* =====================================================
   WHISKERS
===================================================== */

.whisker{

    position:absolute;

    width:92px;
    height:4px;

    background:#111;

    border-radius:5px;

    z-index:30;
}


/* Left */

.w1{
    left:-55px;
    top:116px;
    transform:rotate(12deg);
}

.w2{
    left:-60px;
    top:145px;
}

.w3{
    left:-55px;
    top:174px;
    transform:rotate(-12deg);
}


/* Right */

.w4{
    right:-55px;
    top:116px;
    transform:rotate(-12deg);
}

.w5{
    right:-60px;
    top:145px;
}

.w6{
    right:-55px;
    top:174px;
    transform:rotate(12deg);
}


/* =====================================================
   COLLAR
===================================================== */

.collar{

    position:absolute;

    width:235px;
    height:35px;

    left:142px;
    top:395px;

    background:
        linear-gradient(
            to bottom,
            #ff4242 0%,
            #ed1d24 50%,
            #bd1016 100%
        );

    border:5px solid #111;

    border-radius:22px;

    z-index:15;

    box-shadow:
        0 4px 7px rgba(0,0,0,.3);
}


/* =====================================================
   BELL HOLDER
===================================================== */

.bell-holder{

    position:absolute;

    width:25px;
    height:28px;

    left:247px;
    top:414px;

    background:#d99b00;

    border-left:4px solid #111;
    border-right:4px solid #111;

    z-index:18;

}


/* =====================================================
   BELL
===================================================== */

.bell{

    position:absolute;

    width:70px;
    height:70px;

    left:225px;
    top:428px;

    background:
        radial-gradient(
            circle at 32% 23%,
            #fff8a5 0%,
            #ffdc35 30%,
            #f3b300 68%,
            #c77d00 100%
        );

    border:5px solid #111;

    border-radius:50%;

    z-index:20;

    transform-origin:
        50% -12px;

    animation:
        bellSwing 3.2s ease-in-out infinite;

}


/* Bell shine */

.bell::after{

    content:"";

    position:absolute;

    width:12px;
    height:16px;

    left:11px;
    top:8px;

    background:rgba(255,255,255,.8);

    border-radius:50%;
}


/* Bell horizontal line */

.bell-line{

    position:absolute;

    width:52px;
    height:5px;

    left:4px;
    top:26px;

    background:#111;

    border-radius:5px;
}


/* Bell hole */

.bell-dot{

    position:absolute;

    width:12px;
    height:12px;

    left:23px;
    top:35px;

    background:#111;

    border-radius:50%;
}


/* =====================================================
   BELL SWING
===================================================== */

@keyframes bellSwing{

    0%,100%{
        transform:rotate(0deg);
    }

    20%{
        transform:rotate(5deg);
    }

    40%{
        transform:rotate(-5deg);
    }

    60%{
        transform:rotate(3deg);
    }

    80%{
        transform:rotate(-3deg);
    }

}


/* =====================================================
   BLINK
===================================================== */

.blink .eye{

    height:10px;

    top:5px;

    border-radius:20px;

}

.blink .pupil{
    display:none;
}


/* =====================================================
   TALKING
===================================================== */

.talking .mouth{

    animation:
        talking .18s ease-in-out infinite alternate;
}

@keyframes talking{

    from{
        transform:scaleY(1);
    }

    to{
        transform:scaleY(.65);
    }

}


/* =====================================================
   SURPRISE
===================================================== */

.surprised .mouth{

    width:120px;
    height:145px;

    left:112px;

    border-radius:60px;

    border:5px solid #111;

    background:#111;
}

.surprised .mouth::before,
.surprised .mouth::after{

    display:none;
}

.surprised .tongue{

    bottom:-15px;
}


/* =====================================================
   STARS
===================================================== */

.star{

    position:absolute;

    color:white;

    font-size:24px;

    opacity:.45;

    animation:
        twinkle 2s ease-in-out infinite alternate;
}

.star.one{
    left:20px;
    top:100px;
}

.star.two{
    right:15px;
    top:160px;

    animation-delay:.6s;
}

.star.three{
    left:30px;
    bottom:90px;

    animation-delay:1s;
}

.star.four{
    right:30px;
    bottom:130px;

    animation-delay:1.5s;
}

@keyframes twinkle{

    from{
        opacity:.15;
        transform:scale(.7);
    }

    to{
        opacity:.9;
        transform:scale(1.2);
    }

}


/* =====================================================
   BUTTONS
===================================================== */

.controls{

    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:10px;

    z-index:100;
}

button{

    padding:11px 18px;

    border:2px solid rgba(255,255,255,.55);

    border-radius:25px;

    background:
        rgba(255,255,255,.1);

    color:white;

    font-size:14px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.2s;
}

button:hover{

    background:
        rgba(255,255,255,.25);

    transform:translateY(-2px);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .doraemon{
        transform:scale(.72);
    }

}

@media(max-width:430px){

    .doraemon{
        transform:scale(.57);
    }

    .controls{
        bottom:10px;
    }

    button{
        padding:8px 11px;
        font-size:12px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     DORAEMON
===================================================== -->

<div class="doraemon" id="doraemon">


    <!-- Stars -->

    <div class="star one">✦</div>
    <div class="star two">✦</div>
    <div class="star three">✧</div>
    <div class="star four">✦</div>


    <!-- =================================================
         HEAD
    ================================================== -->

    <div class="head">

        <div class="face">


            <!-- Eyes -->

            <div class="eye left">
                <div class="pupil"></div>
            </div>

            <div class="eye right">
                <div class="pupil"></div>
            </div>


            <!-- Nose -->

            <div class="nose"></div>


            <!-- Nose line -->

            <div class="nose-line"></div>


            <!-- Mouth -->

            <div class="mouth">

                <div class="tongue"></div>

            </div>


            <!-- Whiskers -->

            <div class="whisker w1"></div>
            <div class="whisker w2"></div>
            <div class="whisker w3"></div>

            <div class="whisker w4"></div>
            <div class="whisker w5"></div>
            <div class="whisker w6"></div>


        </div>

    </div>


    <!-- =================================================
         COLLAR
    ================================================== -->

    <div class="collar"></div>


    <!-- Bell holder -->

    <div class="bell-holder"></div>


    <!-- =================================================
         BELL
    ================================================== -->

    <div class="bell">

        <div class="bell-line"></div>

        <div class="bell-dot"></div>

    </div>


</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <button onclick="blink()">
        😉 Blink
    </button>

    <button onclick="talk()">
        🗣️ Talk
    </button>

    <button onclick="surprise()">
        😮 Surprise
    </button>

</div>


<script>

/* =====================================================
   CHARACTER
===================================================== */

const doraemon =
    document.getElementById("doraemon");


/* =====================================================
   BLINK
===================================================== */

function blink(){

    doraemon.classList.add("blink");

    setTimeout(() => {

        doraemon.classList.remove("blink");

    },180);

}


/* =====================================================
   TALK
===================================================== */

function talk(){

    doraemon.classList.remove("talking");

    void doraemon.offsetWidth;

    doraemon.classList.add("talking");

    setTimeout(() => {

        doraemon.classList.remove("talking");

    },1200);

}


/* =====================================================
   SURPRISE
===================================================== */

function surprise(){

    doraemon.classList.add("surprised");

    setTimeout(() => {

        doraemon.classList.remove("surprised");

    },900);

}


/* =====================================================
   AUTOMATIC BLINK
===================================================== */

setInterval(() => {

    if(Math.random() > .25){

        blink();

    }

},3500);


/* =====================================================
   INITIAL BLINK
===================================================== */

setTimeout(() => {

    blink();

},1500);

</script>

</body>
</html>
