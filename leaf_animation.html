<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astral Manifestation (Ultimate Detailed)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #030108;
    overflow: hidden;
    touch-action: none; 
  }
  
  #stage {
    position: fixed; 
    top: 0; 
    left: 0;
    width: 100vw;
    height: 100vh;
  }
  
  canvas {
    position: absolute;
    top: 0; 
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  
  #ui {
    position: absolute;
    bottom: 50px;
    width: 100%;
    text-align: center;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  
  .title {
    font-size: 28px;
    font-weight: 200;
    letter-spacing: 12px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 30px rgba(100, 150, 255, 0.4);
  }
  
  .subtitle {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    animation: pulse 2.5s infinite ease-in-out;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: translateY(0px); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="summonCanvas"></canvas>
  <div id="ui">
    <div class="title">Astral Manifest</div>
    <div class="subtitle">Tap anywhere to channel</div>
  </div>
</div>

<script>
(function() {
const canvas = document.getElementById('summonCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, DPR;

let events = [];
let ambientMotes = [];
let mouse = { x: -1000, y: -1000 };
let bgGrad;
let screenShake = 0;
let currentDim = 0;

const HUE_OPTIONS = [160, 195, 285, 325, 45, 10];
const CIRCLE_CACHES = {};

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  
  bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.9);
  bgGrad.addColorStop(0, '#120b22');
  bgGrad.addColorStop(0.6, '#06030d');
  bgGrad.addColorStop(1, '#020104');
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: true });

function rand(min, max) { return min + Math.random() * (max - min); }

/* ---------- Hyper-Detailed Magic Circle Engine ---------- */
class MagicCircleCache {
    constructor(hue) {
        this.size = 260; 
        let dpr = window.devicePixelRatio || 1;
        let s = this.size * 2 * dpr;
        
        this.l1 = document.createElement('canvas'); this.l1.width = s; this.l1.height = s;
        this.l2 = document.createElement('canvas'); this.l2.width = s; this.l2.height = s;
        this.l3 = document.createElement('canvas'); this.l3.width = s; this.l3.height = s;
        
        let ctx1 = this.l1.getContext('2d'); ctx1.scale(dpr, dpr); ctx1.translate(this.size, this.size);
        let ctx2 = this.l2.getContext('2d'); ctx2.scale(dpr, dpr); ctx2.translate(this.size, this.size);
        let ctx3 = this.l3.getContext('2d'); ctx3.scale(dpr, dpr); ctx3.translate(this.size, this.size);
        
        const colMain = `hsl(${hue}, 100%, 70%)`;
        const colBright = `hsl(${hue}, 100%, 90%)`;
        const colGlow = `hsl(${hue}, 100%, 50%)`;
        
        const drawPoly = (cx, radius, sides) => {
            cx.beginPath();
            for(let i=0; i<sides; i++) {
                let a = i * Math.PI*2/sides;
                if(i===0) cx.moveTo(Math.cos(a)*radius, Math.sin(a)*radius);
                else cx.lineTo(Math.cos(a)*radius, Math.sin(a)*radius);
            }
            cx.closePath(); cx.stroke();
        };

        // Layer 1
        ctx1.shadowBlur = 20; ctx1.shadowColor = colGlow;
        let coreGrad = ctx1.createRadialGradient(0,0,0, 0,0, 50);
        coreGrad.addColorStop(0, '#fff');
        coreGrad.addColorStop(0.3, colBright);
        coreGrad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
        ctx1.fillStyle = coreGrad;
        ctx1.beginPath(); ctx1.arc(0,0,60, 0, Math.PI*2); ctx1.fill();
        
        ctx1.strokeStyle = `hsla(${hue}, 100%, 75%, 0.6)`;
        ctx1.lineWidth = 2;
        for(let i=0; i<24; i++) {
            let a = i * Math.PI*2/24;
            let r = i % 2 === 0 ? 80 : 55;
            ctx1.beginPath(); ctx1.moveTo(Math.cos(a)*40, Math.sin(a)*40); ctx1.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx1.stroke();
        }
        
        ctx1.strokeStyle = colMain; ctx1.lineWidth = 1.5; ctx1.beginPath(); ctx1.arc(0,0, 85, 0, Math.PI*2); ctx1.stroke();
        ctx1.strokeStyle = `hsla(${hue + 20}, 100%, 70%, 0.7)`;
        for(let i=0; i<8; i++) {
            let a = i * Math.PI*2/8;
            ctx1.beginPath(); ctx1.arc(Math.cos(a)*60, Math.sin(a)*60, 45, 0, Math.PI*2); ctx1.stroke();
        }
        
        // Layer 2
        ctx2.shadowBlur = 15; ctx2.shadowColor = colGlow;
        ctx2.strokeStyle = colBright; ctx2.lineWidth = 2;
        for(let t=0; t<4; t++) {
            ctx2.save(); ctx2.rotate(t * Math.PI*2/12); drawPoly(ctx2, 140, 3); ctx2.restore();
        }
        
        ctx2.strokeStyle = `hsla(${hue - 20}, 100%, 80%, 0.8)`; ctx2.lineWidth = 1.5; drawPoly(ctx2, 115, 8);
        ctx2.strokeStyle = colMain; ctx2.lineWidth = 1; ctx2.beginPath(); ctx2.arc(0,0, 145, 0, Math.PI*2); ctx2.stroke();
        ctx2.strokeStyle = colBright; ctx2.lineWidth = 3; ctx2.setLineDash([2, 4, 6, 4, 2, 8, 12, 6, 4, 4]); 
        ctx2.beginPath(); ctx2.arc(0,0, 152, 0, Math.PI*2); ctx2.stroke(); ctx2.setLineDash([]);
        
        // Layer 3
        ctx3.shadowBlur = 25; ctx3.shadowColor = colGlow;
        ctx3.strokeStyle = colMain; ctx3.lineWidth = 5; ctx3.setLineDash([10, 15, 3, 10, 25, 20]);
        ctx3.beginPath(); ctx3.arc(0,0, 168, 0, Math.PI*2); ctx3.stroke(); ctx3.setLineDash([]);
        
        for(let i=0; i<8; i++) {
            let a = i * Math.PI*2/8;
            let r = 185;
            ctx3.fillStyle = colBright;
            ctx3.save(); ctx3.translate(Math.cos(a)*r, Math.sin(a)*r); ctx3.rotate(a);
            ctx3.beginPath(); ctx3.moveTo(0, -6); ctx3.lineTo(6, 0); ctx3.lineTo(0, 6); ctx3.lineTo(-6, 0); ctx3.fill();
            ctx3.strokeStyle = colMain; ctx3.lineWidth = 2; ctx3.beginPath(); ctx3.arc(0, 0, 12, -Math.PI/2.5, Math.PI/2.5); ctx3.stroke();
            ctx3.restore();
        }
        
        ctx3.shadowBlur = 0; ctx3.strokeStyle = `hsla(${hue}, 100%, 60%, 0.15)`; ctx3.lineWidth = 20;
        ctx3.beginPath(); ctx3.arc(0,0, 205, 0, Math.PI*2); ctx3.stroke();
    }
}

function initCaches() {
    for (let hue of HUE_OPTIONS) { CIRCLE_CACHES[hue] = new MagicCircleCache(hue); }
}
initCaches();

/* ---------- Environmental Entities ---------- */
class AmbientMote {
  constructor() { this.reset(true); }
  reset(randomY = false) {
    this.x = rand(0, W); this.y = randomY ? rand(0, H) : H + 20;
    this.size = rand(0.5, 1.8); this.vy = rand(-0.8, -0.1); this.vx = rand(-0.3, 0.3);
    this.hue = rand(200, 280); this.life = rand(0.2, 0.8);
    this.swing = rand(0, Math.PI * 2); this.twinkleSpeed = rand(0.01, 0.05);
  }
  update() {
    this.y += this.vy; this.x += Math.sin(this.swing += 0.01) * 0.5;
    let dx = this.x - mouse.x; let dy = this.y - mouse.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 150) { this.x += dx * 0.015; this.y += dy * 0.015; }
    if (this.y < -20) this.reset();
  }
  draw(ctx) {
    let alpha = this.life * (0.5 + Math.sin(Date.now() * this.twinkleSpeed) * 0.5);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, 0.5)`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class ManaSpark {
  constructor(tx, ty, hue) {
    this.tx = tx; this.ty = ty; this.angle = rand(0, Math.PI * 2); this.dist = rand(200, 350);
    this.speed = rand(0.02, 0.07); this.size = rand(1.5, 3.5); this.hue = hue + rand(-20, 20);
    this.life = 1; this.inwardSpeed = rand(1.5, 3.5);
  }
  update() {
    this.angle += this.speed; this.inwardSpeed *= 1.07; this.dist -= this.inwardSpeed;
    if (this.dist < 10) this.life = 0;
  }
  draw(ctx) {
    let x = this.tx + Math.cos(this.angle) * this.dist; let y = this.ty + Math.sin(this.angle) * this.dist;
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, 0.25)`; ctx.beginPath(); ctx.arc(x, y, this.size * 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, 0.7)`; ctx.beginPath(); ctx.arc(x, y, this.size * 1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, this.size * 0.6, 0, Math.PI*2); ctx.fill();
  }
}

class BurstSpark {
  constructor(x, y, hue) {
    this.x = x; this.y = y; let a = rand(0, Math.PI * 2); let s = rand(5, 18);
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s; this.size = rand(2, 5);
    this.hue = hue + rand(-30, 30); this.life = 1; this.decay = rand(0.015, 0.035);
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.vx *= 0.90; this.vy *= 0.90; this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, 0.2)`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, 0.6)`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class LeafSpark {
  constructor(x, y, hue) {
    this.x = x; this.y = y; this.vx = rand(-1, 1); this.vy = rand(-2, -0.5);
    this.hue = hue + rand(-15, 15); this.size = rand(1.5, 3); this.life = 1; this.decay = rand(0.02, 0.06);
  }
  update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, 0.4)`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `hsl(${this.hue}, 100%, 90%)`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Shockwave {
  constructor(x, y, hue) {
    this.x = x; this.y = y; this.hue = hue; this.radius = 10; this.life = 1;
  }
  update() { this.radius += 25; this.life -= 0.045; }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 60%, 0.3)`; ctx.lineWidth = 25 * this.life;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 15, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 90%, 0.8)`; ctx.lineWidth = 6 * this.life;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life * 0.25})`;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * 0.8, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------- Masterpiece Procedural Fractal Leaf ---------- */
class EtherealLeaf {
  constructor(x, y, hue) {
    this.x = x; this.y = y;
    this.hue = hue;
    this.size = rand(45, 65); // Massive size to show off hyper-details
    this.vx = rand(-3, 3);
    this.vy = rand(-8, -4); // Strong initial pop upwards
    this.gravity = 0.06; // Elegant float
    this.maxSpeed = rand(2.0, 3.5);
    this.angle = rand(0, Math.PI * 2);
    this.spin = rand(-0.04, 0.04);
    this.swayPhase = rand(0, Math.PI * 2);
    this.life = 1;
    this.trail = [];
    this.sparks = [];
    
    this.cacheCanvas = document.createElement('canvas');
    this.cacheCtx = this.cacheCanvas.getContext('2d');
    this.cacheSize = this.size * 3.5;
    this.cacheCanvas.width = this.cacheSize * 2 * DPR;
    this.cacheCanvas.height = this.cacheSize * 2 * DPR;
    this.preRender();
  }
  
  preRender() {
    const cx = this.cacheCtx;
    const s = this.size;
    cx.scale(DPR, DPR);
    cx.translate(this.cacheSize, this.cacheSize);
    
    let tipX = s * 0.15;
    let tipY = -s * 1.4;
    let baseX = 0;
    let baseY = s * 0.9;
    
    cx.shadowBlur = 40;
    cx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
    
    const buildLeafPath = () => {
        cx.beginPath();
        cx.moveTo(tipX, tipY);
        cx.bezierCurveTo(s*1.2, -s*0.4, s*0.8, s*0.7, baseX, baseY);
        cx.bezierCurveTo(-s*0.9, s*0.7, -s*0.8, -s*0.4, tipX, tipY);
    };
    
    // Base Gradient
    buildLeafPath();
    let grad = cx.createLinearGradient(-s, -s*1.5, s, s);
    grad.addColorStop(0, `hsl(${this.hue + 35}, 100%, 85%)`);
    grad.addColorStop(0.5, `hsl(${this.hue}, 100%, 60%)`);
    grad.addColorStop(1, `hsl(${this.hue - 25}, 100%, 30%)`);
    cx.fillStyle = grad;
    cx.fill();
    
    // Magical Clip Mask for internal details
    cx.save();
    buildLeafPath();
    cx.clip();
    
    // 1. Organic Cellular Texture
    cx.shadowBlur = 0;
    cx.globalCompositeOperation = 'overlay';
    for(let i=0; i<60; i++) {
        let rx = rand(-s, s); let ry = rand(-s*1.5, s); let rr = rand(s*0.1, s*0.35);
        cx.fillStyle = `hsla(${this.hue + rand(-30,30)}, 100%, 75%, 0.35)`;
        cx.beginPath(); cx.arc(rx, ry, rr, 0, Math.PI*2); cx.fill();
    }
    cx.globalCompositeOperation = 'source-over';
    
    // 2. 3D Internal Core Shadow
    let innerGrad = cx.createLinearGradient(tipX, tipY, baseX, baseY);
    innerGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
    innerGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
    cx.fillStyle = innerGrad;
    cx.fill();
    
    // 3. Central Spine
    cx.beginPath();
    cx.moveTo(baseX, baseY);
    cx.quadraticCurveTo(s*0.2, 0, tipX, tipY);
    cx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    cx.lineWidth = 3;
    cx.stroke();
    
    // 4. Procedural Fractal Veins
    let steps = 14;
    for(let i = 1; i < steps; i++) {
        let t = i / steps;
        
        // Find point along quadratic bezier spine
        let vx = Math.pow(1-t, 2)*baseX + 2*(1-t)*t*(s*0.2) + Math.pow(t, 2)*tipX;
        let vy = Math.pow(1-t, 2)*baseY + 2*(1-t)*t*0 + Math.pow(t, 2)*tipY;
        
        // Find normal angle
        let dx = 2*(1-t)*(s*0.2 - baseX) + 2*t*(tipX - s*0.2);
        let dy = 2*(1-t)*(0 - baseY) + 2*t*(tipY - 0);
        let angle = Math.atan2(dy, dx);
        
        // Sprout left and right fractal branches
        this.drawFractalVeins(cx, vx, vy, angle + 0.8, s * (1-t) * 0.9, 0, 2, this.hue);
        this.drawFractalVeins(cx, vx, vy, angle - 0.7, s * (1-t) * 0.9, 0, 2, this.hue);
    }
    
    cx.restore(); // End Mask
    
    // 5. Leaf Stem
    cx.shadowBlur = 8;
    cx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
    cx.beginPath();
    cx.moveTo(baseX, baseY);
    cx.quadraticCurveTo(baseX - s*0.1, baseY + s*0.2, baseX + s*0.1, baseY + s*0.45);
    cx.lineWidth = 4;
    cx.strokeStyle = `hsl(${this.hue}, 60%, 80%)`;
    cx.lineCap = 'round';
    cx.stroke();
    
    // 6. Brilliant Crisp Rim Highlight
    cx.shadowBlur = 15;
    cx.shadowColor = '#ffffff';
    cx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    cx.lineWidth = 1.5;
    buildLeafPath();
    cx.stroke();
  }

  // Recursive function to grow highly realistic leaf veins
  drawFractalVeins(cx, x, y, angle, length, depth, maxDepth, hue) {
    if (depth > maxDepth) return;
    
    let ex = x + Math.cos(angle) * length;
    let ey = y + Math.sin(angle) * length;
    
    cx.beginPath();
    cx.moveTo(x, y);
    let cpX = x + Math.cos(angle + 0.2)*(length*0.5);
    let cpY = y + Math.sin(angle + 0.2)*(length*0.5);
    cx.quadraticCurveTo(cpX, cpY, ex, ey);
    
    cx.lineWidth = Math.max(0.5, 2 - depth*0.6);
    if (depth === maxDepth) {
        cx.strokeStyle = `hsla(${hue}, 100%, 90%, 0.7)`;
    } else {
        cx.strokeStyle = `rgba(255, 255, 255, ${0.8 - depth*0.15})`;
    }
    cx.stroke();
    
    if (depth < maxDepth) {
        let newLen = length * 0.6;
        this.drawFractalVeins(cx, ex, ey, angle + 0.55 + rand(-0.1, 0.1), newLen, depth+1, maxDepth, hue);
        this.drawFractalVeins(cx, ex, ey, angle - 0.45 + rand(-0.1, 0.1), newLen, depth+1, maxDepth, hue);
    }
  }
  
  update() {
    this.vy += this.gravity;
    if (this.vy > this.maxSpeed) this.vy = this.maxSpeed;
    this.vx *= 0.98;
    this.angle += this.spin;
    this.x += this.vx + Math.sin(Date.now()*0.001 * 2 + this.swayPhase) * 2;
    this.y += this.vy;
    
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 25) this.trail.shift();
    
    if (Math.random() < 0.5) this.sparks.push(new LeafSpark(this.x, this.y, this.hue));
    
    this.sparks.forEach(s => s.update());
    this.sparks = this.sparks.filter(s => s.life > 0);
    if (this.y > H + 180) this.life = 0;
  }
  
  draw(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    this.sparks.forEach(s => s.draw(ctx));
    
    // Huge Volumetric Ribbon Trail
    if (this.trail.length > 2) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for(let i=1; i<this.trail.length; i++) {
        let xc = (this.trail[i].x + this.trail[i-1].x) / 2;
        let yc = (this.trail[i].y + this.trail[i-1].y) / 2;
        ctx.quadraticCurveTo(this.trail[i-1].x, this.trail[i-1].y, xc, yc);
      }
      ctx.lineTo(this.trail[this.trail.length-1].x, this.trail[this.trail.length-1].y);
      
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 50%, 0.15)`;
      ctx.lineWidth = 36; ctx.stroke();
      
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, 0.4)`;
      ctx.lineWidth = 18; ctx.stroke();
      
      ctx.strokeStyle = `hsla(${this.hue}, 100%, 85%, 0.9)`;
      ctx.lineWidth = 5; ctx.stroke();
    }
    
    ctx.globalCompositeOperation = 'source-over';
    
    // Render the beautiful cached sprite
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    let pulse = 1 + Math.sin(Date.now() * 0.003 + this.swayPhase) * 0.05; // Gentle breathing effect
    ctx.scale(pulse, pulse);
    ctx.drawImage(this.cacheCanvas, -this.cacheSize, -this.cacheSize, this.cacheSize * 2, this.cacheSize * 2);
    ctx.restore();
  }
}

/* ---------- Full Summoning Event Manager ---------- */
class SummonEvent {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.time = 0;
    this.chargeDuration = 75;
    this.burstDuration = 50;
    this.state = 'charging';
    this.lightPillar = 0;
    
    this.baseHue = HUE_OPTIONS[Math.floor(Math.random() * HUE_OPTIONS.length)];
    this.hue = this.baseHue + rand(-10, 10);
    
    this.particles = [];
    this.shockwaves = [];
    this.leaf = null;
    this.startTime = Date.now() * 0.001;
  }

  update() {
    this.time++;
    
    if (this.state === 'charging') {
      for(let i=0; i<3; i++) {
         this.particles.push(new ManaSpark(this.x, this.y, this.hue));
      }
      
      if (this.time >= this.chargeDuration) {
        this.state = 'burst';
        this.time = 0;
        screenShake = 18; 
        
        this.shockwaves.push(new Shockwave(this.x, this.y, this.hue));
        this.leaf = new EtherealLeaf(this.x, this.y, this.hue);
        for(let i=0; i<60; i++) this.particles.push(new BurstSpark(this.x, this.y, this.hue));
      }
    } else if (this.state === 'burst') {
      this.lightPillar = 1 - (this.time / this.burstDuration);
      if (this.time >= this.burstDuration) {
        this.state = 'done';
      }
    } else {
      this.lightPillar -= 0.05;
      if (this.lightPillar < 0) this.lightPillar = 0;
    }
    
    this.particles.forEach(p => p.update());
    this.particles = this.particles.filter(p => p.life > 0);
    this.shockwaves.forEach(s => s.update());
    this.shockwaves = this.shockwaves.filter(s => s.life > 0);
    if (this.leaf) this.leaf.update();
  }
  
  draw(ctx) {
    let elapsed = Date.now() * 0.001;
    
    // Blinding Flash Effect
    if (this.state === 'burst' && this.time < 6) {
        ctx.fillStyle = `rgba(255, 255, 255, ${1 - this.time/6})`;
        ctx.fillRect(-200, -200, W+400, H+400);
    }
    
    // Massive God Rays behind magic circle
    if (this.lightPillar > 0) {
       let grad = ctx.createLinearGradient(this.x - 140, 0, this.x + 140, 0);
       grad.addColorStop(0, `hsla(${this.hue}, 100%, 80%, 0)`);
       grad.addColorStop(0.2, `hsla(${this.hue}, 100%, 80%, ${this.lightPillar * 0.5})`);
       grad.addColorStop(0.5, `hsla(${this.hue}, 100%, 90%, ${this.lightPillar * 0.9})`);
       grad.addColorStop(0.8, `hsla(${this.hue}, 100%, 80%, ${this.lightPillar * 0.5})`);
       grad.addColorStop(1, `hsla(${this.hue}, 100%, 80%, 0)`);
       
       ctx.globalCompositeOperation = 'screen';
       ctx.fillStyle = grad;
       ctx.fillRect(this.x - 140, -200, 280, H + 400);
       ctx.globalCompositeOperation = 'source-over';
    }
    
    // Draw Hyper-Detailed Magic Circle from Cache
    if (this.state === 'charging' || this.state === 'burst') {
      let progress = this.state === 'charging' ? this.time / this.chargeDuration : 1;
      let fade = this.state === 'burst' ? 1 - (this.time / this.burstDuration) : progress;
      
      let c = CIRCLE_CACHES[this.baseHue];
      let s = c.size;
      let scale = 0.2 + progress * 0.8 + (this.state === 'burst' ? (1-fade)*0.5 : 0);
      let timePhase = (elapsed - this.startTime) * (1 + progress * 3);
      
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = Math.min(1, fade * 1.5);
      ctx.globalCompositeOperation = 'lighter';
      
      ctx.save(); ctx.rotate(timePhase * 0.5); ctx.drawImage(c.l1, -s, -s, s*2, s*2); ctx.restore();
      ctx.save(); ctx.rotate(-timePhase * 0.8); ctx.drawImage(c.l2, -s, -s, s*2, s*2); ctx.restore();
      ctx.save(); ctx.rotate(timePhase * 0.3); ctx.drawImage(c.l3, -s, -s, s*2, s*2); ctx.restore();
      
      ctx.restore();
    }
    
    ctx.globalCompositeOperation = 'lighter';
    this.particles.forEach(p => p.draw(ctx));
    this.shockwaves.forEach(s => s.draw(ctx));
    ctx.globalCompositeOperation = 'source-over';
    
    if (this.leaf) this.leaf.draw(ctx);
  }
}

/* ---------- Master Animation Loop ---------- */
for(let i=0; i<60; i++) ambientMotes.push(new AmbientMote());

setTimeout(() => {
  events.push(new SummonEvent(W/2, H/2 - 50));
}, 300);

window.addEventListener('click', e => {
  events.push(new SummonEvent(e.clientX, e.clientY));
});
window.addEventListener('touchstart', e => {
  events.push(new SummonEvent(e.touches[0].clientX, e.touches[0].clientY));
}, { passive: true });

function loop() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  
  if (screenShake > 0) {
      let sx = rand(-screenShake, screenShake);
      let sy = rand(-screenShake, screenShake);
      ctx.translate(sx, sy);
      screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;
  }
  
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-200, -200, W + 400, H + 400); 

  let activeCharges = events.filter(e => e.state === 'charging').length;
  let targetDim = activeCharges > 0 ? 0.75 : 0;
  currentDim += (targetDim - currentDim) * 0.05;
  if (currentDim > 0.01) {
      ctx.fillStyle = `rgba(2, 1, 6, ${currentDim})`;
      ctx.fillRect(-200, -200, W + 400, H + 400);
  }

  ctx.globalCompositeOperation = 'lighter';
  ambientMotes.forEach(m => { m.update(); m.draw(ctx); });
  ctx.globalCompositeOperation = 'source-over';
  
  events.forEach(e => e.update());
  events.forEach(e => e.draw(ctx));
  
  events = events.filter(e => {
    let circleDone = e.state === 'done';
    let leafDone = e.leaf ? e.leaf.life <= 0 : false;
    return !(circleDone && leafDone);
  });
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
})();
</script>
