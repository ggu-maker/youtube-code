<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokushibo Eyes Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Reverting to the requested white background */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Shippori Mincho', serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height, cx, cy;
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
            targetMouseX = cx;
            targetMouseY = cy;
            mouseX = cx;
            mouseY = cy;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });
        
        window.addEventListener('touchmove', (e) => {
            targetMouseX = e.touches[0].clientX;
            targetMouseY = e.touches[0].clientY;
        });

        // The jagged flame-like border shape of the eye from the FIRST picture
        const outerBlackPath = new Path2D(
            "M 85 0 " + 
            "C 80 -15, 60 -30, 45 -40 " + 
            "L 35 -65 L 25 -45 " + 
            "C 15 -48, 0 -48, -10 -45 " +
            "L -20 -70 L -30 -40 " + 
            "C -45 -35, -60 -25, -70 -15 " +
            "L -85 -30 L -80 -10 " + 
            "C -90 -5, -95 -2, -100 0 " + 
            "C -95 2, -90 5, -80 10 " + 
            "L -85 30 L -70 15 " + 
            "C -60 25, -45 35, -30 40 " +
            "L -20 70 L -10 45 " + 
            "C 0 48, 15 48, 25 45 " +
            "C 45 40, 70 25, 85 0 Z"
        );

        // Perfectly smooth inner almond shape
        const innerRedPath = new Path2D(
            "M 75 0 " +
            "Q 20 -55, -92 0 " +
            "Q 20 55, 75 0 Z"
        );

        // Fleshy inner corner (caruncle)
        const whiteCornerPath = new Path2D(
            "M 75 0 " +
            "Q 65 -15, 50 0 " +
            "Q 65 15, 75 0 Z"
        );

        class Eye {
            constructor(xOffset, yOffset, scaleX, scaleY, rotation, hasKanji, kanjiText) {
                this.xOffset = xOffset;
                this.yOffset = yOffset;
                this.scaleX = scaleX;
                this.scaleY = scaleY;
                this.rotation = rotation;
                this.hasKanji = hasKanji;
                this.kanjiText = kanjiText;
                
                this.blinkProgress = 0;
                this.isBlinking = false;
                this.blinkTimer = Math.random() * 4000 + 1000;
                
                this.lookX = 0;
                this.lookY = 0;
                
                // Hyper-dense realistic veins (straight & embossed)
                this.veins = [];
                for(let i = 0; i < 150; i++) {
                    const angle = (i/150) * Math.PI * 2 + (Math.random() * 0.02);
                    this.veins.push({
                        a: angle,
                        r1: 28 + Math.random() * 5, 
                        r2: 95, 
                        w: 0.3 + Math.random() * 1.5
                    });
                }

                // Shattered glass iris cracks (from the anime reference)
                this.cracks = [];
                const numSpokes = 24;
                for(let i=0; i<numSpokes; i++) {
                    const angle = (i/numSpokes)*Math.PI*2 + Math.random()*0.1;
                    let path = [{r: 6, a: angle}];
                    let r = 6;
                    let a = angle;
                    while(r < 28) {
                        r += 3 + Math.random()*4;
                        a += (Math.random()-0.5)*0.25; 
                        path.push({r: Math.min(r, 28), a: a});
                    }
                    this.cracks.push(path);
                }
                
                this.crossCracks = [];
                for(let i=0; i<30; i++) {
                    const r = 10 + Math.random()*15;
                    const a1 = Math.random()*Math.PI*2;
                    const a2 = a1 + (Math.random() > 0.5 ? 0.2 : -0.2);
                    this.crossCracks.push({r: r, a1: a1, a2: a2});
                }
            }

            update(dt, mx, my, globalCx, globalCy) {
                const actualX = globalCx + this.xOffset;
                const actualY = globalCy + this.yOffset;
                
                const dx = mx - actualX;
                const dy = my - actualY;
                
                const maxLook = 14;
                
                let targetLookX = (dx / width) * maxLook * 3;
                let targetLookY = (dy / height) * maxLook * 3;
                
                const lookDist = Math.sqrt(targetLookX * targetLookX + targetLookY * targetLookY);
                if (lookDist > maxLook) {
                    targetLookX = (targetLookX / lookDist) * maxLook;
                    targetLookY = (targetLookY / lookDist) * maxLook;
                }

                this.lookX += (targetLookX - this.lookX) * 0.12;
                this.lookY += (targetLookY - this.lookY) * 0.12;

                this.blinkTimer -= dt;
                if (this.blinkTimer <= 0 && !this.isBlinking) {
                    this.isBlinking = true;
                    this.blinkTimer = Math.random() * 6000 + 3000; 
                }

                if (this.isBlinking) {
                    this.blinkProgress += dt * 0.015; 
                    if (this.blinkProgress >= Math.PI) {
                        this.blinkProgress = 0;
                        this.isBlinking = false;
                    }
                }
            }

            draw(ctx, time) {
                ctx.save();
                ctx.translate(this.xOffset, this.yOffset);
                
                const breatheX = Math.sin(time * 0.001 + this.xOffset) * 1.5;
                const breatheY = Math.cos(time * 0.0013 + this.yOffset) * 1.5;
                ctx.translate(breatheX, breatheY);
                
                const breatheScale = 1 + Math.sin(time * 0.002 + this.xOffset) * 0.015;
                ctx.scale(this.scaleX * breatheScale, this.scaleY * breatheScale);
                ctx.rotate(this.rotation);

                const blinkScale = 1 - Math.sin(this.blinkProgress);
                ctx.scale(1, Math.max(0.01, blinkScale));

                // --- 1. Outer Jagged Eyelid & Shadow ---
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 10;
                
                ctx.fillStyle = '#0a0a0a'; 
                ctx.fill(outerBlackPath);
                
                ctx.shadowColor = 'transparent'; 
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // --- 2. Eyeball Sclera ---
                ctx.save();
                ctx.clip(innerRedPath);

                const ax = this.scaleX < 0 ? -this.lookX : this.lookX;
                const ay = this.lookY;

                // Vibrant crimson base with 3D spherical gradient
                const scleraGrad = ctx.createRadialGradient(ax*0.3, ay*0.3, 0, 0, 0, 110);
                scleraGrad.addColorStop(0, '#ff6666'); // Highlight point
                scleraGrad.addColorStop(0.2, '#ff1a1a'); // Bright red core
                scleraGrad.addColorStop(0.6, '#990000'); // Deepening red
                scleraGrad.addColorStop(1, '#200000'); // Shadow edge
                ctx.fillStyle = scleraGrad;
                ctx.fill(innerRedPath);

                // Deep inner rim shadow to make eyeball pop inside the socket
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 18;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 14;
                ctx.stroke(innerRedPath);
                ctx.shadowColor = 'transparent';

                // Embossed realistic veins
                ctx.beginPath();
                this.veins.forEach(v => {
                    ctx.moveTo(ax + Math.cos(v.a)*v.r1 - 0.5, ay + Math.sin(v.a)*v.r1 + 0.5);
                    const cpR = v.r1 + (v.r2 - v.r1)*0.5;
                    const cpA = v.a + 0.05;
                    ctx.quadraticCurveTo(
                        ax + Math.cos(cpA)*cpR - 0.5, ay + Math.sin(cpA)*cpR + 0.5,
                        ax + Math.cos(v.a)*v.r2 - 0.5, ay + Math.sin(v.a)*v.r2 + 0.5
                    );
                });
                ctx.strokeStyle = 'rgba(30, 0, 0, 0.7)'; // shadow
                ctx.lineWidth = 1.5;
                ctx.stroke();
                
                ctx.beginPath();
                this.veins.forEach(v => {
                    ctx.moveTo(ax + Math.cos(v.a)*v.r1, ay + Math.sin(v.a)*v.r1);
                    const cpR = v.r1 + (v.r2 - v.r1)*0.5;
                    const cpA = v.a + 0.05;
                    ctx.quadraticCurveTo(
                        ax + Math.cos(cpA)*cpR, ay + Math.sin(cpA)*cpR,
                        ax + Math.cos(v.a)*v.r2, ay + Math.sin(v.a)*v.r2
                    );
                });
                ctx.strokeStyle = 'rgba(180, 0, 0, 0.9)'; // blood highlight
                ctx.lineWidth = 1;
                ctx.stroke();

                // Fleshy Caruncle (Inner Corner)
                const caruncleGrad = ctx.createLinearGradient(40, 0, 75, 0);
                caruncleGrad.addColorStop(0, '#d98b99'); // realistic pink flesh
                caruncleGrad.addColorStop(0.6, '#e6e6e6'); // white-ish
                caruncleGrad.addColorStop(1, '#8c8c8c'); // shadowed tip
                ctx.fillStyle = caruncleGrad;
                ctx.fill(whiteCornerPath);
                
                // Add soft 3D shadow over the caruncle
                ctx.save();
                ctx.clip(whiteCornerPath);
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 6;
                ctx.strokeStyle = 'transparent';
                ctx.stroke(whiteCornerPath);
                ctx.restore();
                
                ctx.strokeStyle = 'rgba(20, 10, 10, 0.9)';
                ctx.lineCap = 'round';
                for(let i=0; i<3; i++) {
                    const lx = 56 + i*7;
                    ctx.beginPath();
                    ctx.moveTo(lx, -6 + i);
                    ctx.quadraticCurveTo(lx-3, 0, lx, 6 - i);
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                }

                // Heavy directional shadow from the top jagged eyelid
                const topShadow = ctx.createLinearGradient(0, -45, 0, 15);
                topShadow.addColorStop(0, 'rgba(0,0,0,0.95)');
                topShadow.addColorStop(0.4, 'rgba(0,0,0,0.7)');
                topShadow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = topShadow;
                ctx.fillRect(-100, -50, 200, 65);
                
                // Soft bottom shadow for roundness
                const botShadow = ctx.createLinearGradient(0, 40, 0, 10);
                botShadow.addColorStop(0, 'rgba(0,0,0,0.8)');
                botShadow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = botShadow;
                ctx.fillRect(-100, 10, 200, 30);

                // --- 3. Shattered Gold Iris ---
                ctx.beginPath();
                ctx.arc(ax, ay, 28, 0, Math.PI*2);
                
                const irisGrad = ctx.createRadialGradient(ax, ay, 0, ax, ay, 28);
                irisGrad.addColorStop(0, '#ffffff'); 
                irisGrad.addColorStop(0.15, '#ffea00'); 
                irisGrad.addColorStop(0.5, '#ffaa00'); 
                irisGrad.addColorStop(0.8, '#d94d00'); 
                irisGrad.addColorStop(0.95, '#661a00'); 
                irisGrad.addColorStop(1, '#000000'); 
                ctx.fillStyle = irisGrad;
                ctx.fill();

                // Shattered glass cracks
                ctx.beginPath();
                this.cracks.forEach(path => {
                    ctx.moveTo(ax + Math.cos(path[0].a)*path[0].r, ay + Math.sin(path[0].a)*path[0].r);
                    for(let i=1; i<path.length; i++) {
                        ctx.lineTo(ax + Math.cos(path[i].a)*path[i].r, ay + Math.sin(path[i].a)*path[i].r);
                    }
                });
                this.crossCracks.forEach(c => {
                    ctx.moveTo(ax + Math.cos(c.a1)*c.r, ay + Math.sin(c.a1)*c.r);
                    ctx.lineTo(ax + Math.cos(c.a2)*c.r, ay + Math.sin(c.a2)*c.r);
                });
                ctx.strokeStyle = '#2a0b00'; 
                ctx.lineWidth = 1.2;
                ctx.lineJoin = 'miter';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(ax, ay, 28, 0, Math.PI*2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000000';
                ctx.stroke(); // black rim

                // --- 4. Pupil / Kanji ---
                if (this.hasKanji) {
                    ctx.save();
                    ctx.translate(ax, ay);
                    
                    ctx.rotate(-this.rotation);
                    if (this.scaleX < 0) ctx.scale(-1, 1);
                    
                    ctx.font = '900 42px "Shippori Mincho", serif'; // increased size for realism
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Ink bleed / realistic depth shadow
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = '#1a0505'; // dark blood/ink
                    ctx.fillText(this.kanjiText, 0, 2);
                    
                    // Core text
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#050304';
                    ctx.fillText(this.kanjiText, 0, 2);
                    
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(ax, ay, 8.5, 0, Math.PI * 2); // slightly larger pupil
                    ctx.fillStyle = '#050304';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowColor = 'transparent';
                }

                // --- 5. Crisp Anime Highlights ---
                ctx.save();
                ctx.translate(ax, ay);
                
                // Top-left hard curved glare
                ctx.beginPath();
                ctx.moveTo(-8, -18);
                ctx.quadraticCurveTo(-18, -12, -18, -6);
                ctx.quadraticCurveTo(-15, -10, -5, -15);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
                ctx.shadowBlur = 4;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Bottom-right sharp pin dot
                ctx.beginPath();
                ctx.arc(12, 12, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fill();

                // Faint ambient rim light curve at the bottom
                ctx.beginPath();
                ctx.arc(0, 0, 25, Math.PI*0.15, Math.PI*0.6);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.restore(); 

                ctx.restore(); // Restore Sclera clip
                ctx.restore(); // Final restore
            }
        }

        // --- Exact Layout matching FIRST reference image ---
        const eyes = [];
        // Left Side (Inner corner on right)
        eyes.push(new Eye(-130, -145, 1.2, 1.2, 35 * Math.PI/180, false, '')); 
        eyes.push(new Eye(-170, 5, 1.5, 1.5, 12 * Math.PI/180, true, '壱')); 
        eyes.push(new Eye(-140, 160, 1.2, 1.2, -22 * Math.PI/180, false, '')); 
        
        // Right Side (Rotation must match left side when scaleX is flipped to mirror properly)
        eyes.push(new Eye(130, -145, -1.2, 1.2, 35 * Math.PI/180, false, '')); 
        eyes.push(new Eye(170, 5, -1.5, 1.5, 12 * Math.PI/180, true, '上弦')); 
        eyes.push(new Eye(140, 160, -1.2, 1.2, -22 * Math.PI/180, false, '')); 


        // Drawing the floating detached flames from the FIRST image
        function drawDynamicFlame(ctx, time, x, y, scaleX, scaleY) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scaleX, scaleY);
            
            const w1 = Math.sin(time*0.002)*6;
            const w2 = Math.cos(time*0.003)*5;
            const w3 = Math.sin(time*0.0015 + 1)*4;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(20 + w1, -15 + w2, 50, -10 + w3); 
            ctx.quadraticCurveTo(35 - w1, -5 + w1, 45, 10 + w2);   
            ctx.quadraticCurveTo(25 + w2, -2 - w1, 15, 15 + w3);   
            ctx.quadraticCurveTo(5, 5, 0, 0);
            
            ctx.fillStyle = '#050505';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 10;
            ctx.fill();
            
            ctx.restore();
        }

        let lastTime = 0;
        function animate(timestamp) {
            const dt = timestamp - lastTime || 16;
            lastTime = timestamp;
            
            mouseX += (targetMouseX - mouseX) * 0.12;
            mouseY += (targetMouseY - mouseY) * 0.12;

            // Clean white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // Draw floating detached flames
            drawDynamicFlame(ctx, timestamp, cx + 90, cy - 250, 1.4, 1.4);
            drawDynamicFlame(ctx, timestamp + 1000, cx - 140, cy + 270, -1.3, -1.3);

            ctx.save();
            ctx.translate(cx, cy);

            // Draw eyes
            [...eyes].sort((a,b) => Math.abs(a.scaleX) - Math.abs(b.scaleX)).forEach(eye => {
                eye.update(dt, mouseX, mouseY, cx, cy);
                eye.draw(ctx, timestamp);
            });

            ctx.restore();

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
