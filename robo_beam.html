<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 3D-Robe Beam </title>
    <style>
        body {
            margin: 0;
            background: #010105;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #canvas-container {
            width: 950px;
            height: 520px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 180, 255, 0.4);
            border: 2px solid #1a1a40;
            position: relative;
        }
        .instructions {
            margin-top: 15px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #00ffff;
            font-weight: bold;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="loading">Loading Animated Model...</div>
    </div>
    <div class="instructions">Click or press <strong>Spacebar</strong> to Charge & Fire!</div>

    <!-- Load Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010105, 0.01);

        const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(2, 0.8, 6.5);
        camera.lookAt(-0.5, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Clock for tracking animation frames
        const clock = new THREE.Clock();
        let mixer;
        let actions = {};

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(5, 8, 5);
        scene.add(directionalLight);

        const energyLight = new THREE.PointLight(0x00ffff, 0, 15);
        energyLight.position.set(-0.8, 0.2, 0);
        scene.add(energyLight);

        // --- BACKGROUND STARFIELD ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 600;
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 80;
            starPos[i+1] = (Math.random() - 0.5) * 80;
            starPos[i+2] = -20 - Math.random() * 40;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.18, transparent: true, opacity: 0.8}));
        scene.add(starField);

        // --- LOAD RIGGED MODEL & EMBEDDED ANIMATIONS ---
        const heroGroup = new THREE.Group();
        scene.add(heroGroup);

        const loader = new THREE.GLTFLoader();
        loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/RobotExpressive/RobotExpressive.glb', function (gltf) {
            const model = gltf.scene;
            model.scale.set(0.4, 0.4, 0.4);
            model.position.set(-1.8, -1.5, 0);
            model.rotation.y = Math.PI / 2.5;
            
            heroGroup.add(model);
            document.getElementById('loading').style.opacity = '0';

            // Setup Animation Mixer and map animations
            mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => {
                actions[clip.name] = mixer.clipAction(clip);
            });

            // Start with Idle animation looping
            if (actions['Idle']) {
                actions['Idle'].play();
            }
        }, undefined, function (error) {
            console.error(error);
            document.getElementById('loading').innerText = 'Model load error';
        });

        // --- ENERGY CORE & VORTEX ---
        const handsPos = new THREE.Vector3(-0.8, 0.2, 0);

        const coreSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        coreSphere.position.copy(handsPos);
        coreSphere.scale.set(0, 0, 0);
        scene.add(coreSphere);

        const vortexGroup = new THREE.Group();
        vortexGroup.position.copy(handsPos);
        
        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.08, 16, 100), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.05, 16, 100), new THREE.MeshBasicMaterial({ color: 0xcc44ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
        ring1.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 4;
        vortexGroup.add(ring1);
        vortexGroup.add(ring2);
        vortexGroup.scale.set(0,0,0);
        scene.add(vortexGroup);

        // --- LIGHTNING ARCS ---
        const lightningLines = [];
        const lightningMat = new THREE.LineBasicMaterial({ color: 0xaaffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        for(let i=0; i<4; i++) {
            const points = [];
            for(let j=0; j<5; j++) points.push(new THREE.Vector3());
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, lightningMat);
            scene.add(line);
            lightningLines.push(line);
        }

        // --- THE BEAM ---
        const beamGroup = new THREE.Group();
        beamGroup.position.copy(handsPos);

        const innerBeam = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 0.8, 35, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending })
        );
        innerBeam.rotation.z = Math.PI / 2;
        innerBeam.position.x = 17.5;
        beamGroup.add(innerBeam);

        const outerBeam = new THREE.Mesh(
            new THREE.ConeGeometry(3.5, 35, 32, 1, true),
            new THREE.MeshBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
        );
        outerBeam.rotation.z = -Math.PI / 2;
        outerBeam.position.x = 17.5;
        beamGroup.add(outerBeam);

        beamGroup.scale.set(0, 0, 0);
        scene.add(beamGroup);

        // --- DEBRIS SYSTEM ---
        const rocks = [];
        for(let i=0; i<18; i++) {
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(Math.random() * 0.3 + 0.1),
                new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 })
            );
            rock.position.set((Math.random() - 0.5) * 5 - 0.5, -2 - Math.random() * 0.5, (Math.random() - 0.5) * 5);
            rock.userData = { vy: Math.random() * 0.04 + 0.01, rx: Math.random() * 0.06 };
            scene.add(rock);
            rocks.push(rock);
        }

        // --- INTERACTION & ANIMATION TRIGGERS ---
        let state = 'IDLE'; 
        let chargeProgress = 0;
        let shakeTimer = 0;

        function triggerAction() {
            if (state === 'IDLE') {
                state = 'CHARGING';
                chargeProgress = 0;
                // Switch character to a dynamic action stance if available
                if (actions['Jump']) {
                    Object.values(actions).forEach(a => a.stop());
                    actions['Jump'].reset().play();
                }
            } else if (state === 'CHARGING' && chargeProgress >= 100) {
                state = 'FIRING';
                if (actions['Wave']) {
                    Object.values(actions).forEach(a => a.stop());
                    actions['Wave'].reset().play();
                }
            }
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); triggerAction(); } });
        container.addEventListener('click', triggerAction);

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta); // Updates character skeleton movements smoothly

            starField.rotation.y += 0.0005;

            if (state === 'CHARGING') {
                chargeProgress = Math.min(100, chargeProgress + 0.8);
                let s = (chargeProgress / 100) * 1.4;
                coreSphere.scale.set(s, s, s);
                vortexGroup.scale.set(s, s, s);
                vortexGroup.rotation.z += 0.1;
                vortexGroup.rotation.y += 0.07;
                energyLight.intensity = (chargeProgress / 100) * 7;

                lightningLines.forEach(line => {
                    const pos = line.geometry.attributes.position;
                    for(let j=0; j<5; j++) {
                        pos.setXYZ(j, 
                            handsPos.x + (Math.random() - 0.5) * 2.5 * s,
                            handsPos.y + (Math.random() - 0.5) * 2.5 * s,
                            handsPos.z + (Math.random() - 0.5) * 2.5 * s
                        );
                    }
                    pos.needsUpdate = true;
                });

                rocks.forEach(rock => {
                    rock.position.y += rock.userData.vy;
                    rock.rotation.x += rock.userData.rx;
                    if (rock.position.y > 2.5) rock.position.y = -2;
                });

            } else if (state === 'FIRING') {
                lightningLines.forEach(l => l.visible = false);
                beamGroup.scale.x += (1 - beamGroup.scale.x) * 0.25;
                beamGroup.scale.y += (1 - beamGroup.scale.y) * 0.25;
                beamGroup.scale.z += (1 - beamGroup.scale.z) * 0.25;

                coreSphere.scale.set(2, 2, 2);
                vortexGroup.rotation.z += 0.3;
                energyLight.intensity = 12;

                shakeTimer++;
                camera.position.x = 2 + (Math.random() - 0.5) * 0.15;
                camera.position.y = 0.8 + (Math.random() - 0.5) * 0.15;

                if (shakeTimer > 180) {
                    state = 'IDLE';
                    chargeProgress = 0;
                    shakeTimer = 0;
                    coreSphere.scale.set(0, 0, 0);
                    vortexGroup.scale.set(0, 0, 0);
                    beamGroup.scale.set(0, 0, 0);
                    energyLight.intensity = 0;
                    camera.position.set(2, 0.8, 6.5);
                    lightningLines.forEach(l => l.visible = true);

                    if (actions['Idle']) {
                        Object.values(actions).forEach(a => a.stop());
                        actions['Idle'].reset().play();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
