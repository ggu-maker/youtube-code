<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Orb</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060f; }
  canvas { display: block; }
  .hint {
    position: fixed; bottom: 5%; width: 100%; text-align: center; pointer-events: none;
    font: 300 12px system-ui, sans-serif; letter-spacing: 0.5em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
<div class="hint">move · click</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060f);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------- Liquid iridescent orb ---------- */
const noiseGLSL = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const orbMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uAmp: { value: 0.35 }, uPulse: { value: 0 } },
  vertexShader: noiseGLSL + `
    uniform float uTime, uAmp, uPulse;
    varying vec3 vNormal, vView; varying float vNoise;
    vec3 displace(vec3 p){
      float n = snoise(p * 0.9 + uTime * 0.35);
      return p + normalize(p) * n * (uAmp + uPulse * 0.35);
    }
    void main(){
      vec3 n = normalize(position);
      vec3 t = normalize(cross(n, abs(n.y) > 0.99 ? vec3(1,0,0) : vec3(0,1,0)));
      vec3 b = cross(n, t);
      float e = 0.01;
      vec3 p0 = displace(position);
      vec3 p1 = displace(normalize(position + t * e) * 1.5);
      vec3 p2 = displace(normalize(position + b * e) * 1.5);
      vNormal = normalize(normalMatrix * normalize(cross(p1 - p0, p2 - p0)));
      vNoise = snoise(position * 0.9 + uTime * 0.35);
      vec4 mv = modelViewMatrix * vec4(p0, 1.0);
      vView = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal, vView; varying float vNoise;
    vec3 palette(float t){ return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67))); }
    void main(){
      vec3 n = normalize(vNormal);
      float f = pow(1.0 - max(dot(n, vView), 0.0), 2.0);
      vec3 col = palette(f * 0.9 + vNoise * 0.35 + uTime * 0.08);
      vec3 light = normalize(vec3(0.6, 0.8, 0.7));
      float spec = pow(max(dot(reflect(-light, n), vView), 0.0), 40.0);
      col = col * (0.25 + 0.75 * max(dot(n, light), 0.0)) + col * f * 0.8 + spec;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 48), orbMat);
scene.add(orb);

/* ---------- Orbiting rings ---------- */
const rings = [];
[2.3, 2.7, 3.1].forEach((r, i) => {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.008, 8, 200),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.55 + i * 0.12, 0.9, 0.65),
      transparent: true, opacity: 0.5 })
  );
  ring.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  ring.userData.speed = (0.15 + i * 0.1) * (i % 2 ? -1 : 1);
  rings.push(ring); scene.add(ring);
});

/* ---------- Star dust ---------- */
const N = 1500, sp = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 8 + Math.random() * 22, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
  sp.set([r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a), r * Math.cos(b)], i * 3);
}
const sg = new THREE.BufferGeometry();
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: 0.06, color: 0xffffff, transparent: true, opacity: 0.7 }));
scene.add(stars);

/* ---------- Interaction ---------- */
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / innerHeight - 0.5) * 2;
});
addEventListener('pointerdown', () => { orbMat.uniforms.uPulse.value = 1; });

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
(function animate() {
  const t = clock.getElapsedTime();
  mouse.sx += (mouse.x - mouse.sx) * 0.05;
  mouse.sy += (mouse.y - mouse.sy) * 0.05;

  orbMat.uniforms.uTime.value = t;
  orbMat.uniforms.uAmp.value = 0.3 + Math.hypot(mouse.sx, mouse.sy) * 0.25;
  orbMat.uniforms.uPulse.value *= 0.94;               // click pulse fades out

  orb.rotation.y = t * 0.15 + mouse.sx * 0.6;
  orb.rotation.x = mouse.sy * 0.4;
  rings.forEach(r => { r.rotation.z += r.userData.speed * 0.01; r.rotation.x += 0.002; });
  stars.rotation.y = t * 0.01;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
