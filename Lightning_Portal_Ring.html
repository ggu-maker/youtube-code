<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lightning Portal Ring</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; width:100%; }
  canvas { display:block; }
  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    color:#6fb8ff; font-family: monospace; font-size:12px; opacity:0.5;
    pointer-events:none; letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="hint">LIGHTNING PORTAL — drag to orbit</div>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Scene setup ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5.5, 8.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.target.set(0, 0, 0);

// ---------- Bloom (glow) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5,   // strength - refined glow
  0.55,  // radius - tighter bleed
  0.15   // threshold
);
composer.addPass(bloomPass);

// ---------- Ring geometry parameters ----------
const RADIUS_X = 4.2;
const RADIUS_Z = 1.7;
const SEGMENTS = 200;

// cheap pseudo-noise: sum of sines, deterministic per seed — smooth, flowing
function noise(x, seed) {
  return Math.sin(x * 1.3 + seed * 3.13) * 0.55
       + Math.sin(x * 2.4 + seed * 7.77) * 0.3
       + Math.sin(x * 4.1 + seed * 13.31) * 0.15;
}

// gentle waves along the ring — a soft undulation rather than a spiky crackle
function flowNoise(x, seed) {
  const n = noise(x, seed);
  return Math.sign(n) * Math.pow(Math.abs(n), 0.85);
}

// a few slow-drifting "bright spots" that softly pulse brighter, like current
// gently pooling as it flows around the ring — no hard spikes
const HOTSPOTS = 4;
const hotspotSeeds = Array.from({ length: HOTSPOTS }, (_, i) => i * 12.9 + 1.7);

function hotspotBoost(theta, t) {
  let boost = 0;
  for (let i = 0; i < HOTSPOTS; i++) {
    const seed = hotspotSeeds[i];
    const center = ((Math.sin(t * (0.15 + i * 0.04) + seed) * 0.5 + 0.5)) * Math.PI * 2;
    let d = Math.abs(theta - center);
    d = Math.min(d, Math.PI * 2 - d);
    const width = 0.4;
    const flicker = 0.65 + 0.35 * Math.sin(t * (3 + i * 1.3) + seed * 3);
    boost += Math.exp(-(d * d) / (width * width)) * flicker;
  }
  return boost;
}

function ringPoint(theta, t, seed, jitterAmt) {
  const baseX = Math.cos(theta) * RADIUS_X;
  const baseZ = Math.sin(theta) * RADIUS_Z;
  const n1 = flowNoise(theta * 3.0 + t * 1.1, seed);
  const n2 = flowNoise(theta * 6.5 - t * 1.7, seed + 50);
  const hb = hotspotBoost(theta, t);
  const r = 1
    + n1 * jitterAmt * 0.06
    + n2 * jitterAmt * 0.03
    + hb * jitterAmt * 0.035;
  const y = n2 * jitterAmt * 0.10 + hb * jitterAmt * 0.05 * Math.sign(n1);
  return new THREE.Vector3(baseX * r, y, baseZ * r);
}

// group everything that makes up the portal so it can gently breathe & rotate
const portalGroup = new THREE.Group();
scene.add(portalGroup);

// ---------- Strand meshes (glow layers + hot core) ----------
function makeStrandMesh(color, radius, opacity) {
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
  mesh.userData.radius = radius;
  portalGroup.add(mesh);
  return mesh;
}

const glowFar   = makeStrandMesh(0x1846b0, 0.16, 0.18); // soft deep-blue halo, widest
const glowOuter = makeStrandMesh(0x2f8fe6, 0.095, 0.4);
const glowMid   = makeStrandMesh(0x7fe0ff, 0.05, 0.65);
const core      = makeStrandMesh(0xffffff, 0.018, 1.0);

function buildStrand(mesh, t, seed, jitterAmt) {
  const pts = [];
  for (let i = 0; i <= SEGMENTS; i++) {
    const theta = (i / SEGMENTS) * Math.PI * 2;
    pts.push(ringPoint(theta, t, seed, jitterAmt));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  const geo = new THREE.TubeGeometry(curve, SEGMENTS, mesh.userData.radius, 12, true);
  mesh.geometry.dispose();
  mesh.geometry = geo;
}

// ---------- Soft spark wisps drifting just off the ring surface ----------
const MAX_SPARKS = 26;
const sparkGeo = new THREE.BufferGeometry();
const sparkPositions = new Float32Array(MAX_SPARKS * 2 * 3);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
const sparkMat = new THREE.LineBasicMaterial({
  color: 0xbfe8ff, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const sparks = new THREE.LineSegments(sparkGeo, sparkMat);
portalGroup.add(sparks);

const sparkLife = new Array(MAX_SPARKS).fill(0);
const sparkData = new Array(MAX_SPARKS).fill(null);

function spawnSpark(i, t) {
  const theta = Math.random() * Math.PI * 2;
  const p0 = ringPoint(theta, t, 1, 1);
  const dir = new THREE.Vector3(
    Math.random() - 0.5,
    Math.random() * 0.5,
    Math.random() - 0.5
  ).normalize();
  const len = 0.12 + Math.random() * 0.28;
  const p1 = p0.clone().add(dir.multiplyScalar(len));
  sparkData[i] = { p0, p1 };
  sparkLife[i] = 0.15 + Math.random() * 0.25;
}

// ---------- Interior crossing bolts (jagged chords across the portal) ----------
const MAX_CHORDS = 3;
const CHORD_SEGS = 24;
const chordLines = [];
const chordLife = new Array(MAX_CHORDS).fill(0);
const chordSeed = new Array(MAX_CHORDS).fill(0).map(() => Math.random() * 100);

for (let c = 0; c < MAX_CHORDS; c++) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array((CHORD_SEGS + 1) * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0xdcf3ff, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const line = new THREE.Line(geo, mat);
  portalGroup.add(line);
  chordLines.push({ line, positions });
}

function buildChord(slot, t) {
  const theta0 = Math.random() * Math.PI * 2;
  const theta1 = theta0 + Math.PI * (0.6 + Math.random() * 0.8);
  const p0 = ringPoint(theta0, t, 1, 0.3);
  const p1 = ringPoint(theta1, t, 1, 0.3);
  const seed = chordSeed[slot];
  const positions = chordLines[slot].positions;
  for (let i = 0; i <= CHORD_SEGS; i++) {
    const f = i / CHORD_SEGS;
    const base = new THREE.Vector3().lerpVectors(p0, p1, f);
    const wobble = flowNoise(f * 10 + t * 6, seed) * 0.22 * Math.sin(f * Math.PI);
    base.y += wobble;
    base.x += flowNoise(f * 7 + t * 5, seed + 30) * 0.14 * Math.sin(f * Math.PI);
    positions[i * 3] = base.x; positions[i * 3 + 1] = base.y; positions[i * 3 + 2] = base.z;
  }
  chordLines[slot].line.geometry.attributes.position.needsUpdate = true;
}
let nextChordFlash = 1.6 + Math.random() * 2.4;

// ---------- Floating embers drifting up through the portal ----------
const MAX_EMBERS = 60;
const emberGeo = new THREE.BufferGeometry();
const emberPositions = new Float32Array(MAX_EMBERS * 3);
const emberColors = new Float32Array(MAX_EMBERS * 3);
emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('color', new THREE.BufferAttribute(emberColors, 3));
const emberCanvas = document.createElement('canvas');
emberCanvas.width = emberCanvas.height = 64;
const ectx = emberCanvas.getContext('2d');
const grad = ectx.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.4, 'rgba(190,230,255,0.8)');
grad.addColorStop(1, 'rgba(190,230,255,0)');
ectx.fillStyle = grad;
ectx.fillRect(0, 0, 64, 64);
const emberTexture = new THREE.CanvasTexture(emberCanvas);
const emberMat = new THREE.PointsMaterial({
  size: 0.1, map: emberTexture, transparent: true, opacity: 0.9,
  vertexColors: true, blending: THREE.AdditiveBlending,
  depthWrite: false, sizeAttenuation: true
});
const embers = new THREE.Points(emberGeo, emberMat);
portalGroup.add(embers);

const emberState = Array.from({ length: MAX_EMBERS }, () => ({
  pos: new THREE.Vector3(0, -999, 0), vel: new THREE.Vector3(), life: 0, maxLife: 1
}));

function spawnEmber(e) {
  const theta = Math.random() * Math.PI * 2;
  const p = ringPoint(theta, clock.elapsedTime, 1, 0.6);
  e.pos.copy(p);
  e.vel.set((Math.random() - 0.5) * 0.06, 0.25 + Math.random() * 0.35, (Math.random() - 0.5) * 0.06);
  e.maxLife = 1.4 + Math.random() * 1.6;
  e.life = e.maxLife;
}

// ---------- Soft inner shimmer — a faint glowing "membrane" inside the portal ----------
const shimmerCanvas = document.createElement('canvas');
shimmerCanvas.width = shimmerCanvas.height = 256;
const sctx = shimmerCanvas.getContext('2d');
const sgrad = sctx.createRadialGradient(128, 128, 0, 128, 128, 128);
sgrad.addColorStop(0, 'rgba(140,210,255,0.35)');
sgrad.addColorStop(0.6, 'rgba(90,160,240,0.12)');
sgrad.addColorStop(1, 'rgba(90,160,240,0)');
sctx.fillStyle = sgrad;
sctx.fillRect(0, 0, 256, 256);
const shimmerTexture = new THREE.CanvasTexture(shimmerCanvas);
const shimmerMat = new THREE.MeshBasicMaterial({
  map: shimmerTexture, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
});
const shimmer = new THREE.Mesh(new THREE.CircleGeometry(1, 48), shimmerMat);
shimmer.rotation.x = -Math.PI / 2;
shimmer.scale.set(RADIUS_X * 0.94, RADIUS_Z * 0.94, 1);
portalGroup.add(shimmer);

// ---------- Faint starfield for depth ----------
const STAR_COUNT = 300;
const starGeo = new THREE.BufferGeometry();
const starPositions = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  const r = 20 + Math.random() * 30;
  const a = Math.random() * Math.PI * 2;
  const h = (Math.random() - 0.5) * 20;
  starPositions[i * 3] = Math.cos(a) * r;
  starPositions[i * 3 + 1] = h + 4;
  starPositions[i * 3 + 2] = Math.sin(a) * r;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({
  size: 0.05, color: 0xaad4ff, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- Animate ----------
const clock = new THREE.Clock();
let flashIntensity = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  buildStrand(glowFar,   t, 2, 1.1);
  buildStrand(glowOuter, t, 0, 1.0);
  buildStrand(glowMid,   t, 5, 0.85);
  buildStrand(core,      t, 9, 0.55);

  for (let i = 0; i < MAX_SPARKS; i++) {
    sparkLife[i] -= dt;
    if (sparkLife[i] <= 0 && Math.random() < 0.04) {
      spawnSpark(i, t);
    }
    const d = sparkData[i];
    const base = i * 6;
    if (d && sparkLife[i] > 0) {
      sparkPositions[base]     = d.p0.x; sparkPositions[base + 1] = d.p0.y; sparkPositions[base + 2] = d.p0.z;
      sparkPositions[base + 3] = d.p1.x; sparkPositions[base + 4] = d.p1.y; sparkPositions[base + 5] = d.p1.z;
    } else {
      sparkPositions[base]     = 0; sparkPositions[base + 1] = 0; sparkPositions[base + 2] = 0;
      sparkPositions[base + 3] = 0; sparkPositions[base + 4] = 0; sparkPositions[base + 5] = 0;
    }
  }
  sparkGeo.attributes.position.needsUpdate = true;

  // embers: rise, drift, and fade in/out smoothly
  for (let i = 0; i < MAX_EMBERS; i++) {
    const e = emberState[i];
    e.life -= dt;
    if (e.life <= 0 && Math.random() < 0.03) spawnEmber(e);
    if (e.life > 0) {
      e.pos.addScaledVector(e.vel, dt);
      const fade = Math.min(1, (e.maxLife - e.life) * 3) * Math.min(1, e.life * 1.5);
      emberPositions[i * 3] = e.pos.x;
      emberPositions[i * 3 + 1] = e.pos.y;
      emberPositions[i * 3 + 2] = e.pos.z;
      emberColors[i * 3] = fade; emberColors[i * 3 + 1] = fade; emberColors[i * 3 + 2] = fade;
    } else {
      emberColors[i * 3] = 0; emberColors[i * 3 + 1] = 0; emberColors[i * 3 + 2] = 0;
    }
  }
  emberGeo.attributes.position.needsUpdate = true;
  emberGeo.attributes.color.needsUpdate = true;

  // occasional gentle flash across a random chord of the portal
  nextChordFlash -= dt;
  if (nextChordFlash <= 0) {
    const slot = Math.floor(Math.random() * MAX_CHORDS);
    buildChord(slot, t);
    chordLife[slot] = 0.35 + Math.random() * 0.25;
    flashIntensity = 0.6;
    nextChordFlash = 1.6 + Math.random() * 2.6;
  }
  for (let c = 0; c < MAX_CHORDS; c++) {
    chordLife[c] -= dt;
    const mat = chordLines[c].line.material;
    mat.opacity = chordLife[c] > 0 ? Math.min(1, chordLife[c] * 3) * 0.55 : 0;
  }

  // gentle flicker of the bloom strength, plus a soft glow bump when a chord flashes
  flashIntensity *= Math.pow(0.02, dt);
  bloomPass.strength = 1.5
    + Math.sin(t * 3.0) * 0.06
    + Math.sin(t * 7.0) * 0.04
    + flashIntensity * 0.5;

  controls.update();

  // the whole portal breathes slowly and rotates at a graceful, imperceptible pace
  const breathe = 1 + Math.sin(t * 0.5) * 0.015;
  portalGroup.scale.set(breathe, breathe, breathe);
  portalGroup.rotation.y = t * 0.04;

  // the inner shimmer softly pulses, like the membrane of the portal breathing
  shimmerMat.opacity = 0.4 + Math.sin(t * 0.8) * 0.12 + flashIntensity * 0.15;

  // stars twinkle gently as a group
  starMat.opacity = 0.35 + Math.sin(t * 0.6) * 0.08;

  // very subtle drift, barely perceptible, applied after controls so it isn't
  // overwritten by the orbit recalculation
  const shake = 0.003 + flashIntensity * 0.01;
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.y += (Math.random() - 0.5) * shake;

  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
