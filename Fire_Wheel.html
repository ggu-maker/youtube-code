<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Wheel</title>
<style>
  :root{
    --bg-top:#0b0604;
    --bg-bot:#1a0a04;
    --ember-core:#fff6d0;
    --ember-mid:#ffb238;
    --ember-hot:#ff5a1f;
    --ember-deep:#8a1a06;
    --smoke:#2a1108;
    --panel-bg:rgba(15,8,5,0.55);
    --panel-border:rgba(255,140,50,0.25);
    --text:#ffe3c2;
    --text-dim:#c98a54;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 20%, var(--bg-bot) 0%, var(--bg-top) 70%);
    overflow:hidden;
    font-family:'Georgia', 'Times New Roman', serif;
    color:var(--text);
  }
  #stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    display:block;
    cursor:grab;
    touch-action:none;
  }
  canvas.dragging{ cursor:grabbing; }

  #title{
    position:absolute;
    top:22px; left:50%;
    transform:translateX(-50%);
    text-align:center;
    letter-spacing:0.35em;
    font-size:13px;
    text-transform:uppercase;
    color:var(--text-dim);
    pointer-events:none;
    text-shadow:0 0 12px rgba(255,90,20,0.5);
  }
  #title span{
    display:block;
    font-size:26px;
    letter-spacing:0.12em;
    color:var(--ember-mid);
    margin-top:4px;
    text-shadow:0 0 18px rgba(255,120,30,0.65), 0 0 40px rgba(255,60,0,0.3);
  }

  #hint{
    position:absolute;
    bottom:110px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:0.08em;
    color:var(--text-dim);
    opacity:0.85;
    pointer-events:none;
    transition:opacity 0.6s ease;
  }

  #panel{
    position:absolute;
    bottom:24px; left:50%; transform:translateX(-50%);
    display:flex; gap:22px; align-items:center;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    padding:12px 22px;
    border-radius:999px;
    backdrop-filter:blur(6px);
    box-shadow:0 0 30px rgba(255,80,20,0.15), inset 0 0 20px rgba(255,140,50,0.05);
  }
  .ctrl{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ctrl label{
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-dim);
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:110px; height:4px;
    background:linear-gradient(90deg, var(--ember-deep), var(--ember-hot), var(--ember-mid));
    border-radius:4px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:var(--ember-core);
    box-shadow:0 0 8px var(--ember-mid), 0 0 2px #fff;
    cursor:pointer;
    border:none;
  }
  .swatches{ display:flex; gap:6px; }
  .swatch{
    width:18px; height:18px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
    cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .swatch:hover{ transform:scale(1.15); }
  .swatch.active{ border-color:#fff; box-shadow:0 0 10px currentColor; }

  #btnBurst{
    background:linear-gradient(180deg, var(--ember-mid), var(--ember-hot));
    border:1px solid rgba(255,200,120,0.5);
    color:#2a0f00;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:11px;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 0 16px rgba(255,110,20,0.5);
    transition:transform 0.1s ease, box-shadow 0.15s ease;
    font-family:inherit;
  }
  #btnBurst:hover{ transform:translateY(-1px); box-shadow:0 0 24px rgba(255,140,40,0.7); }
  #btnBurst:active{ transform:translateY(0px) scale(0.97); }

  @media (max-width:640px){
    #panel{ flex-wrap:wrap; justify-content:center; width:88vw; padding:14px; gap:14px;}
    #title span{ font-size:20px; }
    #hint{ display:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="title">A wheel of embers<span>FIRE WHEEL</span></div>
  <div id="hint">drag the wheel to spin it &middot; click anywhere for a spark burst</div>
  <canvas id="c"></canvas>
  <div id="panel">
    <div class="ctrl">
      <label>Speed</label>
      <input id="speed" type="range" min="0" max="100" value="35">
    </div>
    <div class="ctrl">
      <label>Blaze</label>
      <input id="intensity" type="range" min="10" max="100" value="55">
    </div>
    <div class="ctrl">
      <label>Flame</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <button id="btnBurst">Ignite</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const speedSlider = document.getElementById('speed');
  const intensitySlider = document.getElementById('intensity');
  const burstBtn = document.getElementById('btnBurst');
  const swatchWrap = document.getElementById('swatches');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- palettes ----------
  const palettes = [
    { name:'ember',  core:'#fff6d0', mid:'#ffb238', hot:'#ff5a1f', deep:'#8a1a06' },
    { name:'inferno', core:'#fffdf0', mid:'#ff5b17', hot:'#d40e0e', deep:'#4a0303' },
    { name:'azure',  core:'#eafcff', mid:'#5ad3ff', hot:'#1f6bff', deep:'#0a1c8a' },
    { name:'veridian', core:'#f2ffe0', mid:'#8dff5a', hot:'#12b34a', deep:'#053a1a' },
    { name:'violet', core:'#fdeaff', mid:'#d65aff', hot:'#8b1fff', deep:'#2c0a6b' }
  ];
  let paletteIdx = 0;
  function applyPalette(i){
    paletteIdx = i;
    const p = palettes[i];
    document.documentElement.style.setProperty('--ember-core', p.core);
    document.documentElement.style.setProperty('--ember-mid', p.mid);
    document.documentElement.style.setProperty('--ember-hot', p.hot);
    document.documentElement.style.setProperty('--ember-deep', p.deep);
    [...swatchWrap.children].forEach((s,idx)=>s.classList.toggle('active', idx===i));
  }
  palettes.forEach((p,i)=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (i===0?' active':'');
    s.style.background = `radial-gradient(circle at 30% 30%, ${p.core}, ${p.mid} 40%, ${p.hot} 75%, ${p.deep})`;
    s.style.color = p.hot;
    s.addEventListener('click', ()=>applyPalette(i));
    swatchWrap.appendChild(s);
  });

  function currentColors(){
    const p = palettes[paletteIdx];
    return p;
  }

  // ---------- wheel state ----------
  let angle = 0;
  let angularVel = 0.012;     // radians per frame baseline
  const SPOKES = 8;
  let radius = 0;
  function computeRadius(){
    radius = Math.min(W, H) * 0.26;
  }
  computeRadius();
  window.addEventListener('resize', computeRadius);

  // user drag control
  let dragging = false;
  let lastAngleForDrag = 0;
  let lastPointerAngle = 0;
  let lastPointerTime = 0;
  let dragVelSamples = [];

  function centerPoint(){
    const r = canvas.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }
  function pointerAngle(clientX, clientY){
    const c = centerPoint();
    return Math.atan2(clientY - c.y, clientX - c.x);
  }

  function onPointerDown(e){
    dragging = true;
    canvas.classList.add('dragging');
    hint.style.opacity = '0';
    const pt = e.touches ? e.touches[0] : e;
    lastPointerAngle = pointerAngle(pt.clientX, pt.clientY);
    lastPointerTime = performance.now();
    dragVelSamples = [];
  }
  function onPointerMove(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const now = performance.now();
    const a = pointerAngle(pt.clientX, pt.clientY);
    let delta = a - lastPointerAngle;
    // normalize delta to [-PI, PI]
    while(delta > Math.PI) delta -= Math.PI*2;
    while(delta < -Math.PI) delta += Math.PI*2;
    angle += delta;
    const dt = Math.max(now - lastPointerTime, 1);
    const vel = delta / dt * 16.6; // approx per-frame at 60fps
    dragVelSamples.push(vel);
    if(dragVelSamples.length > 6) dragVelSamples.shift();
    lastPointerAngle = a;
    lastPointerTime = now;
  }
  function onPointerUp(){
    if(!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    if(dragVelSamples.length){
      const avg = dragVelSamples.reduce((s,v)=>s+v,0) / dragVelSamples.length;
      angularVel = avg;
    }
    setTimeout(()=>{ hint.style.opacity = '0.85'; }, 2500);
  }
  canvas.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, {passive:true});
  window.addEventListener('touchmove', onPointerMove, {passive:true});
  window.addEventListener('touchend', onPointerUp);

  // click (not drag) => spark burst at click point
  let downTime = 0, downPos = {x:0,y:0};
  canvas.addEventListener('pointerdown', (e)=>{
    downTime = performance.now();
    downPos = {x:e.clientX, y:e.clientY};
  });
  canvas.addEventListener('pointerup', (e)=>{
    const dt = performance.now() - downTime;
    const dist = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
    if(dt < 220 && dist < 6){
      const r = canvas.getBoundingClientRect();
      spawnBurst(e.clientX - r.left, e.clientY - r.top, 46);
    }
  });
  burstBtn.addEventListener('click', ()=>{
    spawnBurst(W/2, H/2 - radius, 60);
    spawnBurst(W/2, H/2 + radius, 60);
    spawnBurst(W/2 - radius, H/2, 60);
    spawnBurst(W/2 + radius, H/2, 60);
  });

  // ---------- particles ----------
  let particles = [];
  const MAX_PARTICLES = 900;

  function rand(a,b){ return a + Math.random()*(b-a); }

  function spawnEmber(x,y, biasUp){
    const col = currentColors();
    particles.push({
      x, y,
      vx: rand(-0.4,0.4),
      vy: rand(-1.6,-0.5) * (biasUp?1.4:1),
      life: 0,
      maxLife: rand(40,90),
      size: rand(2,5.5),
      hue: Math.random(),
      type:'ember'
    });
  }
  function spawnBurst(x,y,count){
    for(let i=0;i<count;i++){
      const a = rand(0, Math.PI*2);
      const spd = rand(1.2,4.2);
      particles.push({
        x, y,
        vx: Math.cos(a)*spd,
        vy: Math.sin(a)*spd - 1.2,
        life:0,
        maxLife: rand(30,60),
        size: rand(1.5,4),
        hue: Math.random(),
        type:'spark'
      });
    }
    if(particles.length > MAX_PARTICLES){
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
  }

  function updateParticles(intensity){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life++;
      if(p.type==='ember'){
        p.vy -= 0.006; // buoyancy
        p.vx += Math.sin(p.life*0.1 + p.x)*0.02;
        p.x += p.vx;
        p.y += p.vy;
      } else {
        p.vy += 0.05; // gravity for sparks
        p.vx *= 0.98;
        p.x += p.vx;
        p.y += p.vy;
      }
      if(p.life > p.maxLife) particles.splice(i,1);
    }
  }

  function drawParticles(){
    const col = currentColors();
    ctx.globalCompositeOperation = 'lighter';
    for(const p of particles){
      const t = p.life / p.maxLife;
      const fade = 1 - t;
      const size = p.size * (p.type==='spark' ? fade : (1 + t*0.6));
      const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,size*3.2);
      grad.addColorStop(0, col.core);
      grad.addColorStop(0.25, col.mid);
      grad.addColorStop(0.6, col.hot);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = Math.max(fade,0) * (p.type==='spark'?1:0.9);
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(size*3.2,0.1), 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- wheel drawing ----------
  function drawWheel(cx, cy, intensity){
    const col = currentColors();

    // outer glow halo
    const halo = ctx.createRadialGradient(cx,cy,radius*0.4,cx,cy,radius*2.2);
    halo.addColorStop(0, 'rgba(255,140,50,'+ (0.12 + intensity*0.002) +')');
    halo.addColorStop(1, 'rgba(255,140,50,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx,cy,radius*2.2,0,Math.PI*2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle);

    // rim (double ring, metallic dark with hot inner edge)
    ctx.beginPath();
    ctx.arc(0,0,radius, 0, Math.PI*2);
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#140a06';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0,0,radius, 0, Math.PI*2);
    ctx.lineWidth = 4;
    const rimGrad = ctx.createLinearGradient(-radius,-radius,radius,radius);
    rimGrad.addColorStop(0, col.hot);
    rimGrad.addColorStop(0.5, col.mid);
    rimGrad.addColorStop(1, col.hot);
    ctx.strokeStyle = rimGrad;
    ctx.shadowColor = col.hot;
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // spokes
    for(let i=0;i<SPOKES;i++){
      const a = (Math.PI*2/SPOKES) * i;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(radius*0.94,0);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#1c0e07';
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(radius*0.2,0);
      ctx.lineTo(radius*0.94,0);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = col.mid;
      ctx.globalAlpha = 0.55;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // hub
    const hubR = radius*0.16;
    const hubGrad = ctx.createRadialGradient(0,0,0,0,0,hubR);
    hubGrad.addColorStop(0, col.core);
    hubGrad.addColorStop(0.5, col.mid);
    hubGrad.addColorStop(1, col.deep);
    ctx.beginPath();
    ctx.arc(0,0,hubR,0,Math.PI*2);
    ctx.fillStyle = hubGrad;
    ctx.shadowColor = col.hot;
    ctx.shadowBlur = 22;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(0,0,hubR,0,Math.PI*2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#0a0503';
    ctx.stroke();

    ctx.restore();

    // ember emission points at spoke tips (world space, not rotated with draw restore)
    for(let i=0;i<SPOKES;i++){
      const a = angle + (Math.PI*2/SPOKES) * i;
      const ex = cx + Math.cos(a)*radius;
      const ey = cy + Math.sin(a)*radius;
      if(Math.random() < 0.55 + intensity*0.004){
        spawnEmber(ex + rand(-4,4), ey + rand(-4,4), true);
      }
    }
    // rim shimmer embers
    if(Math.random() < 0.5 + intensity*0.004){
      const a = angle + rand(0, Math.PI*2);
      const ex = cx + Math.cos(a)*radius;
      const ey = cy + Math.sin(a)*radius;
      spawnEmber(ex, ey, false);
    }
  }

  // ---------- main loop ----------
  let lastT = performance.now();
  function loop(t){
    const dt = Math.min((t - lastT)/16.6, 3);
    lastT = t;

    const speedVal = parseFloat(speedSlider.value); // 0-100
    const intensityVal = parseFloat(intensitySlider.value); // 10-100

    if(!dragging){
      const target = 0.004 + (speedVal/100) * 0.05;
      // ease angularVel toward target * sign preserved, with slow decay from flings
      angularVel += (target - angularVel) * 0.02;
    }
    angle += angularVel * dt;

    ctx.clearRect(0,0,W,H);

    const cx = W/2, cy = H/2;
    drawWheel(cx, cy, intensityVal);
    updateParticles(intensityVal);
    drawParticles();

    requestAnimationFrame(loop);
  }

  applyPalette(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
