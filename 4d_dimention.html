<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4D Tesseract — Glowing Hypercube</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at center, #0a0a14 0%, #030308 100%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #cv {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #ui {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 22px;
    align-items: center;
    background: rgba(15,15,28,0.65);
    backdrop-filter: blur(10px);
    padding: 14px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    color: #cfd3ff;
    font-size: 13px;
  }
  #ui label { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  input[type=range] {
    -webkit-appearance: none;
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg,#5b4bff,#00e5c7);
    border-radius: 3px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px 2px rgba(0,229,199,0.8);
    cursor: pointer;
  }
  #pauseBtn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: #cfd3ff;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  #pauseBtn:hover { background: rgba(255,255,255,0.14); }
  #title {
    position: fixed;
    top: 22px;
    left: 26px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="title">Tesseract · 4D rotation</div>
<canvas id="cv"></canvas>
<div id="ui">
  <label>XW plane<input type="range" id="xw" min="0" max="100" value="35"></label>
  <label>YZ plane<input type="range" id="yz" min="0" max="100" value="18"></label>
  <label>ZW plane<input type="range" id="zw" min="0" max="100" value="26"></label>
  <button id="pauseBtn">Pause</button>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener('resize', resize);

// --- Build tesseract vertices & edges ---
const verts = [];
for (let x=-1;x<=1;x+=2)
for (let y=-1;y<=1;y+=2)
for (let z=-1;z<=1;z+=2)
for (let w=-1;w<=1;w+=2)
  verts.push([x,y,z,w]);

const edges = [];
for (let i=0;i<verts.length;i++)
for (let j=i+1;j<verts.length;j++){
  let diff = 0;
  for (let k=0;k<4;k++) if (verts[i][k]!==verts[j][k]) diff++;
  if (diff===1) edges.push([i,j]);
}

let aXW=0, aYZ=0, aZW=0;
let paused = false;

const xwSlider = document.getElementById('xw');
const yzSlider = document.getElementById('yz');
const zwSlider = document.getElementById('zw');
const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Play' : 'Pause';
});

function rotate4([x,y,z,w], axw, ayz, azw){
  let c = Math.cos(axw), s = Math.sin(axw);
  let nx = x*c - w*s, nw = x*s + w*c;
  x = nx; w = nw;

  c = Math.cos(ayz); s = Math.sin(ayz);
  let ny = y*c - z*s, nz = y*s + z*c;
  y = ny; z = nz;

  c = Math.cos(azw); s = Math.sin(azw);
  let nz2 = z*c - w*s, nw2 = z*s + w*c;
  z = nz2; w = nw2;

  return [x,y,z,w];
}

function project(v){
  const distW = 2.6;
  const wScale = 1/(distW - v[3]);
  const x3 = v[0]*wScale, y3 = v[1]*wScale, z3 = v[2]*wScale;
  const distZ = 3.0;
  const zScale = 1/(distZ - z3);
  return [x3*zScale, y3*zScale, z3];
}

// Colors: violet -> cyan glow gradient by depth
function depthColor(t){
  // t: 0 (far) -> 1 (near)
  const r = Math.round(91 + t*(0 - 91));
  const g = Math.round(75 + t*(229 - 75));
  const b = Math.round(255 + t*(199 - 255));
  return `${r},${g},${b}`;
}

let trailAlpha = 0.22;

function draw(){
  const w = window.innerWidth, h = window.innerHeight;

  // trailing fade for a soft motion-blur / glow accumulation
  ctx.fillStyle = `rgba(3,3,8,${trailAlpha})`;
  ctx.fillRect(0,0,w,h);

  const cx = w/2, cy = h/2;
  const scale = Math.min(w,h) * 0.34;

  const projected = verts.map(v => project(rotate4(v, aXW, aYZ, aZW)));

  let minZ = Infinity, maxZ = -Infinity;
  projected.forEach(p => { if(p[2]<minZ) minZ=p[2]; if(p[2]>maxZ) maxZ=p[2]; });
  const range = (maxZ - minZ) || 1;

  // edges with glow
  edges.forEach(([i,j]) => {
    const a = projected[i], b = projected[j];
    const depth = (a[2]+b[2])/2;
    const t = (depth - minZ)/range;
    const color = depthColor(t);

    const ax = cx + a[0]*scale, ay = cy + a[1]*scale;
    const bx = cx + b[0]*scale, by = cy + b[1]*scale;

    ctx.save();
    ctx.shadowColor = `rgba(${color},0.9)`;
    ctx.shadowBlur = 14 + t*18;
    ctx.strokeStyle = `rgba(${color},${0.55 + t*0.4})`;
    ctx.lineWidth = 1.1 + t*1.8;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.restore();
  });

  // vertices as glowing points
  projected.forEach(p => {
    const t = (p[2]-minZ)/range;
    const color = depthColor(t);
    const x = cx + p[0]*scale, y = cy + p[1]*scale;
    const r = 2 + t*3;

    ctx.save();
    ctx.shadowColor = `rgba(${color},1)`;
    ctx.shadowBlur = 20 + t*10;
    ctx.fillStyle = `rgba(${color},1)`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function loop(){
  if (!paused){
    aXW += (xwSlider.value/100) * 0.018;
    aYZ += (yzSlider.value/100) * 0.018;
    aZW += (zwSlider.value/100) * 0.018;
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
